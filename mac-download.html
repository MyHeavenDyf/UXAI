<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="下载适用于 macOS 的 Octo Agent" />
    <title>下载 Octo Agent for macOS</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        background: #f5f7fb;
        color: #16181d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 720px);
        padding: 48px;
        border: 1px solid #e2e7f0;
        border-radius: 20px;
        background: #ffffff;
        box-shadow: 0 20px 60px rgb(34 55 90 / 10%);
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 5vw, 40px);
        line-height: 1.2;
      }

      .intro {
        margin: 16px 0 32px;
        color: #5d6472;
        font-size: 16px;
        line-height: 1.7;
      }

      .downloads {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .download-card {
        display: flex;
        min-height: 156px;
        flex-direction: column;
        justify-content: space-between;
        padding: 24px;
        border: 1px solid #dfe5ee;
        border-radius: 14px;
        color: inherit;
        text-decoration: none;
        transition:
          transform 160ms ease,
          border-color 160ms ease,
          box-shadow 160ms ease;
      }

      .download-card:hover,
      .download-card:focus-visible {
        transform: translateY(-2px);
        border-color: #1769ff;
        box-shadow: 0 12px 28px rgb(23 105 255 / 14%);
        outline: none;
      }

      .download-card strong {
        font-size: 20px;
      }

      .download-card span {
        color: #697180;
        font-size: 14px;
        line-height: 1.6;
      }

      .download-card b {
        color: #1769ff;
        font-size: 15px;
      }

      .help {
        margin: 28px 0 0;
        color: #7a8290;
        font-size: 13px;
        line-height: 1.7;
      }

      @media (max-width: 600px) {
        main {
          padding: 32px 24px;
        }

        .downloads {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>下载 Octo Agent</h1>
      <p class="intro">请选择与你的 Mac 芯片类型匹配的安装包。</p>

      <section class="downloads" aria-label="macOS 安装包">
        <a
          class="download-card"
          href="https://octo.hdesign.huawei.com/design/agentdesktop/mac-arm64/prod/octo-desktop-mac-arm64.dmg"
        >
          <strong>Apple 芯片</strong>
          <span>适用于 M1、M2、M3、M4 及后续 Apple Silicon Mac</span>
          <b>下载 ARM64 版本 →</b>
        </a>

        <a
          class="download-card"
          href="https://octo.hdesign.huawei.com/design/agentdesktop/mac-x64/prod/octo-desktop-mac-x64.dmg"
        >
          <strong>Intel 芯片</strong>
          <span>适用于搭载 Intel 处理器的 Mac</span>
          <b>下载 x64 版本 →</b>
        </a>
      </section>

      <p class="help">不知道芯片类型？点击屏幕左上角的苹果菜单，然后选择“关于本机”进行查看。</p>
    </main>
  </body>
</html>
