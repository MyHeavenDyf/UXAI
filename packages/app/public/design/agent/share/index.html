<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OctoAgent - 分享对话</title>
  <link rel="icon" type="image/svg+xml" href="./OctoLogo.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #ffffff;
      color: #191919;
      display: flex;
      flex-direction: column;
    }
    /* ── header ── */
    .header {
      height: 64px;
      flex-shrink: 0;
      background: #fff;
      border-bottom: 1px solid rgba(0, 0, 0, 0.1);
      position: relative;
    }
    .header-inner {
      width: 100%;
      height: 100%;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .header-logo {  height: 24px; flex-shrink: 0; }
    /* title 覆盖层:容器与 .chat-scroll-view 完全一致(1024px 居中 + 12px padding),
       使 title 左边界对齐 conversation-list 左边界;pointer-events: none 让点击穿透到下方 logo/button */
    .header-title-bar {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      pointer-events: none;
    }
    .header-title {
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      padding: 0 12px;
      font-size: 16px;
      font-weight: 500;
      line-height: 24px;
      color: #191919;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      /* 窄屏下避让两侧:左侧 logo(24px padding + 90px logo = 114px)、
         右侧 button(~164px + 24px padding + 16px gap ≈ 220px) */
      padding-left: 114px;
      padding-right: 220px;
    }
    /* 宽屏:title 左边界恢复 12px,对齐 conversation-list 左边界 */
    @media (min-width: 1230px) {
      .header-title {
        padding-left: 12px;
      }
    }
    .header-btn {
      padding: 8px 16px;
      border: 0;
      border-radius: 24px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 400;
      line-height: 22px;
      color: #fff;
      background: #0055ff;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .header-btn:hover { background: #0858d8; }
    .header-btn-icon { width: 14px; height: 14px; display: block; flex-shrink: 0; }
    .open-app-dialog {
      width: min(452px, calc(100vw - 48px));
      margin: auto;
      border: 0;
      border-radius: 16px;
      padding: 24px;
      color: #191919;
    }
    .open-app-dialog::backdrop { background: rgba(25, 25, 25, .3); }
    .open-app-dialog h2 { font-size: 16px; line-height: 24px; margin: 0 32px 4px 0; }
    .open-app-dialog p { font-size: 14px; line-height: 22px; color: #666; }
    .dialog-close { position: absolute; top: 18px; right: 18px; border: 0; background: transparent; font-size: 24px; cursor: pointer; }
    .dialog-action { display: flex; justify-content: center; margin-top: 24px; }
    .dialog-action a { display: inline-flex; align-items: center; gap: 6px; border-radius: 24px; background: #0055ff; color: #fff; padding: 10px 24px; font-size: 14px; line-height: 22px; text-decoration: none; }
    .open-app-dialog .dialog-hint { text-align: center; margin-top: 16px; }
    .open-app-dialog .dialog-hint a { color: #0055ff; cursor: pointer; text-decoration: none; }
    /* ── conversation（对齐 design 页面 ScrollView + make-chat-content 结构）── */
    .content {
      flex: 1;
      width: 100%;
      display: flex;
      overflow-y: auto;
      background: #fff;
      scrollbar-width: thin;
      scrollbar-color: rgba(0, 0, 0, 0.15) transparent;
    }
    .content::-webkit-scrollbar {
      width: 4px;
      height: 4px;
    }
    .content::-webkit-scrollbar-track {
      background: transparent;
    }
    .content::-webkit-scrollbar-thumb {
      background-color: rgba(0, 0, 0, 0.15);
      border-radius: 9999px;
    }
    .content::-webkit-scrollbar-thumb:hover {
      background-color: rgba(0, 0, 0, 0.3);
    }
    .chat-scroll-view {
      width: 100%;
      max-width: 1024px;
      margin: 0 auto;
      background: #fff;
      /* 对齐 design ScrollView: 0 12px 16px 12px */
      padding: 0 12px 16px 12px;
    }
    .chat-content {
      /* 对齐 .make-chat-content.pt-4 */
      padding-top: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    #conversation-list {
      /* turn 间距 16px 对齐 design .make-chat-content gap-4;
         内容区距顶部 12px、底部 60px(分享页留白,独立于 design 的 16px 底距) */
      padding: 12px 0 60px 0;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    /* ── 空状态(无接口内容/无数据):图片+文案整体在内容区上下左右居中 ── */
    .chat-scroll-view.is-empty {
      display: flex;
      flex-direction: column;
      padding-bottom: 0;
    }
    .chat-scroll-view.is-empty .chat-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      padding-top: 0;
    }
    .chat-scroll-view.is-empty #conversation-list {
      flex: 1;
      align-items: center;
      justify-content: center;
      padding: 0;
    }
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .empty-state-img {
      width: 150px;
      height: 150px;
      object-fit: contain;
      display: block;
    }
    .empty-state-text {
      font-size: 14px;
      line-height: 22px;
      color: rgba(0, 0, 0, 0.5);
    }
    .turn {
      /* 对齐 .octo-make-turn.flex.flex-col.gap-4;relative 承载 hover 元信息 */
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }
    .turn-user-row {
      /* 对齐 .flex.flex-col.items-end.gap-4.px-3 */
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 16px;
      padding: 0 12px;
    }
    .bubble-user {
      background: rgba(10, 89, 247, 0.08);
      padding: 12px 16px;
      border-radius: 16px 16px 2px 16px;
      color: #191919;
      font-size: 14px;
      line-height: 22px;
      white-space: pre-wrap;
      word-break: break-word;
      max-width: 85%;
      display: inline-block;
      /* 对齐 design ExpandableBubble:外层容器 relative + overflow hidden */
      position: relative;
      overflow: hidden;
    }
    /* ── 长用户消息折叠/展开(对齐 design expandable-bubble.tsx) ── */
    .bubble-user[data-expandable="true"]:not([data-expanded="true"]) .bubble-user-content {
      /* design MAX_CONTENT_HEIGHT = 222 */
      max-height: 222px;
      overflow: hidden;
    }
    .bubble-user[data-expandable="true"][data-expanded="true"] {
      /* design: 展开时为右下角按钮预留底部空间 */
      padding-bottom: 38px;
    }
    .bubble-user-mask,
    .bubble-expand-btn { display: none; }
    .bubble-user[data-expandable="true"] .bubble-expand-btn { display: inline-flex; }
    .bubble-user[data-expandable="true"]:not([data-expanded="true"]) .bubble-user-mask { display: block; }
    .bubble-user-mask {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      /* design MASK_HEIGHT = 60 */
      height: 60px;
      background: linear-gradient(0deg, rgba(236,242,255,1) 50.226%, rgba(236,242,255,0.9) 70.355%, rgba(236,242,255,0) 100%);
      pointer-events: none;
    }
    .bubble-expand-btn {
      position: absolute;
      bottom: 12px;
      right: 16px;
      /* display 由上方 .bubble-user[data-expandable] 规则控制,此处不可再写 display,
         否则同优先级靠后覆盖 display:none,短气泡也会出现按钮并与文字重叠 */
      align-items: center;
      gap: 4px;
      padding: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(0, 0, 0, 0.6);
      font-size: 14px;
      line-height: 22px;
      z-index: 1;
    }
    .bubble-expand-btn .bubble-expand-chevron {
      display: inline-flex;
      align-items: center;
      transition: transform 200ms cubic-bezier(0.4, 0, 0.2, 1);
    }
    .bubble-user[data-expanded="true"] .bubble-expand-chevron {
      transform: rotate(180deg);
    }
    /* ── 用户图片附件(对齐 design InsightTurn: 80×80 缩略图,右对齐,在气泡上方) ── */
    .user-attachments {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 16px;
    }
    .user-image-thumb {
      width: 80px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      flex-shrink: 0;
      background-color: rgba(0, 0, 0, 0.05);
      cursor: default;
    }
    .user-image-thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .turn-assistant-row {
      /* 对齐 design .px-4 */
      padding: 0 16px;
    }
    .text-assistant {
      color: #191919;
      font-size: 14px;
      line-height: 22px;
    }
    /* ── markdown 渲染(对齐 design [data-component="markdown"]) ── */
    .text-assistant[data-component="markdown"] {
      overflow-wrap: break-word;
      line-height: 160%;
    }
    .text-assistant[data-component="markdown"] > *:first-child { margin-top: 0; }
    .text-assistant[data-component="markdown"] > *:last-child { margin-bottom: 0; }
    .text-assistant[data-component="markdown"] h1,
    .text-assistant[data-component="markdown"] h2,
    .text-assistant[data-component="markdown"] h3,
    .text-assistant[data-component="markdown"] h4,
    .text-assistant[data-component="markdown"] h5,
    .text-assistant[data-component="markdown"] h6 {
      font-size: 14px;
      color: #191919;
      font-weight: 500;
      margin: 0 0 8px 0;
      line-height: 1.4;
    }
    .text-assistant[data-component="markdown"] strong,
    .text-assistant[data-component="markdown"] b {
      color: #191919;
      font-weight: 500;
    }
    .text-assistant[data-component="markdown"] p { margin: 0 0 8px 0; }
    .text-assistant[data-component="markdown"] a {
      color: #0a59f7;
      text-decoration: none;
    }
    .text-assistant[data-component="markdown"] a:hover { text-decoration: underline; text-underline-offset: 2px; }
    .text-assistant[data-component="markdown"] ul,
    .text-assistant[data-component="markdown"] ol {
      margin: 8px 0;
      padding-left: 32px;
      list-style-position: outside;
    }
    .text-assistant[data-component="markdown"] ul { list-style-type: disc; }
    .text-assistant[data-component="markdown"] ol { list-style-type: decimal; padding-left: 2.25rem; }
    .text-assistant[data-component="markdown"] li { margin-bottom: 8px; }
    .text-assistant[data-component="markdown"] li > p:first-child { display: inline; margin: 0; }
    .text-assistant[data-component="markdown"] li > ul,
    .text-assistant[data-component="markdown"] li > ol { margin: 0.25rem 0; padding-left: 1rem; }
    .text-assistant[data-component="markdown"] blockquote {
      border-left: 2px solid #E5E7EB;
      margin: 1.5rem 0;
      padding-left: 0.5rem;
      color: rgba(0,0,0,0.6);
      font-style: normal;
    }
    .text-assistant[data-component="markdown"] hr { border: none; height: 0; margin: 0; }
    /* ── 行内代码(对齐 design markdown.css :not(pre) > code:品牌蓝文字、无背景) ── */
    .text-assistant[data-component="markdown"] :not(pre) > code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      color: #0A59F7;
      font-weight: 500;
    }
    /* ── 代码块(对齐 design [data-component="markdown-code"]:48px 头部 + 复制/展开按钮) ── */
    .text-assistant[data-component="markdown"] [data-component="markdown-code"] {
      position: relative;
      background: #f9f9fb;
      border-radius: 16px;
      overflow: hidden;
      margin: 16px 0;
    }
    .text-assistant[data-component="markdown"] [data-slot="markdown-code-header"] {
      height: 48px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 4px;
      flex-shrink: 0;
      background: #f9f9fb;
    }
    .text-assistant[data-component="markdown"] [data-slot="markdown-code-lang"] {
      margin-right: auto;
      font-size: 14px;
      line-height: 22px;
      color: rgba(0, 0, 0, 0.9);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .markdown-code-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: rgba(0, 0, 0, 0.6);
      cursor: pointer;
      flex-shrink: 0;
    }
    .markdown-code-btn:hover { background: rgba(0, 0, 0, 0.05); }
    .markdown-code-btn svg { width: 16px; height: 16px; display: block; }
    .markdown-code-btn .icon-check { display: none; }
    .markdown-code-btn[data-copied="true"] .icon-copy { display: none; }
    .markdown-code-btn[data-copied="true"] .icon-check { display: block; }
    .text-assistant[data-component="markdown"] [data-component="markdown-code"]:not([data-expandable="true"]) [data-action="expand"] {
      display: none;
    }
    .text-assistant[data-component="markdown"] [data-component="markdown-code"] [data-action="expand"] svg {
      transition: transform 0.2s;
    }
    .text-assistant[data-component="markdown"] [data-component="markdown-code"][data-expanded="true"] [data-action="expand"] svg {
      transform: rotate(180deg);
    }
    .text-assistant[data-component="markdown"] [data-component="markdown-code"] pre {
      margin: 0;
      overflow: auto;
      max-height: 320px;
      overscroll-behavior: contain;
    }
    .text-assistant[data-component="markdown"] [data-component="markdown-code"]:not([data-expandable="true"]) pre,
    .text-assistant[data-component="markdown"] [data-component="markdown-code"][data-expanded="true"] pre {
      max-height: none;
      overflow: visible;
    }
    .text-assistant[data-component="markdown"] [data-component="markdown-code"] pre code {
      display: block;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      font-size: 13px;
      padding: 0 16px 16px 16px;
      white-space: pre;
    }
    .text-assistant[data-component="markdown"] [data-component="markdown-code"] pre::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .text-assistant[data-component="markdown"] [data-component="markdown-code"] pre::-webkit-scrollbar-thumb {
      border-radius: 5px;
      background: transparent;
    }
    .text-assistant[data-component="markdown"] [data-component="markdown-code"]:hover pre::-webkit-scrollbar-thumb {
      background: rgba(223, 223, 223, 1);
    }
    /* ── 表格(对齐 design markdown.css table) ── */
    .text-assistant[data-component="markdown"] table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
      font-size: 14px;
      display: block;
      overflow-x: auto;
    }
    .text-assistant[data-component="markdown"] th,
    .text-assistant[data-component="markdown"] td {
      border-bottom: 1px solid #f0f0f0;
      padding: 12px;
      text-align: left;
      vertical-align: top;
    }
    .text-assistant[data-component="markdown"] th {
      color: #191919;
      font-weight: 500;
      border-bottom: 1px solid #e5e5e5;
    }
    /* ── artifact 输出卡片(对齐 design InsightTurn outputCards) ── */
    .artifact-card {
      margin: 0 12px;
      padding: 16px 20px;
      border-radius: 12px;
      background: linear-gradient(90deg, rgba(245,248,255,1) 0%, rgba(255,255,255,1) 50%);
      border: 1px solid rgba(0,0,0,0.1);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .artifact-card-icon { width: 28px; height: 28px; flex-shrink: 0; }
    .artifact-card-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 0; }
    .artifact-card-title {
      color: rgb(25,25,25);
      font-size: 14px;
      line-height: 22px;
      font-weight: 500;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .artifact-card-meta { color: #777; font-size: 12px; line-height: 22px; }
    /* ── 思考过程折叠块(对齐 design insight-turn.tsx ReasoningCollapsed) ── */
    .turn-reasoning {
      /* 对齐 design .mx-3 */
      margin: 0 12px;
    }
    .reasoning-toggle {
      display: inline-flex;
      align-items: center;
      gap: 2px;
      padding: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: #191919;
      font-size: 12px;
      line-height: 18px;
      user-select: none;
      text-align: left;
    }
    .reasoning-toggle svg {
      color: #777;
      transition: transform 0.2s ease;
    }
    .reasoning-toggle[data-open="true"] svg {
      transform: rotate(180deg);
    }
    .reasoning-body {
      margin-top: 16px;
      padding-left: 12px;
      border-left: 1px solid rgba(0, 0, 0, 0.08);
      font-size: 12px;
      line-height: 18px;
      color: #777;
      max-height: 300px;
      overflow: auto;
    }
    .reasoning-body p {
      margin: 0;
      white-space: pre-wrap;
      user-select: text;
    }
    .reasoning-divider {
      margin: 6px 0;
      border-top: 1px dashed rgba(0, 0, 0, 0.08);
    }
    /* ── 非图片附件 chip(对齐 design InsightTurn 附件 fallback) ── */
    .user-file-chip {
      background: rgba(0, 0, 0, 0.05);
      padding: 8px 12px;
      border-radius: 8px;
      color: rgba(0, 0, 0, 0.9);
      font-size: 14px;
      line-height: 22px;
      gap: 6px;
      display: inline-flex;
      align-items: center;
      max-width: 200px;
      cursor: default;
    }
    .user-file-chip img { width: 24px; height: 24px; flex-shrink: 0; display: inline-block; }
    .user-file-chip .chip-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* ── 工具调用卡(对齐 design tool-call-card.tsx) ── */
    .tool-cards { display: flex; flex-direction: column; gap: 8px; }
    .tool-card {
      margin: 0 12px;
      padding: 8px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      border-radius: 6px;
      background: #ffffff;
      border: 1px solid #E5E7EB;
    }
    button.tool-card { cursor: pointer; text-align: left; width: 100%; }
    .tool-card .tool-label { color: rgba(0, 0, 0, 0.6); flex-shrink: 0; }
    .tool-card .tool-count { color: #191919; flex-shrink: 0; }
    .tool-card .tool-spacer { flex: 1; }
    .tool-card .tool-summary { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #191919; }
    .tool-card .tool-chevron { color: #BFBFBF; transition: transform 0.15s; flex-shrink: 0; display: inline-flex; }
    .tool-card[data-open="true"] .tool-chevron { transform: rotate(90deg); }
    .tool-group { margin: 0 12px; }
    .tool-group > .tool-card { margin: 0; }
    .tool-group-items { margin-top: 8px; display: none; flex-direction: column; gap: 8px; }
    .tool-group-items[data-open="true"] { display: flex; }
    .tool-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      margin-left: auto;
      flex-shrink: 0;
    }
    .tool-badge-running { background: rgba(10, 89, 247, 0.08); color: #0a59f7; }
    .tool-badge-done { background: rgba(227, 249, 238, 1); color: rgba(0, 205, 94, 1); }
    .tool-badge-error { background: rgba(0, 0, 0, 0.05); color: rgba(0, 0, 0, 0.6); }
    .tool-badge .pulse-dot,
    .st-badge .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 9999px;
      background: currentColor;
      animation: octo-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      flex-shrink: 0;
    }
    @keyframes octo-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    /* ── 文件操作摘要(对齐 design FileOpsSummary) ── */
    .file-ops {
      margin: 0 12px;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      border-radius: 6px;
      background: #ffffff;
      border: 1px solid #E5E7EB;
    }
    .file-ops-head { display: flex; align-items: center; gap: 6px; font-size: 11px; color: rgba(0, 0, 0, 0.6); }
    .file-ops-row { display: flex; align-items: center; gap: 6px; font-size: 11px; }
    .file-ops-row .file-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #191919; }
    .op-badge { display: inline-flex; align-items: center; justify-content: center; width: 16px; height: 16px; border-radius: 4px; font-size: 10px; font-weight: 700; }
    .op-badge-w { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
    .op-badge-e { background: rgba(168, 85, 247, 0.1); color: #a855f7; }
    .op-badge-r { background: rgba(107, 114, 128, 0.1); color: #6b7280; }
    /* ── 涉及文件列表(对齐 design ProducedFilesList) ── */
    .produced-files { margin: 0 12px; }
    .produced-files-box { padding: 6px 10px; display: flex; flex-direction: column; gap: 4px; border-radius: 6px; background: #ffffff; border: 1px solid rgba(0, 0, 0, 0.1); }
    .produced-files-label { font-size: 11px; color: rgba(0, 0, 0, 0.6); }
    .produced-files-row { display: flex; align-items: center; gap: 6px; font-size: 12px; color: #191919; }
    .produced-files-row .file-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* ── 子任务卡(对齐 design InsightTurn subtasks) ── */
    .subtask-card { margin: 0 12px; border-radius: 8px; border: 1px solid rgba(0, 0, 0, 0.1); background: #ffffff; }
    .subtask-head {
      width: 100%;
      padding: 6px 10px;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      text-align: left;
      background: transparent;
      border: 0;
      cursor: pointer;
    }
    .subtask-head .st-chevron { color: #BFBFBF; transition: transform 0.15s; display: inline-flex; flex-shrink: 0; }
    .subtask-head[data-open="true"] .st-chevron { transform: rotate(90deg); }
    .subtask-head .st-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #191919; font-weight: 500; }
    .subtask-head .st-count { font-size: 11px; color: #BFBFBF; flex-shrink: 0; }
    .st-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      flex-shrink: 0;
    }
    .st-badge-running { background: rgba(59, 130, 246, 0.1); color: #3b82f6; }
    .st-badge-done { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
    .st-badge-cancelled { background: rgba(156, 163, 175, 0.1); color: #6b7280; }
    .st-badge-error { background: rgba(0, 0, 0, 0.05); color: rgba(0, 0, 0, 0.6); }
    .subtask-body { border-top: 1px solid #E5E7EB; }
    .subtask-texts { padding: 6px 10px; font-size: 12px; line-height: 1.625; max-height: 120px; overflow: auto; color: rgba(0, 0, 0, 0.6); }
    .subtask-texts p { margin: 0 0 4px; white-space: pre-wrap; }
    .subtask-texts p:last-child { margin-bottom: 0; }
    .subtask-outputs { padding: 6px 10px; display: flex; flex-direction: column; gap: 6px; }
    .subtask-outputs.has-texts { border-top: 1px solid #E5E7EB; }
    .subtask-outputs-label { font-size: 10px; color: #BFBFBF; margin-bottom: 4px; }
    .subtask-output {
      padding: 6px 8px;
      border-radius: 8px;
      background: rgba(10, 89, 247, 0.03);
      border: 1px solid rgba(10, 89, 247, 0.08);
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: default;
    }
    .subtask-output img { width: 28px; height: 28px; flex-shrink: 0; }
    .subtask-output .so-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
    .subtask-output .so-title { font-size: 12px; line-height: 22px; font-weight: 500; color: rgb(25, 25, 25); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .subtask-output .so-preview { font-size: 12px; line-height: 22px; color: rgb(25, 25, 25); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    /* ── 压缩/中断分隔线(对齐 design MessageDivider) ── */
    .msg-divider { display: flex; align-items: center; gap: 12px; width: 100%; }
    .msg-divider .line { flex: 1 1 auto; height: 1px; background: #e5e5e5; }
    .msg-divider .label { flex: 0 0 auto; white-space: nowrap; text-align: center; font-size: 12px; color: #8f8f8f; }
    /* ── 错误/停滞提示(对齐 design MakeErrorNotice / 压缩提示) ── */
    .error-notice {
      margin: 0 12px;
      padding: 12px 16px;
      border-radius: 8px;
      background: rgba(254, 231, 232, 1);
      color: #191919;
      font-size: 14px;
      line-height: 22px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .error-notice .notice-title { font-weight: 500; }
    .error-notice svg { flex-shrink: 0; margin-top: 4px; }
    .stalled-notice {
      margin: 0 12px;
      padding: 8px 16px;
      font-size: 14px;
      line-height: 22px;
      border-radius: 6px;
      border: 1px solid rgba(234, 179, 8, 0.3);
      background: rgba(255, 247, 224, 1);
      color: #7a4f00;
    }
    /* ── turn 元信息 hover(对齐 design insight-turn-meta.css) ── */
    .turn-meta-wrapper {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      transform: translateY(100%);
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding: 0 12px;
      opacity: 0;
      transition: opacity 0.15s ease;
      pointer-events: none;
    }
    .turn:hover .turn-meta-wrapper,
    .turn:focus-within .turn-meta-wrapper { opacity: 1; }
    .turn-meta { user-select: none; font-size: 12px; line-height: 18px; color: rgba(0, 0, 0, 0.5); cursor: default; }
    /* ── 快速简报表单(静态展示,对齐 design QuickBriefFormView 锁定态) ── */
    .qform-card {
      max-width: 800px;
      padding: 16px 20px;
      margin: 0 auto;
      border-radius: 8px;
      background: #ffffff;
      border: 1px solid #E5E7EB;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
      opacity: 0.7;
    }
    .qform-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
    .qform-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 36px;
      height: 36px;
      flex-shrink: 0;
      background: #0a59f7;
      color: #fff;
      border-radius: 6px;
      font-size: 18px;
      font-weight: 600;
    }
    .qform-titles { flex: 1; min-width: 0; }
    .qform-title { font-weight: 600; font-size: 15px; color: #101828; margin-bottom: 4px; }
    .qform-desc { font-size: 13px; color: rgba(0, 0, 0, 0.6); line-height: 1.5; }
    .qform-pill { display: inline-flex; align-items: center; padding: 4px 10px; background: #f3f4f6; color: rgba(0, 0, 0, 0.6); border-radius: 999px; font-size: 11px; font-weight: 500; flex-shrink: 0; }
    .qform-body { display: flex; flex-direction: column; gap: 16px; }
    .qf-field { display: flex; flex-direction: column; gap: 8px; }
    .qf-label { display: flex; align-items: center; gap: 4px; font-weight: 500; font-size: 13px; color: #191919; }
    .qf-required { color: #ef4444; font-size: 12px; }
    .qf-options { display: flex; flex-wrap: wrap; gap: 6px; }
    .qf-chip {
      display: inline-flex;
      align-items: center;
      padding: 6px 12px;
      background: #f3f4f6;
      color: #191919;
      border: 1px solid #E5E7EB;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 500;
    }
    .qf-chip-on { background: #0a59f7; color: #fff; border-color: #0a59f7; }
    .qf-input,
    .qf-textarea {
      padding: 8px 12px;
      background: #f3f4f6;
      color: #191919;
      border: 1px solid #E5E7EB;
      border-radius: 6px;
      font-size: 13px;
      font-family: inherit;
      resize: vertical;
    }
    .qf-input::placeholder,
    .qf-textarea::placeholder { color: #9CA3AF; }
    .qform-foot {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid #E5E7EB;
    }
    .qf-locked-note { font-size: 12px; color: #9CA3AF; }

    /* ── studio 会话区(对齐 studio 页面 StudioConversation / studio-01~03.css) ── */
    /* 会话滚动区留白对齐 .studio-center-scroll .scroll-view__viewport: 36px 28px 22px */
    body[data-module="studio"] .chat-scroll-view { padding: 36px 28px 22px 28px; }
    body[data-module="studio"] .chat-content { padding-top: 0; gap: 0; }
    /* 对齐 studio-02.css @media (max-width: 1227px) .studio-conversation { padding: 24px } */
    @media (max-width: 1227px) {
      body[data-module="studio"] .chat-scroll-view { padding: 24px; }
    }

    .studio-conversation {
      display: flex;
      flex-direction: column;
      gap: 20px;
      width: 100%;
      margin: 0 auto;
    }

    .studio-conversation-turn {
      display: flex;
      flex-direction: column;
    }

    /* 参考图(对齐 .studio-user-input-images / .studio-user-input-image) */
    .studio-user-input-images {
      width: fit-content;
      max-width: 100%;
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
      margin-left: auto;
      margin-bottom: 16px;
    }
    .studio-user-input-image {
      width: 80px;
      height: 80px;
      display: block;
      object-fit: cover;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.04);
    }

    /* 用户气泡:右对齐、蓝色 tint、不可折叠(对齐 .studio-user-bubble) */
    .studio-user-bubble {
      width: fit-content;
      max-width: 450px;
      min-width: 0;
      min-height: 46px;
      display: flex;
      align-items: center;
      margin-left: auto;
      padding: 12px;
      border-radius: 16px 16px 2px 16px;
      background: rgba(10, 89, 247, 0.08);
      color: #191919;
      font-size: 14px;
      line-height: 22px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* @引用 chip(对齐 .studio-user-bubble-mention) */
    .studio-user-bubble-mention {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
      margin: 0 2px;
      height: 22px;
      background: rgba(15, 23, 42, 0.06);
      border-radius: 4px;
      white-space: nowrap;
      vertical-align: middle;
    }
    .studio-user-bubble-mention img {
      width: 16px;
      height: 16px;
      object-fit: cover;
      border-radius: 2px;
    }
    .studio-user-bubble-mention-name {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100px;
      min-width: 0;
    }

    /* 助手纯文本:左对齐、无 Markdown、pre-wrap(对齐 .studio-assistant-copy) */
    .studio-assistant-copy {
      margin-top: 20px;
      color: #191919;
      font-size: 14px;
      line-height: 28px;
      white-space: pre-wrap;
      font-weight: 400;
      overflow-wrap: anywhere;
      word-break: break-word;
    }

    /* 引导快捷入口(对齐 .studio-recommendation-shortcuts;分享页静态展示) */
    .studio-recommendation-shortcuts {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
      margin-top: 12px;
    }
    .studio-recommendation-shortcut {
      box-sizing: border-box;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      height: 34px;
      padding: 6px 12px;
      border: 0;
      border-radius: 6px;
      background: rgba(25, 25, 25, 0.05);
      color: rgba(25, 25, 25, 0.9);
      font-size: 14px;
      font-weight: 500;
      line-height: 22px;
      white-space: nowrap;
      cursor: default;
    }
    .studio-recommendation-shortcut svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* 编辑区入口(对齐 .studio-assistant-editor-link;分享页静态展示) */
    .studio-assistant-editor-link {
      width: fit-content;
      max-width: 100%;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 28px;
      padding: 0 18px;
      border-radius: 999px;
      color: #0a59f7;
      font-size: 15px;
      font-weight: 700;
      line-height: 22px;
    }
    .studio-editor-link-arrow {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* 结果卡片(对齐 .studio-result-card 家族) */
    .studio-result-card {
      margin-top: 20px;
      min-height: 258px;
      padding: 12px;
      border: 1px solid rgba(15, 23, 42, 0.12);
      border-radius: 8px;
      background: #fff;
    }
    .studio-result-card.failed,
    .studio-result-card.abnormal {
      min-height: 0;
    }
    /* 对齐 studio-03.css:有图片网格的卡片不保留固定最小高度 */
    .studio-result-card:has(.studio-result-grid) {
      min-height: 0;
    }
    .studio-result-card.failed .studio-result-progress-preview,
    .studio-result-card.abnormal .studio-result-progress-preview {
      min-height: 0;
    }
    .studio-result-card:has(.studio-result-grid) .studio-result-progress-preview {
      min-height: 0;
    }
    .studio-result-progress-header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      overflow: hidden;
    }
    .studio-result-progress-left {
      display: flex;
      align-items: center;
      gap: 12px;
      flex: 1 1 auto;
      min-width: 0;
    }
    .studio-result-progress-title {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      color: #191919;
      font-size: 12px;
      font-weight: 400;
      line-height: 100%;
      white-space: nowrap;
    }
    /* 能力图标(对齐 .studio-capability-icon:imgCreate1~7.svg 按能力序号取图) */
    .studio-result-progress-icon {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      background: url("./studio/imgCreate1.svg") center / contain no-repeat;
    }
    .studio-result-progress-icon-2 { background-image: url("./studio/imgCreate2.svg"); }
    .studio-result-progress-icon-3 { background-image: url("./studio/imgCreate3.svg"); }
    .studio-result-progress-icon-4 { background-image: url("./studio/imgCreate4.svg"); }
    .studio-result-progress-icon-5 { background-image: url("./studio/imgCreate5.svg"); }
    .studio-result-progress-icon-6 { background-image: url("./studio/imgCreate6.svg"); }
    .studio-result-progress-icon-7 { background-image: url("./studio/imgCreate7.svg"); }
    .studio-result-progress-status {
      padding: 3px 4px;
      border-radius: 6px;
      background: rgba(97, 91, 255, 0.08);
      color: #615bff;
      font-size: 10px;
      font-weight: 400;
      line-height: 100%;
      white-space: nowrap;
    }
    .studio-result-card.complete .studio-result-progress-status {
      background: rgba(28, 137, 92, 0.1);
      color: #1c895c;
    }
    .studio-result-card.failed .studio-result-progress-status {
      background: rgba(0, 0, 0, 0.05);
      color: rgba(0, 0, 0, 0.6);
    }
    .studio-result-meta {
      margin-top: 8px;
      color: rgba(25, 25, 25, 0.52);
      font-size: 12px;
      line-height: 16px;
    }
    .studio-result-progress-preview {
      min-height: 180px;
      margin-top: 8px;
      overflow: hidden;
      background: #fff;
    }
    /* 失败/异常文案(对齐 .studio-result-error-box) */
    .studio-result-error-box {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .studio-result-error-icon {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }
    .studio-result-error {
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.72);
      color: #191919;
      font-size: 12px;
      line-height: 20px;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* 图片网格(对齐 studio-03.css .studio-result-grid 及方向变体) */
    .studio-result-grid {
      display: flex;
      align-items: stretch;
      margin: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .studio-result-grid::-webkit-scrollbar { display: none; }

    .studio-result-thumb {
      position: relative;
      width: 96px;
      height: 144px;
      min-width: 96px;
      overflow: hidden;
      padding: 0;
      border: 0;
      border-radius: 3px;
      background: #fff;
      box-shadow: 0 8px 18px rgba(17, 24, 39, 0.08);
    }
    .studio-result-thumb img,
    .studio-result-thumb video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
    }

    .studio-result-grid.single-portrait,
    .studio-result-grid.single-landscape,
    .studio-result-grid.single-1x1 {
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    .studio-result-grid.single-portrait .studio-result-thumb,
    .studio-result-grid.single-landscape .studio-result-thumb,
    .studio-result-grid.single-1x1 .studio-result-thumb {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: auto;
      min-width: unset;
      box-shadow: none;
    }
    .studio-result-grid.single-portrait .studio-result-thumb {
      max-height: 210px;
      background: #f7f7f7;
    }
    .studio-result-grid.single-landscape .studio-result-thumb,
    .studio-result-grid.single-1x1 .studio-result-thumb {
      max-height: 180px;
    }
    .studio-result-grid.single-portrait .studio-result-thumb img,
    .studio-result-grid.single-portrait .studio-result-thumb video {
      max-width: 100%; max-height: 210px; width: auto; height: auto; object-fit: contain;
    }
    .studio-result-grid.single-landscape .studio-result-thumb img,
    .studio-result-grid.single-landscape .studio-result-thumb video,
    .studio-result-grid.single-1x1 .studio-result-thumb img,
    .studio-result-grid.single-1x1 .studio-result-thumb video {
      max-width: 100%; max-height: 180px; width: auto; height: auto; object-fit: contain;
    }

    .studio-result-grid.multi-landscape,
    .studio-result-grid.multi-1x1,
    .studio-result-grid.multi-portrait {
      gap: 4px;
      overflow-x: hidden;
    }
    .studio-result-grid.multi-landscape .studio-result-thumb,
    .studio-result-grid.multi-1x1 .studio-result-thumb,
    .studio-result-grid.multi-portrait .studio-result-thumb {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      min-width: 0;
      width: auto;
      height: auto;
      box-shadow: none;
    }
    .studio-result-grid.multi-landscape .studio-result-thumb img,
    .studio-result-grid.multi-landscape .studio-result-thumb video,
    .studio-result-grid.multi-1x1 .studio-result-thumb img,
    .studio-result-grid.multi-1x1 .studio-result-thumb video {
      max-width: 100%; max-height: 180px; width: auto; height: auto; object-fit: contain;
    }
    .studio-result-grid.multi-portrait .studio-result-thumb {
      max-height: 210px;
      background: #f7f7f7;
    }
    .studio-result-grid.multi-portrait .studio-result-thumb img,
    .studio-result-grid.multi-portrait .studio-result-thumb video {
      max-width: 100%; max-height: 210px; width: auto; height: auto; object-fit: contain;
    }
    /* 对齐 studio-03.css .multi-landscape-4:横构图 4 张固定宽度换行 */
    .studio-result-grid.multi-landscape-4 {
      flex-wrap: wrap;
      gap: 4px;
    }
    .studio-result-grid.multi-landscape-4 .studio-result-thumb {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 0 0 96px;
      height: auto;
      box-shadow: none;
    }
    .studio-result-grid.multi-landscape-4 .studio-result-thumb img,
    .studio-result-grid.multi-landscape-4 .studio-result-thumb video {
      width: 100%;
      height: auto;
      object-fit: contain;
    }
    /* 视频缩略图容器(对齐 .studio-result-thumb-video:相对定位承载时长徽标) */
    .studio-result-thumb-video {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      max-width: 100%;
      max-height: 100%;
      vertical-align: top;
      line-height: 0;
    }
    /* 媒体占位(对齐 .studio-media-thumbnail-placeholder 及 image/video 图标) */
    .studio-media-thumbnail-placeholder {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(145deg, #f3f4f6, #e5e7eb);
      color: rgba(17, 24, 39, 0.35);
    }
    .studio-media-thumbnail-placeholder.failed {
      background: #f2f2f2;
    }
    .studio-media-thumbnail-image-icon,
    .studio-media-thumbnail-video-icon {
      position: relative;
      display: inline-block;
      width: 22px;
      height: 18px;
      border: 1.5px solid currentColor;
      border-radius: 3px;
    }
    .studio-media-thumbnail-image-icon::before {
      content: "";
      position: absolute;
      left: 3px;
      bottom: 3px;
      width: 13px;
      height: 7px;
      background: currentColor;

    /* 视频时长徽标(对齐 .studio-file-manager-media-video-badge;结果卡仅文本 MM:SS) */
