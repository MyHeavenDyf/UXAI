    </div>
    <div class="header-title-bar">
      <h1 class="header-title" id="session-title"></h1>
    </div>
  </header>
  <dialog class="open-app-dialog" id="open-app-dialog" aria-labelledby="open-app-title" aria-describedby="open-app-description">
    <button type="button" class="dialog-close" id="close-app-dialog" aria-label="关闭">×</button>
    <h2 id="open-app-title">在 Octo Agent 内继续</h2>
    <p id="open-app-description">通过分享的链接开始你的对话</p>
    <div class="dialog-action"><a id="open-app-link">打开 Octo Agent<img src="./arrow_up_right.png" alt="" class="header-btn-icon" /></a></div>
    <p class="dialog-hint" id="open-app-hint">你安装了此应用吗？<a href="#" target="_blank" rel="noopener noreferrer">点击下载安装</a></p>
  </dialog>
  <main class="content">
    <div class="chat-scroll-view">
      <div class="chat-content">
        <div id="conversation-list"></div>
      </div>
    </div>
  </main>
  <script>
    // 轻量内联 markdown 渲染器(对齐 design Markdown 组件的视觉输出,无需 CDN 依赖)
    function escapeHtml(s) {
      return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    }
    function inlineMd(s) {
      // 先摘出行内 code span,避免 code 内容里的 **/_/~~ 被后续规则误伤(对齐 marked 的处理顺序)
      const codeSpans = []
      const withoutCode = s.replace(/`([^`]+)`/g, (full, code) => {
        codeSpans.push("<code>" + code + "</code>")
        return "\u0000" + (codeSpans.length - 1) + "\u0000"
      })
      const styled = withoutCode
        .replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img alt="$1" src="$2" />')
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*]+)\*/g, '<em>$1</em>')
        .replace(/~~([^~]+)~~/g, '<del>$1</del>')
      return styled.replace(/\u0000(\d+)\u0000/g, (full, i) => codeSpans[+i])
    }
    // 代码块(对齐 design [data-component="markdown-code]:头部语言标签 + 复制/展开按钮 + 320px 限高)
    const CODE_COPY_SVG = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" stroke="currentColor" stroke-width="1.2"/><path d="M10.5 3.5v-.5A1.5 1.5 0 0 0 9 1.5H3.5A1.5 1.5 0 0 0 2 3v5.5A1.5 1.5 0 0 0 3.5 10H4" stroke="currentColor" stroke-width="1.2"/></svg>'
    const CODE_CHECK_SVG = '<svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
    const CODE_CHEVRON_SVG = '<svg viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>'
    function codeBlockHtml(lang, code) {
      return (
        '<div data-component="markdown-code">' +
        '<div data-slot="markdown-code-header">' +
        (lang ? '<span data-slot="markdown-code-lang">' + escapeHtml(lang.toUpperCase()) + "</span>" : "") +
        '<button type="button" class="markdown-code-btn" data-action="copy" title="复制" aria-label="复制">' +
        '<span class="icon-copy">' + CODE_COPY_SVG + "</span>" +
        '<span class="icon-check">' + CODE_CHECK_SVG + "</span>" +
        "</button>" +
        '<button type="button" class="markdown-code-btn" data-action="expand" title="展开" aria-label="展开">' + CODE_CHEVRON_SVG + "</button>" +
        "</div>" +
        "<pre><code" + (lang ? ' class="language-' + escapeHtml(lang) + '"' : "") + ">" + escapeHtml(code) + "</code></pre>" +
        "</div>"
      )
    }
    // GFM 表格:| a | b | 紧跟 | --- | --- |
    function isTableRow(line) {
      const t = line.trim()
      return t.length > 1 && t.startsWith("|") && t.endsWith("|") && (t.match(/\|/g) || []).length >= 2
    }
    function isTableDivider(line) {
      const t = line.trim()
      return /^\|?[\s:|-]*-[\s:|-]*\|?$/.test(t) && t.includes("-")
    }
    function splitTableRow(line) {
      return line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|")
    }
    // 列表(支持缩进嵌套,对齐 marked 输出结构;li>ul/li>ol 的间距由 CSS 控制)
    const LIST_ITEM_RE = /^(\s*)([-*]|\d+\.)\s+(.*)$/
    function parseListItems(lines, i) {
      const items = []
      while (i < lines.length) {
        const m = LIST_ITEM_RE.exec(lines[i])
        if (m) {
          items.push({ indent: m[1].replace(/\t/g, "  ").length, ordered: /\d+\./.test(m[2]), text: m[3] })
          i++
          continue
        }
        // 列表项续行(缩进的非列表文本)并入上一项
        if (items.length > 0 && /^\s+\S/.test(lines[i]) && !/^```|^#{1,6}\s|^>/.test(lines[i].trim())) {
          items[items.length - 1].text += " " + lines[i].trim()
          i++
          continue
        }
        // 列表项之间的空行后仍是列表项 → 视为同一列表
        if (lines[i].trim() === "" && i + 1 < lines.length && LIST_ITEM_RE.test(lines[i + 1])) {
          i++
          continue
        }
        break
      }
      return [items, i]
    }
    function renderListNodes(items) {
      if (items.length === 0) return ""
      let html = items[0].ordered ? "<ol>" : "<ul>"
      let k = 0
      while (k < items.length) {
        const item = items[k]
        const children = []
        let j = k + 1
        while (j < items.length && items[j].indent > item.indent) {
          children.push(items[j])
          j++
        }
        html += "<li>" + inlineMd(escapeHtml(item.text))
        if (children.length > 0) html += renderListNodes(children)
        html += "</li>"
        k = j
      }
      return html + (items[0].ordered ? "</ol>" : "</ul>")
    }
    function renderMarkdown(text) {
      if (!text) return ""
      const lines = text.split("\n")
      let html = ""
      let i = 0
      while (i < lines.length) {
        const line = lines[i]
        // 代码块
        if (/^```/.test(line)) {
          const lang = line.replace(/^```/, "").trim()
          const buf = []
          i++
          while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++ }
          i++ // skip closing ```
          html += codeBlockHtml(lang, buf.join("\n"))
          continue
        }
        // 标题
        const hm = /^(#{1,6})\s+(.*)$/.exec(line)
        if (hm) { html += `<h${hm[1].length}>${inlineMd(escapeHtml(hm[2]))}</h${hm[1].length}>`; i++; continue }
        // 分隔线
        if (/^---+$/.test(line.trim())) { html += "<hr>"; i++; continue }
        // 表格
        if (isTableRow(line) && i + 1 < lines.length && isTableDivider(lines[i + 1])) {
          const header = splitTableRow(line)
          i += 2
          const rows = []
          while (i < lines.length && isTableRow(lines[i])) { rows.push(splitTableRow(lines[i])); i++ }
          html +=
            "<table><thead><tr>" +
            header.map((c) => "<th>" + inlineMd(escapeHtml(c.trim())) + "</th>").join("") +
            "</tr></thead><tbody>" +
            rows.map((r) => "<tr>" + r.map((c) => "<td>" + inlineMd(escapeHtml(c.trim())) + "</td>").join("") + "</tr>").join("") +
            "</tbody></table>"
          continue
        }
        // 列表(含嵌套)
        if (LIST_ITEM_RE.test(line)) {
          const [items, next] = parseListItems(lines, i)
          html += renderListNodes(items)
          i = next
          continue
        }
        // 引用
        if (/^>\s?/.test(line)) {
          const buf = []
          while (i < lines.length && /^>\s?/.test(lines[i])) { buf.push(lines[i].replace(/^>\s?/, "")); i++ }
          html += "<blockquote>" + inlineMd(escapeHtml(buf.join("\n"))) + "</blockquote>"
          continue
        }
        // 空行
        if (line.trim() === "") { i++; continue }
        // 段落(连续非空行合并;软换行不产生 <br>,对齐 marked 默认 breaks:false)
        const para = []
        while (i < lines.length && lines[i].trim() !== "" && !/^```|^#{1,6}\s|^\s*[-*]\s+|^\s*\d+\.\s+|^>\s?|^---+$/.test(lines[i])) {
          para.push(lines[i]); i++
        }
        html += "<p>" + inlineMd(escapeHtml(para.join("\n"))) + "</p>"
      }
      return html
    }

    // 提取用户可见文字(对齐 design insight-turn.tsx userText())
    // 1) 优先 metadata.displayText(@mention 显示文本)
    // 2) 否则取第一个 text part,用 lastIndexOf("\n---\n") 剥离系统前缀,只显示 --- 后的真实输入
    function extractUserText(parts) {
      const displayPart = parts.find(p => p.type === "text" && p.metadata && p.metadata.displayText)
      if (displayPart) return displayPart.metadata.displayText.trim()
      const textPart = parts.find(p => p.type === "text" && p.text)
      if (!textPart || !textPart.text) return ""
      const raw = textPart.text
      const sepIdx = raw.lastIndexOf("\n---\n")
      if (sepIdx !== -1) return raw.slice(sepIdx + 5).trim()
      return raw.trim()
    }

    // artifact type 映射(对齐 design ARTIFACT_TYPE_MAP)
    const ARTIFACT_TYPE_MAP = {
      html: "html", "text/html": "html",
      "text/html+deck": "deck", deck: "deck",
      svg: "svg", "image/svg+xml": "svg",
      "markdown-document": "markdown-document",
      "code-snippet": "code-snippet",
      "react-component": "react-component",
      diagram: "diagram",
      "text/design-plan": "design-plan",
      "text/link": "link",
    }
    // markdown 上下文跳过区(对齐 design artifact-markdown-context.ts computeSkipRanges):
    // 完整代码围栏 ```..``` 区间、行内代码 `..` 片段里的 <artifact> 开标签不参与产物解析,
    // 标签文字保留在 prose 中由 markdown 渲染为代码块;未闭合围栏之后的内容同样跳过
    function computeArtifactSkipRanges(buffer) {
      const ranges = []
      const blockRegions = []
      let pos = 0
      let inFence = false
      let fenceStart = -1
      let blockStart = -1
      const closeBlockBefore = (idx) => {
        if (blockStart !== -1 && idx > blockStart) blockRegions.push([blockStart, idx])
        blockStart = -1
      }
      while (pos < buffer.length) {
        const eol = buffer.indexOf("\n", pos)
        const lineEnd = eol === -1 ? buffer.length : eol
        const line = buffer.slice(pos, lineEnd)
        const lineHasNewline = eol !== -1
        if (!inFence) {
          if (lineHasNewline && /^```(\w[\w+-]*)?\s*$/.test(line)) {
            closeBlockBefore(pos)
            inFence = true
            fenceStart = pos
          } else if (line.trim() === "") {
            closeBlockBefore(pos)
          } else if (/^#{1,4}\s+/.test(line) || /^\s*[-*+]\s+/.test(line) || /^\s*\d+\.\s+/.test(line)) {
            closeBlockBefore(pos)
            blockRegions.push([pos, lineEnd])
          } else if (blockStart === -1) {
            blockStart = pos
          }
        } else if (lineHasNewline && /^```\s*$/.test(line)) {
          inFence = false
          ranges.push([fenceStart, eol + 1])
          fenceStart = -1
        }
        if (!lineHasNewline) break
        pos = eol + 1
      }
      if (!inFence) closeBlockBefore(buffer.length)
      for (const [s, e] of blockRegions) {
        const segment = buffer.slice(s, e)
        const inlineRe = /`[^`]+`/g
        let m
        while ((m = inlineRe.exec(segment))) ranges.push([s + m.index, s + m.index + m[0].length])
      }
      return { ranges, unclosedFenceStart: inFence ? fenceStart : null }
    }
    const rangeContainsSkipRange = (ranges, p) => ranges.some(([s, e]) => p >= s && p < e)
    // 从 from 起找下一个可解析的 <artifact 开标签(对齐 design findOpenTag):
    // 跳过围栏/行内代码区间与未闭合围栏之后的内容;<artifact 后必须跟空白(对齐 isRealArtifactOpenAt);
    // 属性值引号内的 > 不结束开标签,单/双引号属性均支持
    function findArtifactOpenTag(text, ranges, unclosedFenceStart, from) {
      const openRe = /<artifact/gi
      openRe.lastIndex = from
      let m
      while ((m = openRe.exec(text)) !== null) {
        const idx = m.index
        if (rangeContainsSkipRange(ranges, idx)) continue
        if (unclosedFenceStart !== null && idx >= unclosedFenceStart) return null
        const after = idx + "<artifact".length
        const next = text.charAt(after)
        if (next === "") return null
        if (!/\s/.test(next)) continue
        let j = after
        let quote = null
        while (j < text.length) {
          const c = text.charAt(j)
          if (quote !== null) {
            if (c === quote) quote = null
          } else if (c === '"' || c === "'") {
            quote = c
          } else if (c === ">") {
            return { start: idx, openEnd: j + 1, attrs: text.slice(after, j) }
          }
          j++
        }
        return null
      }
      return null
    }
    // 从 assistant 文本中提取已闭合的 <artifact> 标签(对齐 design parseAllArtifactsFromText)
    // 返回 { artifacts, prose },prose 为剥离 artifact 后的可见文字;
    // 未闭合的 artifact 不出卡,开标签之后的内容也不进 prose(对齐 design 不调用 flush 的处理)
    function extractArtifacts(text) {
      const artifacts = []
      if (!text || !/<artifact/i.test(text)) return { artifacts, prose: text || "" }
      const { ranges, unclosedFenceStart } = computeArtifactSkipRanges(text)
      let prose = ""
      let cursor = 0
      while (cursor < text.length) {
        const open = findArtifactOpenTag(text, ranges, unclosedFenceStart, cursor)
        if (!open) {
          prose += text.slice(cursor)
          break
        }
        prose += text.slice(cursor, open.start)
        const closeIdx = text.slice(open.openEnd).search(/<\/artifact>/i)
        if (closeIdx === -1) break
        const content = text.slice(open.openEnd, open.openEnd + closeIdx)
        const am = {}
        open.attrs.replace(/(\w+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g, (s, k, v1, v2) => { am[k] = v1 ?? v2 ?? "" })
        const artifactType = am.type || ""
        const mappedType = ARTIFACT_TYPE_MAP[artifactType]
        // design-plan / plan- 前缀不显示卡片(走 plan banner);未映射类型同样不出卡,
        // 两种情况下标签内容都从 prose 剥离(对齐 design)
        const isPlanArtifact = mappedType === "design-plan" || (am.identifier || "").startsWith("plan-")
        if (mappedType && !isPlanArtifact) {
          // link 类型:始终从 content(URL 或磁盘路径)派生标题,忽略 artifact 标签的 title 属性;
          // content 提取失败时才回退 title 属性(对齐 design parseAllArtifactsFromText)
          let title = am.title
          if (mappedType === "link") {
            const fromContent = extractLinkTitle(content)
            if (fromContent) title = fromContent
          }
          artifacts.push({
            title: title || mappedType,
            type: mappedType,
            content: content,
            artifactIdentifier: am.identifier || "",
          })
        }
        cursor = open.openEnd + closeIdx + "</artifact>".length
      }
      return { artifacts, prose: prose.replace(/\n{3,}/g, "\n\n").trim() }
    }
    // 从 link artifact 的 content(URL 或磁盘路径)提取卡片标题(对齐 design extractLinkTitle)
    // URL:        提取最后的文件名(含扩展名),无路径时回退到 host
    // 磁盘路径:   取最后一段并去掉格式后缀,保留 subtype
    // fastui://<产物名>:标题就是产物名
    function extractLinkTitle(content) {
      const trimmed = (content ?? "").trim()
      if (!trimmed) return ""
      if (trimmed.toLowerCase().startsWith("fastui://")) {
        let name = trimmed.slice("fastui://".length).replace(/\/+$/, "")
        try { name = decodeURIComponent(name) } catch {}
        if (/[/\\?#]/.test(name)) return ""
        return name || "本地预览"
      }
      if (/^https?:\/\//i.test(trimmed)) {
        try {
          const u = new URL(trimmed)
          const segments = u.pathname.split("/").filter(Boolean)
          if (segments.length > 0) {
            const last = segments[segments.length - 1]
            try { return decodeURIComponent(last) } catch { return last }
          }
          return u.host
        } catch {
          // fall through to path handling
        }
      }
      const parts = trimmed.split(/[/\\]/).filter(Boolean)
      const filename = parts.length > 0 ? parts[parts.length - 1] : trimmed
      const lastDot = filename.lastIndexOf(".")
      if (lastDot > 0) return filename.slice(0, lastDot)
      return filename
    }

    // 图片扩展名(对齐 design file-type-icons 的图片类型)
    const IMAGE_EXTS = ["png", "jpg", "jpeg", "gif", "webp", "svg", "bmp", "ico"]
    function isImageFile(filename, mime) {
      if (mime && mime.startsWith("image/")) return true
      const ext = (filename || "").split(".").pop().toLowerCase()
      return IMAGE_EXTS.includes(ext)
    }

    // 从 manifest.files 构建图片 blob URL 映射: { [basename]: { url, mime } }
    // blob 字段形如 "blobs/<sha256>",manifest 在 /tool{filePath}/manifest.json,
    // 故 blob 文件 URL 为 /tool{filePath}/{blob}
    function buildImageBlobMap(manifest, filePath) {
      const map = {}
      if (!manifest.files) return map
      for (const f of manifest.files) {
        const name = (f.path || "").split("/").pop()
        if (!name) continue
        const ext = (f.path || "").split(".").pop().toLowerCase()
        if (!IMAGE_EXTS.includes(ext)) continue
        const url = "/tool" + filePath + "/" + f.blob
        const mime = ext === "svg" ? "image/svg+xml" : "image/" + ext
        map[name] = { url, mime }
      }
      return map
    }

    // 异步加载 blob 为 object URL(blob 文件无扩展名,用预期 mime 强制类型确保 <img> 能渲染)
    async function loadBlobImage(blobUrl, token, expectedMime) {
      try {
        const res = await fetch(blobUrl, {
          method: "GET",
          credentials: "include",
          headers: token ? { uiplustoken: token } : {},
        })
        if (!res.ok) return blobUrl
        const raw = await res.blob()
        // 服务器未给正确 content-type 时,用 expectedMime 重建 blob
        if (expectedMime && (!raw.type || raw.type === "application/octet-stream")) {
          return URL.createObjectURL(new Blob([raw], { type: expectedMime }))
        }
        return URL.createObjectURL(raw)
      } catch {
        return blobUrl
      }
    }

    // 按 hostname 选 deep link scheme,与桌面端 packages/desktop/src/main/shared-session.ts 的 parseSharedSessionLink 对齐:
    //   beta(hostname 含 "beta") → octo-agent-beta (beta 桌面端注册)
    //   其余(含 localhost/127.0.0.1) → octo-agent  (Octo Agent 桌面端注册)
    // 注意:localhost 也用 octo-agent,避免唤起旧 opencode/electron 客户端。
    function pickDeepLinkScheme() {
      const host = location.hostname
      if (host.indexOf("beta") !== -1) return "octo-agent-beta"
      return "octo-agent"
    }

    // 安装包下载地址:按运行环境选择(Windows / macOS-Intel / macOS-Apple)。
    const INSTALLER_URL_WINDOWS = "https://octo.hdesign.huawei.com/design/agentdesktop/windows/prod/octo-desktop-win-x64.exe"
    const INSTALLER_URL_MAC_INTEL = "https://octo.hdesign.huawei.com/design/agentdesktop/mac-x64/prod/octo-desktop-mac-x64.dmg"
    const INSTALLER_URL_MAC_ARM = "https://octo.hdesign.huawei.com/design/agentdesktop/mac-arm64/prod/octo-desktop-mac-arm64.dmg"

    function detectOS() {
      const ua = navigator.userAgent || ""
      const platform = navigator.platform || ""
      if (/Windows|Win32|Win64/i.test(platform) || /Windows/i.test(ua)) return "windows"
      if (/Mac/i.test(platform) || /Mac OS X/i.test(ua)) return "mac"
      return "other"
    }

    // 浏览器无法用同步 API 区分 Apple/Intel 芯片:Chrome/Edge 走 UA-CH(architecture),
    // Safari 回退 WebGL renderer,仍无法判断时按 Apple 芯片(当前多数 Mac)处理。
    async function detectMacAppleSilicon() {
      if (/arm64|aarch64/i.test(navigator.userAgent || "")) return true
      if (navigator.userAgentData && navigator.userAgentData.getHighEntropyValues) {
        try {
          const data = await navigator.userAgentData.getHighEntropyValues(["architecture"])
          if (data && data.architecture) return data.architecture === "arm"
        } catch {}
      }
      try {
        const gl = document.createElement("canvas").getContext("webgl")
        const ext = gl && gl.getExtension("WEBGL_debug_renderer_info")
        const renderer = ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : ""
        if (/Apple/i.test(renderer)) return true
        if (/Intel|AMD|NVIDIA/i.test(renderer)) return false
      } catch {}
      return true
    }

    async function pickDownloadUrl() {
      const os = detectOS()
      if (os === "windows") return INSTALLER_URL_WINDOWS
      if (os === "mac") return (await detectMacAppleSilicon()) ? INSTALLER_URL_MAC_ARM : INSTALLER_URL_MAC_INTEL
      return INSTALLER_URL_WINDOWS
    }

    function renderInstallHint(url) {
      document.getElementById("open-app-hint").innerHTML =
        '你安装了此应用吗？<a href="' + url + '" target="_blank" rel="noopener noreferrer">点击下载安装</a>'
    }

    document.getElementById("continue-btn").addEventListener("click", () => {
      const name = (location.pathname.split("/").pop() || "").replace(/\.html$/, "")
      const uniqueId = name && name !== "index" ? name : new URLSearchParams(location.search).get("uniqueId") || ""
      const link = document.getElementById("open-app-link")
      const hint = document.getElementById("open-app-hint")
      if (/^[a-zA-Z0-9_-]{1,128}$/.test(uniqueId)) {
        link.href = `${pickDeepLinkScheme()}://share?uniqueId=${encodeURIComponent(uniqueId)}`
        hint.textContent = "你安装了此应用吗？点击下载安装"
        pickDownloadUrl().then(renderInstallHint).catch(() => {})
      } else {
        link.removeAttribute("href")
        hint.textContent = "分享码缺失或无效，请检查分享链接"
      }
      document.getElementById("open-app-dialog").showModal()
    })
    document.getElementById("close-app-dialog").addEventListener("click", () => {
      document.getElementById("open-app-dialog").close()
    })

    ;(async function () {
      // uniqueId 优先从路径提取（/design/agent/share/xxx.html → xxx）;
      // 路径为 index.html 时回退到 query 参数 uniqueId（兼容 /design/agent/share/index.html?uniqueId=xxx）
      let uniqueId = (location.pathname.split("/").pop() || "").replace(/\.html$/, "")
      if (!uniqueId || uniqueId === "index") {
        uniqueId = new URLSearchParams(location.search).get("uniqueId") || ""
      }
      if (!uniqueId) {
        console.error("[share] missing uniqueId")
        showEmptyState()
        return
      }

      // uiplustoken: 从 localStorage 读取（用户登录后由 desktop 主进程或登录流程写入）
      const token = localStorage.getItem("uiplusToken") || ""

      // 同源调用 getShareSessionInfo（生产环境天然同源,无 CORS）
      const infoUrl = "/main/rest.root/octoAgentServer/agentSession/getShareSessionInfo?uniqueId=" + encodeURIComponent(uniqueId)
      try {
        const res = await fetch(infoUrl, {
          method: "GET",
          credentials: "include",
          headers: token ? { uiplustoken: token } : {},
        })
        if (!res.ok) {
          console.error("[share] getShareSessionInfo HTTP " + res.status)
          showEmptyState()
          return
        }
        const data = await res.json()
        console.log("[share] getShareSessionInfo response:", data)
        if (data.errorCode === 400) {
          const loginBase = location.hostname.indexOf("beta") !== -1
            ? "https://login-beta.huawei.com/login1/"
            : "https://login.huawei.com/login1/"
          location.href = loginBase + "?redirect=" + encodeURIComponent(location.href)
          return
        }
        if (!data.success || !data.content) {
          console.error("[share] getShareSessionInfo success=false", data)
          showEmptyState()
          return
        }
        const filePath = data.content.versionInfo && data.content.versionInfo[0] && data.content.versionInfo[0].filePath
        if (filePath) loadConversation(filePath, token)
        else showEmptyState()
      } catch (err) {
        console.error("[share] getShareSessionInfo failed:", err)
        showEmptyState()
      }
    })()

    async function loadConversation(filePath, token) {
      const manifestUrl = "/tool" + filePath + "/manifest.json"
      try {
        const res = await fetch(manifestUrl, {
          method: "GET",
          credentials: "include",
          headers: token ? { uiplustoken: token } : {},
        })
        if (!res.ok) {
          console.error("[share] manifest HTTP " + res.status)
          showEmptyState()
          return
        }
        const manifest = await res.json()
        console.log("[share] manifest response:", manifest)
        renderConversation(manifest, filePath, token)
      } catch (err) {
        console.error("[share] manifest failed:", err)
        showEmptyState()
      }
    }

    // ─────────────────────────────────────────────────────────
    // 附件/文件图标(对齐 design kindFromMime + mimeFromFilename + file-type-icons kindIconMap)
    // ─────────────────────────────────────────────────────────
    // 图标基址用页面相对路径:独立部署的 share 服务挂载路径不一定是站根的
    // /design/agent/share/,相对路径随 share/ 目录整体部署到任何路径都能命中,
    // 与 ./studio/、./OctoLogo.svg 同一约定(dev/desktop 下解析结果不变)。
    const FILE_ICON_BASE = "./icons/"
    function mimeFromFilename(filename) {
      const ext = (filename || "").split(".").pop()?.toLowerCase() ?? ""
      const map = {
        png: "image/png", jpg: "image/jpeg", jpeg: "image/jpeg", gif: "image/gif", webp: "image/webp",
        svg: "image/svg+xml", html: "text/html", htm: "text/html", md: "text/markdown", txt: "text/plain",
        json: "application/json", js: "application/javascript", ts: "application/typescript", css: "text/css",
        pdf: "application/pdf", mp4: "video/mp4", webm: "video/webm", mp3: "audio/mpeg", wav: "audio/wav",
      }
      return map[ext] ?? "application/octet-stream"
    }
    function kindFromMime(mime) {
      if (!mime) return "binary"
      if (mime.startsWith("image/")) return "image"
      if (mime.startsWith("video/")) return "video"
      if (mime.startsWith("audio/")) return "audio"
      if (mime === "application/pdf") return "pdf"
      if (mime === "text/html") return "html"
      if (mime === "image/svg+xml") return "svg"
      if (mime === "text/markdown" || mime === "text/x-markdown") return "markdown"
      if (mime.startsWith("text/")) return "text"
      if (mime.includes("word") || mime.includes("docx")) return "document"
      if (mime.includes("excel") || mime.includes("xlsx") || mime.includes("spreadsheet")) return "document"
      if (mime.includes("powerpoint") || mime.includes("presentation")) return "document"
      return "binary"
    }
    function getFileIconUrl(kind, filename) {
      const ext = (filename || "").split(".").pop()?.toLowerCase() ?? ""
      if (kind === "folder") return FILE_ICON_BASE + "folder.svg"
      if (kind === "html") return FILE_ICON_BASE + "html.svg"
      if (kind === "image") return FILE_ICON_BASE + "img.svg"
      if (kind === "video") return FILE_ICON_BASE + "video.svg"
      if (kind === "markdown") return FILE_ICON_BASE + "MD.svg"
      if (kind === "code") return FILE_ICON_BASE + "code.svg"
      if (kind === "pdf") return FILE_ICON_BASE + "PDF.svg"
      if (kind === "svg") return FILE_ICON_BASE + "other.svg"
      if (kind === "document") {
        if (ext === "xlsx" || ext === "xls") return FILE_ICON_BASE + "Excel.svg"
        if (ext === "pptx" || ext === "ppt") return FILE_ICON_BASE + "ppt.svg"
        return FILE_ICON_BASE + "word.svg"
      }
      return FILE_ICON_BASE + "other.svg"
    }
    // [附件] synthetic 本地文件清单(对齐 design parseUploadedFiles:"- filename: path" 行)
    function parseUploadedFilesBlock(block) {
      const out = []
      for (const line of block.split("\n")) {
        const trimmed = line.trim()
        if (!trimmed.startsWith("- ")) continue
        const body = trimmed.slice(2)
        const sep = body.indexOf(": ")
        if (sep < 0) continue
        const filename = body.slice(0, sep).trim()
        const path = body.slice(sep + 2).trim()
        if (filename && path) out.push({ filename, path })
      }
      return out
    }
    function makeSpan(cls, text) {
      const s = document.createElement("span")
      s.className = cls
      s.textContent = text
      return s
    }
    function buildFileChip(filename, kind) {
      const chip = document.createElement("div")
      chip.className = "user-file-chip"
      chip.title = filename
      const icon = document.createElement("img")
      icon.src = getFileIconUrl(kind, filename)
      icon.alt = ""
      chip.appendChild(icon)
      chip.appendChild(makeSpan("chip-name", filename))
      return chip
    }
    // 用户气泡文本:@mention 渲染为带 8px 边距的 chip,其余纯文本
    // (对齐 design renderMentionText:mention 边界由零宽空格标记,chip 前后各插一个)
    function buildUserBubbleContent(text) {
      const fragment = document.createDocumentFragment()
      for (const part of String(text).split(/(@[^@\u200B]+)/g)) {
        if (!part) continue
        if (part.startsWith("@") && part.length > 1) {
          const chip = document.createElement("span")
          chip.style.marginLeft = "8px"
          chip.style.marginRight = "8px"
          chip.textContent = part
          fragment.appendChild(chip)
        } else {
          fragment.appendChild(document.createTextNode(part))
        }
      }
      return fragment
    }
    // 用户消息行:附件(图片缩略图/文件 chip/[附件] 清单)+ 文字气泡(对齐 design userAttachments)
    function buildUserRow(turn, imageBlobMap, token) {
      const userRow = document.createElement("div")
      userRow.className = "turn-user-row"
      if (!turn.user) return userRow
      const attBox = document.createElement("div")
      attBox.className = "user-attachments"
      // file parts:图片且 url/blob 可解析 → 80×80 缩略图;否则文件 chip(design 的 fallback)
      const fileParts = (turn.user.parts || []).filter(p => p.type === "file" && p.filename)
      for (const part of fileParts) {
        const directUrl = (part.url && /^(data:|blob:|https?:)/.test(part.url)) ? part.url : null
        const blobEntry = imageBlobMap[part.filename]
        if (isImageFile(part.filename, part.mime) && (directUrl || blobEntry)) {
          const thumb = document.createElement("div")
          thumb.className = "user-image-thumb"
          const img = document.createElement("img")
          img.alt = part.filename || ""
          if (directUrl) img.src = directUrl
          else loadBlobImage(blobEntry.url, token, blobEntry.mime).then(u => { img.src = u })
          thumb.appendChild(img)
          attBox.appendChild(thumb)
        } else {
          attBox.appendChild(buildFileChip(part.filename, kindFromMime(part.mime || mimeFromFilename(part.filename))))
        }
      }
      // [附件] 本地文件清单:chip;图片若已导出到 manifest.files 则显示缩略图
      const attachBlock = (turn.user.parts || []).find(
        p => p.type === "text" && p.synthetic === true && typeof p.text === "string" && p.text.startsWith("[附件]"),
      )
      if (attachBlock) {
        for (const f of parseUploadedFilesBlock(attachBlock.text)) {
          const mime = mimeFromFilename(f.filename)
          const blobEntry = imageBlobMap[f.filename]
          if (mime.startsWith("image/") && blobEntry) {
            const thumb = document.createElement("div")
            thumb.className = "user-image-thumb"
            const img = document.createElement("img")
            img.alt = f.filename
            loadBlobImage(blobEntry.url, token, blobEntry.mime).then(u => { img.src = u })
            thumb.appendChild(img)
            attBox.appendChild(thumb)
          } else {
            attBox.appendChild(buildFileChip(f.filename, kindFromMime(mime)))
          }
        }
      }
      if (attBox.children.length > 0) userRow.appendChild(attBox)
      const userTextContent = extractUserText(turn.user.parts || [])
      if (userTextContent) {
        const bubble = document.createElement("div")
        bubble.className = "bubble-user"
        bubble.setAttribute("data-expanded", "false")
        // 内容层 + 渐隐遮罩 + 展开按钮(对齐 design ExpandableBubble 的三层结构)
        const bubbleContent = document.createElement("div")
        bubbleContent.className = "bubble-user-content"
        bubbleContent.appendChild(buildUserBubbleContent(userTextContent))
        bubble.appendChild(bubbleContent)
        const mask = document.createElement("div")
        mask.className = "bubble-user-mask"
        bubble.appendChild(mask)
        bubble.appendChild(buildBubbleExpandButton())
        userRow.appendChild(bubble)
      }
      return userRow
    }

    // 用户气泡展开/收起按钮(对齐 design expandable-bubble.tsx:右下角"展开/收起"+旋转箭头)
    const BUBBLE_CHEVRON_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" width="16" height="16" fill="none" style="flex-shrink:0"><path d="M10.0001 13.0418C10.2556 13.0418 10.4751 12.9474 10.6584 12.7585L15.4418 8.04183C15.5584 7.91961 15.6168 7.77238 15.6168 7.60016C15.6168 7.42794 15.5584 7.27516 15.4418 7.14183C15.3195 7.01961 15.1723 6.9585 15.0001 6.9585C14.8279 6.9585 14.6751 7.01961 14.5418 7.14183L10.0001 11.6585L5.44176 7.14183C5.31953 7.01961 5.17231 6.9585 5.00009 6.9585C4.82787 6.9585 4.68064 7.01961 4.55842 7.14183C4.44176 7.27516 4.38342 7.42794 4.38342 7.60016C4.38342 7.77238 4.44176 7.91961 4.55842 8.04183L9.34176 12.7585C9.52509 12.9474 9.74453 13.0418 10.0001 13.0418Z" fill="rgba(0,0,0,0.6)"/></svg>'
    function buildBubbleExpandButton() {
      const btn = document.createElement("button")
      btn.type = "button"
      btn.className = "bubble-expand-btn"
      const label = document.createElement("span")
      label.textContent = "展开"
      const chevron = document.createElement("span")
      chevron.className = "bubble-expand-chevron"
      chevron.innerHTML = BUBBLE_CHEVRON_SVG
      btn.appendChild(label)
      btn.appendChild(chevron)
      btn.addEventListener("click", () => {
        const bubble = btn.closest(".bubble-user")
        if (!bubble) return
        const expanded = bubble.getAttribute("data-expanded") !== "true"
        bubble.setAttribute("data-expanded", String(expanded))
        label.textContent = expanded ? "收起" : "展开"
      })
      return btn
    }

    // 用户气泡超长标记(对齐 design ExpandableBubble:scrollHeight > 222 + 4;
    // ResizeObserver 跟随宽度变化重算,与 design 的 checkHeight 行为一致)
    const USER_BUBBLE_MAX_HEIGHT = 222
    function markExpandableUserBubbles(scope) {
      for (const bubble of scope.querySelectorAll(".bubble-user")) {
        const content = bubble.querySelector(".bubble-user-content")
        if (!content || bubble.dataset.expandTracked === "true") continue
        bubble.dataset.expandTracked = "true"
        const check = () => {
          bubble.setAttribute("data-expandable", String(content.scrollHeight > USER_BUBBLE_MAX_HEIGHT + 4))
        }
        check()
        if (typeof ResizeObserver === "function") new ResizeObserver(check).observe(content)
      }
    }

    // ─────────────────────────────────────────────────────────
    // 工具调用卡(对齐 design tool-call-card.tsx / file-ops-summary.tsx / ProducedFilesList)
    // ─────────────────────────────────────────────────────────
    const TOOL_FAMILY_RULES = [
      [/write|create_file/, "write"],
      [/edit|str_replace/, "edit"],
      [/read|read_file/, "read"],
      [/bash|shell/, "bash"],
      [/glob|list/, "glob"],
      [/grep/, "grep"],
      [/search|websearch|web_search/, "search"],
      [/task/, "task"],
      [/skill/, "skill"],
    ]
    const TOOL_FAMILY_LABEL = {
      write: "写入", edit: "编辑", read: "读取", bash: "执行命令", glob: "搜索文件",
      grep: "搜索内容", search: "网络搜索", task: "子任务", skill: "调用技能", other: "工具调用",
    }
    function toolFamilyOf(name) {
      const n = (name || "").toLowerCase()
      for (const rule of TOOL_FAMILY_RULES) if (rule[0].test(n)) return rule[1]
      return "other"
    }
    function toolStatusOf(state) {
      const status = state.status
      const err = state.error
      const metadata = state.metadata || {}
      const isCancelled = status === "error" && (err === "Cancelled" || err === "Tool execution aborted")
      const isError = (status === "error" && !isCancelled) || (metadata.exit !== undefined && metadata.exit !== 0)
      if (status === "completed") return "done"
      if (isCancelled || isError) return "error"
      return "running"
    }
    function normalizeToolCall(part) {
      const state = part.state || {}
      const input = state.input
      const filePath = input ? (input.path ?? input.filepath ?? input.filePath ?? "") : ""
      const name = part.tool ?? part.name ?? state.name ?? "unknown"
      const hasOutput = typeof state.output === "string" && state.output.length > 0
      return {
        name,
        status: toolStatusOf(state),
        input,
        output: hasOutput ? state.output : undefined,
        filePath: filePath || undefined,
        displayName: name === "skill" && input && typeof input.name === "string" ? input.name : undefined,
      }
    }
    // skill 工具(user 消息注入 + assistant 调用)与非 task 工具(对齐 design skillToolCalls/otherToolCalls)
    function collectToolCalls(turn, allParts) {
      const userSkillCalls = []
      for (const p of (turn.user && turn.user.parts) || []) {
        if (p.type !== "tool" || p.tool !== "skill") continue
        const input = (p.state || {}).input || {}
        userSkillCalls.push({
          name: "skill", status: "done", input, output: undefined, filePath: undefined,
          displayName: typeof input.name === "string" ? input.name : undefined,
        })
      }
      const calls = allParts.filter(x => x.part.type === "tool").map(x => normalizeToolCall(x.part))
      const skillCalls = [...userSkillCalls, ...calls.filter(c => c.name === "skill")]
      const otherCalls = calls.filter(c => c.name !== "skill" && !/task/i.test(c.name))
      return { skillCalls, otherCalls }
    }
    function toolSummary(call) {
      const input = call.input
      if (!input) return ""
      if (call.filePath) return call.filePath.split(/[/\\]/).pop() ?? call.filePath
      if (typeof input.command === "string") return input.command.length > 60 ? input.command.slice(0, 60) + "…" : input.command
      if (typeof input.pattern === "string") return input.pattern
      if (typeof input.query === "string") return input.query
      if (call.displayName) return call.displayName
      if (typeof input.name === "string") return input.name
      return ""
    }
    function buildToolBadge(status) {
      const cfg = status === "running"
        ? ["tool-badge-running", "运行中"]
        : status === "done" ? ["tool-badge-done", "完成"] : ["tool-badge-error", "错误"]
      const badge = document.createElement("span")
      badge.className = "tool-badge " + cfg[0]
      if (status === "running") {
        const dot = document.createElement("span")
        dot.className = "pulse-dot"
        badge.appendChild(dot)
      }
      badge.appendChild(document.createTextNode(cfg[1]))
      return badge
    }
    function buildSingleToolCard(call) {
      const card = document.createElement("div")
      card.className = "tool-card"
      const command = call.input && typeof call.input.command === "string" ? call.input.command : ""
      if (call.filePath) card.title = call.filePath
      else if (command) card.title = command
      card.appendChild(makeSpan("tool-label", TOOL_FAMILY_LABEL[toolFamilyOf(call.name)]))
      const summary = toolSummary(call)
      if (summary) card.appendChild(makeSpan("tool-summary", summary))
      card.appendChild(buildToolBadge(call.status))
      return card
    }
    // 连续同 family 分组(对齐 design groupByFamily);单个 → 单卡,多个 → 可折叠组
    function buildToolGroupCards(calls, container) {
      const groups = []
      for (const call of calls) {
        const family = toolFamilyOf(call.name)
        const last = groups[groups.length - 1]
        if (last && last.family === family) last.calls.push(call)
        else groups.push({ family, calls: [call] })
      }
      for (const group of groups) {
        if (group.calls.length === 1) {
          container.appendChild(buildSingleToolCard(group.calls[0]))
          continue
        }
        const wrap = document.createElement("div")
        wrap.className = "tool-group"
        const overall = group.calls.some(c => c.status === "error") ? "error"
          : group.calls.every(c => c.status === "done") ? "done" : "running"
        const btn = document.createElement("button")
        btn.type = "button"
        btn.className = "tool-card"
        btn.setAttribute("data-open", "false")
        btn.appendChild(makeSpan("tool-label", TOOL_FAMILY_LABEL[group.family]))
        btn.appendChild(makeSpan("tool-count", "x" + group.calls.length))
        const spacer = document.createElement("span")
        spacer.className = "tool-spacer"
        btn.appendChild(spacer)
        btn.appendChild(buildToolBadge(overall))
        const chev = document.createElement("span")
        chev.className = "tool-chevron"
        chev.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M4 2l4 4-4 4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        btn.appendChild(chev)
        const items = document.createElement("div")
        items.className = "tool-group-items"
        for (const call of group.calls) items.appendChild(buildSingleToolCard(call))
        btn.addEventListener("click", () => {
          const open = btn.getAttribute("data-open") === "true"
          btn.setAttribute("data-open", String(!open))
          items.setAttribute("data-open", String(!open))
        })
        wrap.appendChild(btn)
        wrap.appendChild(items)
        container.appendChild(wrap)
      }
    }
    // 文件操作摘要(对齐 design FileOpsSummary:W/E/R 徽标 + 计数)
    function buildFileOps(calls) {
      const map = new Map()
      for (const call of calls) {
        const n = call.name.toLowerCase()
        const op = /write|create_file/.test(n) ? "write" : /edit|str_replace/.test(n) ? "edit" : /read|read_file/.test(n) ? "read" : null
        if (!op || !call.filePath) continue
        const existing = map.get(call.filePath)
        if (existing) {
          if (!existing.ops.includes(op)) existing.ops.push(op)
          if (call.status === "error") existing.status = "error"
        } else {
          map.set(call.filePath, { name: call.filePath.split(/[/\\]/).pop() ?? call.filePath, ops: [op], status: call.status })
        }
      }
      if (map.size === 0) return null
      let w = 0, e = 0, r = 0
      for (const entry of map.values()) for (const op of entry.ops) { if (op === "write") w++; else if (op === "edit") e++; else r++ }
      const parts = []
      if (w) parts.push("写入 " + w)
      if (e) parts.push("编辑 " + e)
      if (r) parts.push("读取 " + r)
      const box = document.createElement("div")
      box.className = "file-ops"
      const head = document.createElement("div")
      head.className = "file-ops-head"
      head.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 4h8M2 6h8M2 8h5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>'
      head.appendChild(document.createTextNode("文件操作: " + parts.join(" · ")))
      box.appendChild(head)
      if (map.size <= 5) {
        for (const entry of map.values()) {
          const row = document.createElement("div")
          row.className = "file-ops-row"
          row.appendChild(makeSpan("file-name", entry.name))
          for (const op of entry.ops) {
            const badge = document.createElement("span")
            badge.className = "op-badge op-badge-" + op[0]
            badge.textContent = op[0].toUpperCase()
            row.appendChild(badge)
          }
          box.appendChild(row)
        }
      }
      return box
    }
    // 涉及文件列表(对齐 design ProducedFilesList)
    function buildProducedFiles(calls) {
      const seen = new Set()
      const files = []
      for (const call of calls) {
        const n = call.name.toLowerCase()
        if (!(n.includes("write") || n.includes("edit"))) continue
        if (!call.filePath || call.status !== "done" || seen.has(call.filePath)) continue
        seen.add(call.filePath)
        files.push(call.filePath.split(/[/\\]/).pop() ?? call.filePath)
      }
      if (files.length === 0) return null
      const wrap = document.createElement("div")
      wrap.className = "produced-files"
      const box = document.createElement("div")
      box.className = "produced-files-box"
      box.appendChild(makeSpan("produced-files-label", "涉及文件"))
      for (const name of files) {
        const row = document.createElement("div")
        row.className = "produced-files-row"
        const icon = document.createElement("span")
        icon.style.display = "inline-flex"
        icon.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="2" y="1" width="8" height="10" rx="1" stroke="currentColor" stroke-width="1"/><path d="M5 4h3M5 6h3M5 8h2" stroke="currentColor" stroke-width="0.7" stroke-linecap="round"/></svg>'
        row.appendChild(icon)
        row.appendChild(makeSpan("file-name", name))
        box.appendChild(row)
      }
      wrap.appendChild(box)
      return wrap
    }

    // ─────────────────────────────────────────────────────────
    // 子任务(对齐 design InsightTurn subtasks:Task 工具 + manifest 子会话产物)
    // ─────────────────────────────────────────────────────────
    function collectSubtasks(allParts, sessionsById) {
      const tasks = []
      for (const x of allParts) {
        const part = x.part
        if (part.type !== "tool") continue
        const state = part.state
        if (!state) continue
        const input = state.input
        const toolName = part.tool ?? part.name ?? state.name
        if (typeof toolName !== "string" || !/task/i.test(toolName) || !input) continue
        const metadata = state.metadata || {}
        const outputStr = typeof state.output === "string" ? state.output : ""
        const hasOutput = outputStr.length > 0
        const subSessionID = metadata.sessionId ?? (outputStr.match(/task_id:\s*(\S+)/) || [])[1]
        const statusTool = toolStatusOf(state)
        const status = state.error === "Cancelled" || state.error === "Tool execution aborted"
          ? "cancelled"
          : statusTool === "error" ? "error" : hasOutput ? "done" : "running"
        const taskDescription = input.description
          ?? (typeof input.prompt === "string" ? input.prompt.slice(0, 60) : null)
          ?? "子任务"
        const textParts = []
        const artifactOutputs = []
        if (!subSessionID) {
          for (const a of extractArtifacts(outputStr).artifacts) {
            artifactOutputs.push({ identifier: a.artifactIdentifier ?? "", title: a.title, content: a.content })
          }
          if (artifactOutputs.length === 0 && /<(?:div|section|style|nav|header|main|article|form|table|html)\b/i.test(outputStr)) {
            artifactOutputs.push({ identifier: "degraded", title: "HTML 片段", content: outputStr })
          }
        } else {
          const m = outputStr.match(/<task_result>([\s\S]*?)<\/task_result>/)
          const resultContent = m ? m[1].trim() : ""
          if (resultContent) {
            for (const a of extractArtifacts(resultContent).artifacts) {
              artifactOutputs.push({ identifier: a.artifactIdentifier ?? "", title: a.title, content: a.content })
            }
            if (artifactOutputs.length === 0 && /<(?:div|section|style|nav|header|footer|main|article|form|table)\b/i.test(resultContent)) {
              artifactOutputs.push({ identifier: "raw-fragment", title: "HTML 片段", content: resultContent })
            }
            const proseOnly = resultContent.replace(/<artifact[\s\S]*?<\/artifact>/gi, "").trim()
            if (proseOnly) textParts.push(proseOnly.length > 500 ? proseOnly.slice(0, 500) + "…" : proseOnly)
          }
          // 子会话产物补充(对齐 design 从 msgStore 补充的逻辑,数据源为 manifest.sessions):
          // text part 扫 <artifact> 标签;write/edit 工具入参 content/newString 为完整 HTML/产物标签时补产物卡
          const child = sessionsById.get(subSessionID)
          for (const msg of (child ? child.messages || [] : [])) {
            if ((msg.info || {}).role !== "assistant") continue
            for (const sp of msg.parts || []) {
              if (sp.type === "text" && typeof sp.text === "string" && sp.text.trim()) {
                for (const a of extractArtifacts(sp.text).artifacts) {
                  if (artifactOutputs.some(e2 => e2.identifier === (a.artifactIdentifier ?? ""))) continue
                  artifactOutputs.push({ identifier: a.artifactIdentifier ?? "", title: a.title, content: a.content })
                }
                continue
              }
              if (sp.type !== "tool") continue
              const spInput = (sp.state || {}).input
              if (!spInput || typeof spInput !== "object") continue
              const content = spInput.content ?? spInput.newString
              if (typeof content !== "string" || content.length <= 20 || !/<html|<!doctype|<artifact/i.test(content)) continue
              const parsed = extractArtifacts(content).artifacts
              if (parsed.length > 0) {
                for (const a of parsed) {
                  if (artifactOutputs.some(e2 => e2.identifier === (a.artifactIdentifier ?? ""))) continue
                  artifactOutputs.push({ identifier: a.artifactIdentifier ?? "", title: a.title, content: a.content })
                }
              } else if (/<html|<!doctype/i.test(content)) {
                const filePath = typeof spInput.filePath === "string" ? spInput.filePath : typeof spInput.path === "string" ? spInput.path : ""
                const name = (filePath.split(/[/\\]/).pop() || "").replace(/\.html?$/i, "")
                if (!artifactOutputs.some(e2 => e2.identifier === (name || "component"))) {
                  artifactOutputs.push({ identifier: name || "component", title: name || "HTML 片段", content: content })
                }
              }
            }
          }
        }
        tasks.push({ taskDescription, subSessionID, status, textParts, artifactOutputs })
      }
      return tasks
    }
    function buildSubtaskBadge(status) {
      const cfg = {
        running: ["st-badge-running", "运行中", true],

    // ─────────────────────────────────────────────────────────
    // 分隔线 / 压缩提示 / turn 元信息(对齐 design MessageDivider、MakeErrorNotice、turnMeta)

    function buildDivider(label) {

      divider.appendChild(line1)

    function buildCompactionBlock(turn) {
      const compacted = turn.assistants.some(m => {
        const info = m.info || {}
        return info.summary === true && !!info.finish && !info.error
      })
      if (compacted) return buildDivider("会话已压缩")
      const failedMsg = turn.assistants.find(m => !!(m.info || {}).error)
      if (failedMsg) {
        const err = (failedMsg.info || {}).error || {}
        const data = err.data || {}
        const message = typeof data.message === "string" ? data.message : typeof err.message === "string" ? err.message : ""
        const notice = document.createElement("div")
        notice.className = "error-notice"
        notice.innerHTML = '<svg viewBox="0 0 14 14" width="14" height="14" fill="none"><path d="M5.79 2.1a1.4 1.4 0 0 1 2.42 0l4.24 7.35a1.4 1.4 0 0 1-1.21 2.1H2.76a1.4 1.4 0 0 1-1.21-2.1L5.79 2.1Z" fill="#E02128"/><path d="M7 4.3v3.15M7 9.38v.17" stroke="white" stroke-width="1.05" stroke-linecap="round"/></svg>'
        const content = document.createElement("div")
        content.style.minWidth = "0"
        content.style.flex = "1"
        content.appendChild(makeSpan("notice-title", "上下文压缩失败"))
