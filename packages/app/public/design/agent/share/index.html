    // 普通 turn 的错误提示(对齐 design MakeErrorNotice:标题按错误名映射,
    // ContextOverflowError 出专用文案;MessageAbortedError 走"已中断" divider 不进这里)
    function buildTurnErrorNotice(turn) {
      const failedMsg = turn.assistants.find(m => {
        const err = (m.info || {}).error
        return err && err.name !== "MessageAbortedError"
      })
      if (!failedMsg) return null
      const err = failedMsg.info.error
      const data = err.data || {}
      const message = typeof data.message === "string" ? data.message : typeof err.message === "string" ? err.message : ""
      const title = err.name === "ProviderAuthError" ? "认证失败"
        : err.name === "ContextOverflowError" ? "上下文超出提示" : "生成出错"
      const notice = document.createElement("div")
      notice.className = "error-notice"
      notice.innerHTML = '<svg viewBox="0 0 14 14" width="14" height="14" fill="none"><path d="M5.79 2.1a1.4 1.4 0 0 1 2.42 0l4.24 7.35a1.4 1.4 0 0 1-1.21 2.1H2.76a1.4 1.4 0 0 1-1.21-2.1L5.79 2.1Z" fill="#E02128"/><path d="M7 4.3v3.15M7 9.38v.17" stroke="white" stroke-width="1.05" stroke-linecap="round"/></svg>'
      const content = document.createElement("div")
      content.style.minWidth = "0"
      content.style.flex = "1"
      content.appendChild(makeSpan("notice-title", title))
      if (err.name === "ContextOverflowError") {
        const overflowLine1 = document.createElement("div")
        overflowLine1.textContent = "系统的单次处理能力已满。"
        content.appendChild(overflowLine1)
        const overflowLine2 = document.createElement("div")
        overflowLine2.textContent = "请进行“上下文压缩”，或新建对话。"
        content.appendChild(overflowLine2)
      } else if (message) {
        const msg = document.createElement("div")
        msg.textContent = message
        content.appendChild(msg)
      }
      notice.appendChild(content)
      return notice
    }
    // turn 元信息:agent · 模型名 · 耗时 · 中断(对齐 design turnMeta;模型名优先 manifest.models
    // 的展示名映射 — 导出时由 provider 目录解析,对齐 design 页 provider.models[name] 的取值)
    function buildTurnMeta(turn, models) {
      if (turn.assistants.length === 0) return null
      const first = turn.assistants[0].info || {}
      const last = turn.assistants[turn.assistants.length - 1].info || {}
      let duration = ""
      const start = first.time && typeof first.time.created === "number" ? first.time.created : undefined
      const completed = last.time && typeof last.time.completed === "number" ? last.time.completed : undefined
      if (start !== undefined && completed !== undefined && completed >= start) {
        const secs = Math.round((completed - start) / 1000)
        if (secs >= 0) duration = secs < 60 ? secs + " 秒" : Math.floor(secs / 60) + " 分 " + (secs % 60) + " 秒"
      }
      let agent = last.agent
      if (agent === "octo_ai" || agent === "octo_make" || agent === "octo_make_plan") agent = "Octo_Design"
      const agentLabel = agent ? agent[0].toUpperCase() + agent.slice(1) : ""
      const modelLabel = last.modelID
        ? ((models || {})[last.providerID + "/" + last.modelID] ?? last.modelID)
        : ""
      const interrupted = turn.assistants.some(m => ((m.info || {}).error || {}).name === "MessageAbortedError") ? "已中断" : ""
      const meta = [agentLabel, modelLabel, duration, interrupted].filter(Boolean).join(" · ")
      if (!meta) return null
      const wrapper = document.createElement("div")
      wrapper.className = "turn-meta-wrapper"
      wrapper.appendChild(makeSpan("turn-meta", meta))
      return wrapper
    }

    // ─────────────────────────────────────────────────────────
    // 快速简报表单(对齐 design question-form.ts 解析;分享页静态展示,避免露出原始标签)
    // ─────────────────────────────────────────────────────────
    const MODULE_LIST_GUIDANCE = "已结合页面规范与业务需求生成模块列表，请在下方选择需要使用的模块模板。"
    const PATTERN_MATCH_GUIDANCE = "已根据你的需求匹配到候选页面布局，请在上方选择最合适的典型页面模板。"
    const QFORM_OPEN_RE = /<(question-form|ask-question)\b([^>]*)>/i
    function splitProseSegments(input) {
      const segments = []
      let cursor = 0
      while (cursor < input.length) {
        const slice = input.slice(cursor)
        const m = QFORM_OPEN_RE.exec(slice)
        if (!m) { segments.push({ kind: "text", text: slice }); break }
        const tagName = (m[1] || "question-form").toLowerCase()
        const closeTag = "</" + tagName + ">"
        const openStart = cursor + m.index
        const openEnd = openStart + m[0].length
        let closeIdx = -1
        const lower = input.toLowerCase()
        const closeLower = closeTag.toLowerCase()
        for (let i = openEnd; i <= input.length - closeTag.length; i++) {
          if (lower.startsWith(closeLower, i)) { closeIdx = i; break }
        }
        if (closeIdx === -1) {
          // 未闭合:保留标签前文本,丢弃残缺标签(避免脏文字)
          if (openStart > cursor) segments.push({ kind: "text", text: input.slice(cursor, openStart) })
          break
        }
        if (openStart > cursor) segments.push({ kind: "text", text: input.slice(cursor, openStart) })
        const form = tryParseQuestionForm(input.slice(openEnd, closeIdx), m[2] || "")
        if (form) segments.push({ kind: "form", form })
        // 解析失败的表单块整个丢弃(避免露出原始标签/JSON 脏文字)
        cursor = closeIdx + closeTag.length
      }
      return segments.filter(s => s.kind === "form" || s.text.trim().length > 0)
    }
    function tryParseQuestionForm(body, attrsRaw) {
      const trimmed = body.trim()
      if (!trimmed) return null
      const stripped = trimmed.replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim()
      let data
      try { data = JSON.parse(stripped) } catch { return null }
      if (!data || typeof data !== "object" || !Array.isArray(data.questions)) return null
      const attrs = {}
      attrsRaw.replace(/(\w+)\s*=\s*(?:"([^"]*)"|'([^']*)')/g, (s, k, v1, v2) => { attrs[k] = v1 ?? v2 ?? ""; return s })
      const questions = []
      data.questions.forEach((q, i) => {
        if (!q || typeof q !== "object") return
        const id = typeof q.id === "string" && q.id.trim() ? q.id.trim() : "q" + (i + 1)
        const options = Array.isArray(q.options)
          ? q.options
              .map(o => typeof o === "string"
                ? (o.trim() ? { label: o.trim(), value: o.trim() } : null)
                : (o && typeof o === "object" && typeof o.label === "string" && o.label.trim()
                  ? { label: o.label.trim(), value: typeof o.value === "string" && o.value.trim() ? o.value.trim() : o.label.trim() }
                  : null))
              .filter(Boolean)
          : undefined
        questions.push({
          id,
          label: typeof q.label === "string" ? q.label : id,
          type: normalizeQuestionType(q.type),
          options: options && options.length > 0 ? options : undefined,
          placeholder: typeof q.placeholder === "string" ? q.placeholder : undefined,
          required: q.required === true,
          defaultValue: typeof q.defaultValue === "string" || Array.isArray(q.defaultValue) ? q.defaultValue : typeof q.default === "string" ? q.default : undefined,
        })
      })
      if (questions.length === 0) return null
      return {
        id: attrs.id ?? (typeof data.id === "string" ? data.id : "discovery"),
        title: attrs.title ?? (typeof data.title === "string" ? data.title : "A few quick questions"),
        description: typeof data.description === "string" ? data.description : undefined,
        questions,
      }
    }
    function normalizeQuestionType(raw) {
      if (typeof raw !== "string") return "text"
      const lower = raw.toLowerCase().trim()
      if (lower === "radio" || lower === "single" || lower === "choice") return "radio"
      if (lower === "checkbox" || lower === "multi" || lower === "multiple") return "checkbox"
      if (lower === "textarea" || lower === "long" || lower === "paragraph") return "textarea"
      return "text"
    }
    function buildQuestionFormCard(form, submitted) {
      const card = document.createElement("div")
      card.className = "qform-card"
      const head = document.createElement("div")
      head.className = "qform-head"
      const icon = document.createElement("span")
      icon.className = "qform-icon"
      icon.textContent = "?"
      head.appendChild(icon)
      const titles = document.createElement("div")
      titles.className = "qform-titles"
      titles.appendChild(makeSpan("qform-title", form.title))
      if (form.description) titles.appendChild(makeSpan("qform-desc", form.description))
      head.appendChild(titles)
      if (submitted) head.appendChild(makeSpan("qform-pill", "已回答"))
      card.appendChild(head)
      const body = document.createElement("div")
      body.className = "qform-body"
      for (const q of form.questions) {
        const field = document.createElement("div")
        field.className = "qf-field"
        const label = document.createElement("span")
        label.className = "qf-label"
        label.appendChild(document.createTextNode(q.label))
        if (q.required) label.appendChild(makeSpan("qf-required", "*"))
        field.appendChild(label)
        if ((q.type === "radio" || q.type === "checkbox") && q.options) {
          const options = document.createElement("div")
          options.className = "qf-options"
          for (const opt of q.options) {
            const chip = document.createElement("button")
            chip.type = "button"
            chip.disabled = true
            const selected = Array.isArray(q.defaultValue)
              ? q.defaultValue.includes(opt.value) || q.defaultValue.includes(opt.label)
              : q.defaultValue === opt.value || q.defaultValue === opt.label
            chip.className = "qf-chip" + (selected ? " qf-chip-on" : "")
            chip.textContent = opt.label
            options.appendChild(chip)
          }
          field.appendChild(options)
        } else if (q.type === "text" || q.type === "textarea") {
          const input = document.createElement(q.type === "textarea" ? "textarea" : "input")
          input.className = q.type === "textarea" ? "qf-textarea" : "qf-input"
          input.disabled = true
          if (q.type === "textarea") input.rows = 3
          if (q.placeholder) input.placeholder = q.placeholder
          if (typeof q.defaultValue === "string" && q.defaultValue) input.value = q.defaultValue
          field.appendChild(input)
        }
        body.appendChild(field)
      }
      card.appendChild(body)
      const foot = document.createElement("div")
      foot.className = "qform-foot"
      foot.appendChild(makeSpan("qf-locked-note", submitted ? "已锁定，无法修改" : "分享页仅供查看"))
      card.appendChild(foot)
      return card
    }
    // 表单是否已提交:后续 user 消息含 [快速简报]/[form answers —(对齐 design formSubmitted)
    function isFormSubmitted(turns, index) {
      for (let i = index + 1; i < turns.length; i++) {
        const u = turns[i].user
        if (!u) continue
        for (const p of u.parts || []) {
          if (p.type === "text" && p.text && (p.text.includes("[快速简报]") || p.text.includes("[form answers —"))) return true
        }
      }
      return false
    }
    // prose 行:文本段 markdown + 表单段静态卡片(对齐 design proseSegments 渲染)
    function buildProseRow(segments, formSubmittedFlag) {
      if (segments.length === 0) return null
      const row = document.createElement("div")
      row.className = "turn-assistant-row"
      for (const seg of segments) {
        if (seg.kind === "text") {
          if (!seg.text.trim()) continue
          const text = document.createElement("div")
          text.className = "text-assistant"
          text.setAttribute("data-component", "markdown")
          text.innerHTML = renderMarkdown(seg.text)
          row.appendChild(text)
        } else {
          row.appendChild(buildQuestionFormCard(seg.form, formSubmittedFlag))
        }
      }
      return row.children.length > 0 ? row : null
    }

    // 空状态:无接口内容/无数据时,内容区显示图片+文案(整体居中)
    function showEmptyState() {
      const scroll = document.querySelector(".chat-scroll-view")
      const list = document.getElementById("conversation-list")
      if (!scroll || !list) return
      scroll.classList.add("is-empty")
      list.innerHTML =
        '<div class="empty-state">' +
        '<img class="empty-state-img" src="./empty.png" alt="" />' +
        '<p class="empty-state-text">暂无数据</p>' +
        "</div>"
    }

    function renderConversation(manifest, filePath, token) {
      const list = document.getElementById("conversation-list")
      if (!list) return
      list.innerHTML = ""
      list.classList.remove("insight-scope")
      delete document.body.dataset.module
      // 代码块复制/展开按钮的事件委托(一次绑定,turns 渲染复用)
      bindMarkdownCodeActions(list)
      if (!manifest || manifest.format !== "octo-session") {
        console.error("[share] manifest format not supported")
        showEmptyState()
        return
      }
      const session = (manifest.sessions || []).find(s => s.info && s.info.id === manifest.rootSessionID) || manifest.sessions?.[0]
      if (!session) {
        console.error("[share] session not found")
        showEmptyState()
        return
      }
      // 填充头部标题(优先 manifest.title,回退 session.info.title,与内容区左对齐)
      const titleEl = document.getElementById("session-title")
      if (titleEl) titleEl.textContent = manifest.title || session.info?.title || ""
      // studio 会话:走 studio 渲染分支(对齐 studio 页面 StudioConversation 结构,样式与 design 不同)
      if (session.info?.agent === "octo_studio") {
        renderStudioConversation(manifest, session, filePath, token, list)
        return
      }
      // insight 会话:走 insight 渲染分支(对齐 insight 页会话区:上游 SessionTurn 分块、
      // 任务卡/入口卡/引用列表、text-part-meta 等,与 design 分支样式不同)
      if (session.info?.agent === "octo_insight") {
        renderInsightConversation(manifest, session, filePath, token, list)
        return
      }
      const messages = session.messages || []

      // 构建图片 blob 映射:filename → { url, mime }
      const imageBlobMap = filePath ? buildImageBlobMap(manifest, filePath) : {}

      // 按 user 分组: 每个 user 消息 + 后续 assistant 消息组成一个 turn（对齐 design 页面 InsightTurn 结构）
      const turns = []
      let current = null
      for (const msg of messages) {
        const role = msg.info && msg.info.role
        if (role === "user") {
          if (current) turns.push(current)
          current = { user: msg, assistants: [] }
        } else if (role === "assistant") {
          if (!current) current = { user: null, assistants: [] }
          current.assistants.push(msg)
        }
      }
      if (current) turns.push(current)

      // manifest 全部会话(根 + 子),供子任务产物补充(对齐 design msgStore 的角色)
      const sessionsById = new Map((manifest.sessions || []).map(s => [s.info && s.info.id, s]))

      for (let turnIndex = 0; turnIndex < turns.length; turnIndex++) {
        const turn = turns[turnIndex]
        const turnEl = document.createElement("div")
        turnEl.className = "turn"

        // 用户消息行(附件:图片缩略图/文件 chip/[附件] 清单 + 文字气泡)
        const userRow = buildUserRow(turn, imageBlobMap, token)
        if (userRow.children.length > 0) turnEl.appendChild(userRow)

        const allParts = turn.assistants.flatMap(m => (m.parts || []).map(p => ({ part: p, msg: m })))

        // 手动 /compact 压缩 turn:只显示压缩状态,不渲染正常 assistant 内容(对齐 design isCompactionTurn)
        const isCompactionTurn = ((turn.user && turn.user.parts) || []).some(p => p.type === "compaction")
        if (isCompactionTurn) {
          turnEl.appendChild(buildCompactionBlock(turn))
        } else if (turn.assistants.length > 0) {
          // pattern agent 的 turn:标签外文字归思考过程,prose 只留引导语(对齐 design isPatternAgentTurn)
          const isPatternAgentTurn = turn.assistants.some(m => (m.info || {}).agent === "ict_pattern")

          // 思考过程(对齐 design reasoningTexts:reasoning part + tool part 的 state.reasoning,折叠展示)
          const reasoningTexts = allParts.flatMap(x => {
            if (x.part.type === "reasoning" && x.part.text) return [x.part.text]
            const toolReasoning = x.part.type === "tool" ? (x.part.state || {}).reasoning : undefined
            return typeof toolReasoning === "string" && toolReasoning ? [toolReasoning] : []
          })
          const textEntries = allParts.filter(x => x.part.type === "text" && x.part.text)
          const lastText = textEntries.length > 0 ? textEntries[textEntries.length - 1] : null

          // artifact 卡:从后往前找第一个含 artifact 的 text part(对齐 design outputCards);
          // 卡片时间取该 part 的 time.end(artifact 生成完成时刻,对齐 design getTextPartTime),
          // part 无时间时回退消息 completed/created —— 均已是毫秒,不能再乘 1000
          let artifacts = []
          let cardTime = null
          for (let k = textEntries.length - 1; k >= 0; k--) {
            const parsed = extractArtifacts(textEntries[k].part.text)
            if (parsed.artifacts.length === 0) continue
            artifacts = parsed.artifacts
            const partTime = textEntries[k].part.time || {}
            const msgTime = (textEntries[k].msg.info || {}).time || {}
            cardTime = typeof partTime.end === "number" ? partTime.end
              : typeof msgTime.completed === "number" ? msgTime.completed
                : typeof msgTime.created === "number" ? msgTime.created : null
            break
          }

          // prose:最后一个 text part,剥 <artifact>、pattern 标签;question-form 切分为
          // 文本段(markdown)+ 表单段(静态卡片),不露出原始标签(对齐 design proseText/proseSegments)
          let proseSegments = []
          if (lastText) {
            const raw = lastText.part.text
            const hasPatternMatch = /<pattern-match[^>]*>[\s\S]*?<\/pattern-match>/i.test(raw)
            const hasModuleList = /<module-list[^>]*>[\s\S]*?<\/module-list>/i.test(raw)
            const cleaned = raw
              .replace(/<pattern-match[^>]*>[\s\S]*?<\/pattern-match>/gi, "")
              .replace(/<module-list[^>]*>[\s\S]*?<\/module-list>/gi, "")
              .replace(/<pattern-match[^>]*>[\s\S]*$/gi, "")
              .replace(/<module-list[^>]*>[\s\S]*$/gi, "")
            let prose = extractArtifacts(cleaned).prose.trim()
            if (isPatternAgentTurn) {
              if (prose) reasoningTexts.push(prose)
              prose = hasModuleList ? MODULE_LIST_GUIDANCE : hasPatternMatch ? PATTERN_MATCH_GUIDANCE : ""
            } else if (!prose) {
              if (hasModuleList) prose = MODULE_LIST_GUIDANCE
              else if (hasPatternMatch) prose = PATTERN_MATCH_GUIDANCE
            }
            proseSegments = splitProseSegments(prose)
          }

          if (reasoningTexts.length > 0) {
            // 用时 = 最后一条 assistant 消息 completed-created(对齐 design reasoningDuration)
            const lastTime = (turn.assistants[turn.assistants.length - 1].info || {}).time || {}
            turnEl.appendChild(renderReasoningBlock(
              reasoningTexts,
              typeof lastTime.completed === "number" && typeof lastTime.created === "number"
                ? lastTime.completed - lastTime.created
                : 0,
            ))
          }

          const proseRow = buildProseRow(proseSegments, isFormSubmitted(turns, turnIndex))
          if (proseRow) turnEl.appendChild(proseRow)

          // 工具调用区(对齐 design:技能组 → 其他工具组 → 子任务卡,同一 8px 间距容器)
          const { skillCalls, otherCalls } = collectToolCalls(turn, allParts)
          const subtasks = collectSubtasks(allParts, sessionsById)
          if (skillCalls.length > 0 || otherCalls.length > 0 || subtasks.length > 0) {
            const toolsWrap = document.createElement("div")
            toolsWrap.className = "tool-cards"
            if (skillCalls.length > 0) buildToolGroupCards(skillCalls, toolsWrap)
            if (otherCalls.length > 0) buildToolGroupCards(otherCalls, toolsWrap)
            for (const st of subtasks) toolsWrap.appendChild(buildSubtaskCard(st))
            turnEl.appendChild(toolsWrap)
          }
          // 文件操作摘要 + 涉及文件列表(对齐 design FileOpsSummary / ProducedFilesList)
          const fileOps = buildFileOps(otherCalls)
          if (fileOps) turnEl.appendChild(fileOps)
          const producedFiles = buildProducedFiles(otherCalls)
          if (producedFiles) turnEl.appendChild(producedFiles)

          // 错误提示(对齐 design MakeErrorNotice:生成出错/认证失败/上下文超出提示)
          const errorNotice = buildTurnErrorNotice(turn)
          if (errorNotice) turnEl.appendChild(errorNotice)

          // 中断的 turn 不出产物卡(对齐 design outputCards 的 isAborted 门:中断轮次卡片全部隐藏)
          const isAbortedTurn = turn.assistants.some(m => ((m.info || {}).error || {}).name === "MessageAbortedError")
          if (!isAbortedTurn) {
            for (const a of artifacts) {
              const card = document.createElement("div")
              card.className = "artifact-card"
              // link 卡 tooltip 显示链接内容;截断的完整 HTML 文档用警示边框(对齐 design displayCards)
              if (a.type === "link") card.title = a.content
              if (a.type === "html" && isTruncatedHtml(a.content)) card.style.border = "1px solid rgba(234,179,8,0.3)"
              const icon = document.createElement("img")
              icon.className = "artifact-card-icon"
              icon.src = artifactIconSrc(a.type)
              icon.alt = ""
              const body = document.createElement("div")
              body.className = "artifact-card-body"
              const title = document.createElement("span")
              title.className = "artifact-card-title"
              title.textContent = a.title || a.type
              body.appendChild(title)
              if (cardTime !== null) {
                const meta = document.createElement("span")
                meta.className = "artifact-card-meta"
                meta.textContent = formatTime(new Date(cardTime))
                body.appendChild(meta)
              }
              card.appendChild(icon)
              card.appendChild(body)
              turnEl.appendChild(card)
            }
          }

          // 中断提示(对齐 design isAborted 的 MessageDivider)
          if (isAbortedTurn) {
            turnEl.appendChild(buildDivider("已中断"))
          }
        }

        // hover 元信息:agent · model · 耗时 · 中断(对齐 design turnMeta)
        const meta = buildTurnMeta(turn, manifest.models || {})
        if (meta) turnEl.appendChild(meta)

        list.appendChild(turnEl)
      }

      // 无任何 turn 可渲染(消息为空)→ 空状态
      if (list.children.length === 0) {
        showEmptyState()
        return
      }

      // 渲染完成后标记超长代码块为可展开(对齐 design updateCodeExpandState:scrollHeight > 320 + 4)
      markExpandableCodeBlocks(list)
      // 渲染完成后标记超长用户气泡为可展开(对齐 design ExpandableBubble:scrollHeight > 222 + 4)
      markExpandableUserBubbles(list)
    }

    // ─────────────────────────────────────────────────────────
    // insight 会话渲染(对齐 insight 页 InsightTurn + 上游 SessionTurn/message-part:
    // 附件 48px 缩略图/文件卡、assistant 内容 12px 内缩、ContextToolGroup 工具分组、
    // 每条消息各自的 reasoning 折叠块、text-part-meta 与用户气泡 meta hover 显示、
    // 知识库引用列表、产物入口卡、长任务卡、压缩 turn 状态条)
    // ─────────────────────────────────────────────────────────

    // 用户可见文本(对齐 insight 页:优先 metadata.displayText 回显资产胶囊,否则取第一个非 synthetic text part 原文)
    function insightUserText(parts) {
      const displayPart = parts.find(
        (p) => p.type === "text" && p.metadata && Array.isArray(p.metadata.insightProductAssets) && typeof p.metadata.displayText === "string",
      )
      if (displayPart) return displayPart.metadata.displayText.trim()
      const textPart = parts.find((p) => p.type === "text" && !p.synthetic && p.text)
      return textPart ? textPart.text.trim() : ""
    }

    // agent 展示名(对齐上游:octo_ai → Octo_Agent,首字母大写)
    function insightAgentLabel(agent) {
      if (!agent) return ""
      if (agent === "octo_ai") agent = "Octo_Agent"
      return agent[0].toUpperCase() + agent.slice(1)
    }

    // 用时文案(对齐上游 i18n zh:"N秒" / "N分 NS秒")
    function insightDurationText(ms) {
      if (!(ms >= 0)) return ""
      const total = Math.round(ms / 1000)
      if (total < 60) return total + "秒"
      const minutes = Math.floor(total / 60)
      const seconds = total % 60
      return minutes + "分 " + seconds + "秒"
    }

    // HH:mm 短时间(对齐上游 user-message metaTail 的 timeStyle: "short")
    function insightShortTime(ts) {
      if (typeof ts !== "number") return ""
      return new Date(ts).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit", hour12: false })
    }

    // YYYY-MM-DD HH:mm(对齐 TaskCardView/OutputEntryCard formatFullTime/formatCreatedTime)
    function insightFullTime(ts) {
      if (typeof ts !== "number") return ""
      const d = new Date(ts)
      const p = (n) => String(n).padStart(2, "0")
      return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes())
    }

    // ── resource_link 扫描(对齐 insight utils/resource-link.ts)──
    function insightReadResourceLink(part) {
      if (!part || typeof part !== "object") return []
      const found = []
      if (part.type === "resource_link" && typeof part.uri === "string" && typeof part.mimeType === "string") {
        found.push({
          uri: part.uri,
          name: typeof part.name === "string" ? part.name : "",
          mimeType: part.mimeType,
          description: typeof part.description === "string" ? part.description : undefined,
        })
        return found
      }
      const meta = part.metadata
      if (meta && typeof meta === "object") {
        const direct = meta.resource_link
        if (direct && typeof direct === "object" && typeof direct.uri === "string" && typeof direct.mimeType === "string") {
          found.push({
            uri: direct.uri,
            name: typeof direct.name === "string" ? direct.name : "",
            mimeType: direct.mimeType,
            description: typeof direct.description === "string" ? direct.description : undefined,
          })
        }
        if (Array.isArray(meta.content)) {
          for (const item of meta.content) found.push(...insightReadResourceLink(item))
        }
      }
      if (part.type === "tool") {
        const state = part.state
        if (state && state.status === "completed" && typeof state.output === "string") {
          try {
            const parsed = JSON.parse(state.output)
            if (parsed && typeof parsed === "object" && Array.isArray(parsed.content)) {
              for (const item of parsed.content) found.push(...insightReadResourceLink(item))
            }
          } catch {}
        }
      }
      return found
    }
    function insightFindResourceLinks(parts) {
      const out = []
      for (const part of parts) out.push(...insightReadResourceLink(part))
      return out
    }

    // ── 长任务识别与聚合(对齐 insight utils/task-detect.ts + index.tsx taskCards memo)──
    const INSIGHT_KNOWN_TASK_STATUSES = ["pending", "processing", "completed", "failed", "stopped"]
    const INSIGHT_BUSINESS_TOOLS = ["key_findings", "run_guide_analysis", "run_usability_analysis", "mindmap"]
    function insightIsBusinessTool(name) {
      return INSIGHT_BUSINESS_TOOLS.some((biz) => name === biz || name.endsWith(":" + biz) || name.endsWith("_" + biz))
    }
    function insightIsStopTool(name) {
      return name === "stop_task" || name.endsWith(":stop_task") || name.endsWith("_stop_task")
    }
    function insightToolDisplayName(name) {
      const map = { key_findings: "观点解析", run_guide_analysis: "按提纲聚类", run_usability_analysis: "可用性测试分析", mindmap: "思维导图" }
      const bare = name.includes(":") ? name.split(":").pop() : name
      return map[bare] ?? bare
    }
    function insightParseToolResult(state) {
      if (typeof state.output !== "string") return null
      try {
        const parsed = JSON.parse(state.output)
        if (parsed && typeof parsed === "object") return parsed
      } catch {}
      return null
    }
    function insightReadTaskInfo(part) {
      if (!part || typeof part !== "object" || part.type !== "tool") return null
      const state = part.state
      if (!state || state.status !== "completed") return null
      let sc = null
      const meta = state.metadata
      if (meta && typeof meta === "object") {
        if (meta.structuredContent && typeof meta.structuredContent === "object") sc = meta.structuredContent
        else if (typeof meta.task_id === "string") sc = meta
      }
      if (!sc) {
        const parsed = insightParseToolResult(state)
        if (parsed && parsed.structuredContent && typeof parsed.structuredContent === "object") sc = parsed.structuredContent
      }
      if (!sc || !sc.task_id) return null
      const toolName = typeof part.tool === "string" ? part.tool : "unknown"
      const rawStatus = typeof sc.status === "string" ? sc.status : "processing"
      const status = INSIGHT_KNOWN_TASK_STATUSES.includes(rawStatus) ? rawStatus : "failed"
      const message =
        typeof sc.message === "string" && sc.message.length > 0 ? sc.message
          : status === "failed" && !INSIGHT_KNOWN_TASK_STATUSES.includes(rawStatus) ? "未知状态:" + rawStatus : undefined
      let resultText
      let resourceLinks = []
      if (status === "completed" && !insightIsStopTool(toolName)) {
        const parsed = insightParseToolResult(state)
        if (parsed && Array.isArray(parsed.content)) {
          const textItem = parsed.content.find((c) => c && typeof c === "object" && c.type === "text" && typeof c.text === "string")
          if (textItem) resultText = textItem.text
          resourceLinks = insightFindResourceLinks(parsed.content)
        }
        if (resourceLinks.length === 0) resourceLinks = insightFindResourceLinks([part])
      }
      return { taskId: String(sc.task_id), toolName, status, message, resultText, resourceLinks }
    }
    function insightAggregateTaskCards(messages) {
      const items = []
      let lastUserMsgID = ""
      for (const msg of messages) {
        const role = msg.info && msg.info.role
        if (role === "user") {
          lastUserMsgID = msg.info.id
          continue
        }
        if (role !== "assistant" || !lastUserMsgID) continue
        const msgTime = (msg.info.time || {}).created
        for (const part of msg.parts || []) {
          const info = insightReadTaskInfo(part)
          if (info) items.push({ ...info, userMsgID: lastUserMsgID, time: typeof msgTime === "number" ? msgTime : 0 })
        }
      }
      const grouped = new Map()
      for (const item of items) {
        const arr = grouped.get(item.taskId) ?? []
        arr.push(item)
        grouped.set(item.taskId, arr)
      }
      const result = new Map()
      for (const [taskId, group] of grouped) {
        group.sort((a, b) => a.time - b.time)
        const first = group[0]
        const latest = group[group.length - 1]
        const businessItem = group.find((g) => insightIsBusinessTool(g.toolName))
        const firstWithLinks = group.find((g) => g.status === "completed" && g.resourceLinks.length > 0)
        const latestText = group.reduce((acc, g) => (g.resultText && g.resultText.length > 0 ? g.resultText : acc), undefined)
        result.set(taskId, {
          taskId,
          status: latest.status,
          message: latest.message,
          toolName: businessItem ? businessItem.toolName : first.toolName,
          anchorUserMessageID: first.userMsgID,
          submittedAt: first.time,
          lastUpdatedAt: latest.time,
          resultText: latestText,
          resourceLinks: firstWithLinks ? firstWithLinks.resourceLinks : latest.resourceLinks,
        })
      }
      return result
    }

    // ── 产物类型判定(对齐 insight utils/output-type.ts resolveOutputType)──
    const INSIGHT_RENDER_EXT = {
      md: "markdown", markdown: "markdown", mdown: "markdown", mkd: "markdown",
      html: "html", htm: "html", xhtml: "html",
      json: "json", json5: "json", jsonc: "json",
      png: "image", jpg: "image", jpeg: "image", gif: "image", webp: "image", bmp: "image",
      tiff: "image", tif: "image", ico: "image", svg: "image", heic: "image", heif: "image", avif: "image",
    }
    const INSIGHT_FILE_EXT = new Set([
      "csv", "tsv", "xls", "xlsx", "xlsm", "xlsb", "ods", "doc", "docx", "ppt", "pptx", "odt", "odp", "rtf", "pdf",
      "pages", "numbers", "key", "epub", "psd", "ai", "sketch", "fig", "mp4", "mov", "avi", "mkv", "webm", "flv", "wmv",
      "m4v", "mp3", "wav", "flac", "m4a", "aac", "ogg", "opus", "zip", "tar", "gz", "tgz", "bz2", "xz", "zst", "rar",
      "7z", "iso", "dmg", "pkg", "deb", "rpm", "msi", "apk", "woff", "woff2", "ttf", "otf", "eot", "exe", "dll", "so",
      "dylib", "bin", "o", "a", "lib", "obj", "class", "wasm", "app",
    ])
    function insightExtOf(filePath) {
      const base = String(filePath || "").split(/[\\/]/).pop() || ""
      const dot = base.lastIndexOf(".")
      if (dot <= 0 || dot === base.length - 1) return ""
      return base.slice(dot + 1).toLowerCase()
    }
    function insightResolveOutputType(filename, mimeType) {
      const ext = insightExtOf(filename)
      if (ext) {
        if (INSIGHT_RENDER_EXT[ext]) return INSIGHT_RENDER_EXT[ext]
        if (INSIGHT_FILE_EXT.has(ext)) return "file"
        return "code"
      }
      const mime = String(mimeType || "").toLowerCase()
      if (mime) {
        if (mime === "text/html") return "html"
        if (mime === "text/markdown") return "markdown"
        if (mime === "application/json") return "json"
        if (mime === "text/plain") return "code"
        if (mime === "text/csv") return "file"
        if (mime.startsWith("image/")) return "image"
        if (!mime.startsWith("text/")) return "file"
      }
      return "code"
    }

    // ── 文件类型图标(对齐 insight icons/illustrations.tsx fileTypeIconUrl;svg 已拷贝至 share/icons)──
    function insightFileIconUrl(fileName, mimeType) {
      const ext = String(fileName || "").split(".").pop()?.toLowerCase() ?? ""
      const mime = String(mimeType || "").toLowerCase()
      if (ext === "doc" || ext === "docx" || mime.includes("wordprocessingml") || mime.includes("msword")) return FILE_ICON_BASE + "IconFileDoc.svg"
      if (ext === "xls" || ext === "xlsx" || mime.includes("spreadsheetml") || mime.includes("ms-excel")) return FILE_ICON_BASE + "IconFileExcel.svg"
      if (ext === "ppt" || ext === "pptx" || mime.includes("presentationml") || mime.includes("ms-powerpoint")) return FILE_ICON_BASE + "IconFilePpt.svg"
      if (ext === "pdf" || mime === "application/pdf") return FILE_ICON_BASE + "IconFilePdf.svg"
      if (ext === "html" || ext === "htm" || mime.includes("html")) return FILE_ICON_BASE + "IconFileHtml.svg"
      if (ext === "md" || ext === "markdown" || mime.includes("markdown")) return FILE_ICON_BASE + "IconFileMarkdown.svg"
      if (ext === "json" && mime.includes("mindmap")) return FILE_ICON_BASE + "IconFileMindmap.svg"
      if (["mp4", "mov", "avi", "mkv", "webm", "flv"].includes(ext) || mime.startsWith("video/")) return FILE_ICON_BASE + "IconFileVideo.svg"
      if (["jpg", "jpeg", "png", "gif", "webp", "svg", "bmp"].includes(ext) || mime.startsWith("image/")) return FILE_ICON_BASE + "IconFileImage.svg"
      if (["js", "ts", "jsx", "tsx", "py", "java", "go", "rs", "c", "cpp", "cs", "rb", "php", "sh"].includes(ext) || mime.includes("javascript") || mime.includes("typescript")) return FILE_ICON_BASE + "IconFileCode.svg"
      return FILE_ICON_BASE + "IconFileOther.svg"
    }

    // ── 思维导图 shape 判定(对齐 insight utils/mindmap-adapter.ts collectRoots)──
    function insightMindmapRoots(json, declared) {
      if (Array.isArray(json)) return json.flatMap((item) => insightMindmapRoots(item, declared))
      if (json && typeof json === "object") {
        if (Array.isArray(json.mindmaps)) return json.mindmaps.flatMap((m) => insightMindmapRoots(m, true))
        if (Array.isArray(json.nodes)) return json.nodes.flatMap((n) => insightMindmapRoots(n, true))
        if (declared) {
          if (typeof json.name === "string" || Array.isArray(json.children)) return [json]
          return []
        }
        if (Array.isArray(json.children)) return [json]
      }
      return []
    }
    function insightIsMindmapJSON(text) {
      const stripped = String(text).replace(/^```(?:json)?\s*/i, "").replace(/```\s*$/i, "").trim()
      let json
      try { json = JSON.parse(stripped) } catch { return false }
      return insightMindmapRoots(json, false).length > 0
    }

    // ── ```html fence 嗅探(对齐 insight utils/detect.ts scanFencedHtml)──
    function insightScanFencedHtml(textParts) {
      const blocks = []
      for (let i = 0; i < textParts.length; i++) {
        const text = textParts[i] && textParts[i].text
        if (typeof text !== "string" || text.length === 0) continue
        const closedRe = /```html\b\s*\n([\s\S]+?)\n?```/gi
        let m
        let lastClosedEnd = 0
        while ((m = closedRe.exec(text)) !== null) {
          if (m[1].trim().length >= 50) blocks.push({ html: m[1], partIndex: i })
          lastClosedEnd = closedRe.lastIndex
        }
        const tail = text.slice(lastClosedEnd)
        const tailMatch = tail.match(/```html\b\s*\n([\s\S]+)$/i)
        if (tailMatch && !tailMatch[1].includes("```") && tailMatch[1].trim().length >= 50) {
          blocks.push({ html: tailMatch[1], partIndex: i })
        }
      }
      return blocks
    }

    // ── write 产物(对齐 insight utils/write-output.ts findWriteCards:metadata.filepath 优先)──
    function insightFindWriteCards(parts) {
      const byPath = new Map()
      for (const part of parts) {
        if (!part || part.type !== "tool") continue
        const tool = typeof part.tool === "string" ? part.tool : ""
        const bare = tool.includes(":") ? tool.split(":").pop() : tool
        if (!(bare === "write" || bare === "edit" || bare.endsWith("_write") || bare.endsWith("_edit"))) continue
        const state = part.state
        if (!state || state.status !== "completed") continue
        let filePath
        const meta = state.metadata
        if (meta && typeof meta === "object" && typeof meta.filepath === "string" && meta.filepath.length > 0) {
          filePath = meta.filepath
        } else {
          const input = state.input
          if (input && typeof input === "object") {
            const v = input.filePath ?? input.path ?? input.file_path
            if (typeof v === "string" && v.length > 0) filePath = v
          }
        }
        if (!filePath) continue
        byPath.delete(filePath)
        byPath.set(filePath, { filePath, type: insightResolveOutputType(filePath) })
      }
      return [...byPath.values()]
    }

    // ── 知识库来源(对齐 insight components/knowledge-references.ts readKnowledgeSources)──
    function insightReadKnowledgeSources(parts) {
      for (const part of parts) {
        if (!part || part.type !== "tool") continue
        if (!(part.tool === "knowledge_search" || part.tool === "insight_report_search")) continue
        const meta = (part.state || {}).metadata
        if (!meta || !Array.isArray(meta.sources)) continue
        const sources = meta.sources.filter(
          (s) => s && typeof s === "object" && typeof s.n === "number" && typeof s.title === "string",
        )
        if (sources.length > 0) return sources
      }
      return []
    }

    // ── 工具行(对齐上游 getToolInfo + insight TOOL_TITLE_OVERRIDES / GenericTool)──
    function insightFilenameOf(p) {
      return String(p || "").split(/[\\/]/).filter(Boolean).pop()
    }
    function insightToolLabel(input) {
      if (!input) return undefined
      for (const key of ["description", "query", "url", "filePath", "path", "pattern", "name"]) {
        const v = input[key]
        if (typeof v === "string" && v.length > 0) return v
      }
      return undefined
    }
    function insightToolArgs(input) {
      if (!input) return []
      const skip = new Set(["description", "query", "url", "filePath", "path", "pattern", "name"])
      return Object.entries(input)
        .filter(([k]) => !skip.has(k))
        .flatMap(([k, v]) =>
          typeof v === "string" || typeof v === "number" || typeof v === "boolean" ? [k + "=" + v] : [])
        .slice(0, 3)
    }
    function insightToolRowInfo(part) {
      const input = (part.state || {}).input || {}
      const tool = typeof part.tool === "string" ? part.tool : ""
      switch (tool) {
        case "read": return { title: "读取文件", subtitle: input.filePath ? insightFilenameOf(input.filePath) : undefined, args: [] }
        case "list": return { title: "列表", subtitle: insightFilenameOf(input.path), args: [] }
        case "glob": return { title: "查找文件", subtitle: input.pattern, args: [] }
        case "grep": return { title: "检索内容", subtitle: input.pattern, args: [] }
        case "webfetch": return { title: "Webfetch", subtitle: input.url, args: [] }
        case "websearch": return { title: "网络搜索", subtitle: input.query, args: [] }
        case "task": return { title: "子任务分析", subtitle: input.description, args: [] }
        case "bash": return { title: "Shell", subtitle: input.description, args: [] }
        case "edit": return { title: "编辑", subtitle: input.filePath ? insightFilenameOf(input.filePath) : undefined, args: [] }
        case "write": return { title: "写入产物", subtitle: input.filePath ? insightFilenameOf(input.filePath) : undefined, args: [] }
        case "apply_patch": return { title: "补丁", subtitle: undefined, args: [] }
        case "todowrite": return { title: "todos", subtitle: undefined, args: [] }
        case "skill": return { title: (typeof input.name === "string" && input.name) || "技能", subtitle: undefined, args: [] }
        default: {
          // GenericTool:"调用了 `tool`";extract_document 按参数特例中文化(对齐 withInsightToolTitles)
          if (tool === "extract_document") return { title: "提取文档正文", subtitle: insightToolLabel(input), args: [] }
          return { title: "调用了 `" + tool + "`", subtitle: insightToolLabel(input), args: insightToolArgs(input) }
        }
      }
    }
    // ContextToolGroup 单项(对齐 contextToolTrigger:subtitle 优先,兜底 error/title/description)
    function insightCtxItemInfo(part) {
      const input = (part.state || {}).input || {}
      const path = typeof input.path === "string" ? input.path : "/"
      const tool = typeof part.tool === "string" ? part.tool : ""
      if (tool === "read") {
        const args = []
        if (typeof input.offset === "number") args.push("offset=" + input.offset)
        if (typeof input.limit === "number") args.push("limit=" + input.limit)
        return { title: "读取文件", subtitle: input.filePath ? insightFilenameOf(input.filePath) : "", args }
      }
      if (tool === "list") return { title: "列表", subtitle: insightFilenameOf(path), args: [] }
      if (tool === "glob") {
        return { title: "查找文件", subtitle: insightFilenameOf(path), args: input.pattern ? ["pattern=" + input.pattern] : [] }
      }
      if (tool === "grep") {
        const args = []
        if (typeof input.pattern === "string") args.push("pattern=" + input.pattern)
        if (typeof input.include === "string") args.push("include=" + input.include)
        return { title: "检索内容", subtitle: insightFilenameOf(path), args }
      }
      return { title: tool, subtitle: insightToolLabel(input) ?? "", args: [] }
    }

    // ── 元素构造 ──
    function buildInsightToolRow(info) {
      const row = document.createElement("div")
      row.className = "insight-tool-row"
      row.appendChild(makeSpan("insight-tool-title", info.title))
      if (info.subtitle) row.appendChild(makeSpan("insight-tool-subtitle", info.subtitle))
      for (const arg of info.args || []) row.appendChild(makeSpan("insight-tool-subtitle", arg))
      return row
    }
    // ContextToolGroup:触发行「已探索 · N 次读取 · N 次搜索 · N 个列表」+ 可折叠明细(对齐上游 ContextToolGroup)
    function buildInsightCtxGroup(parts) {
      const wrap = document.createElement("div")
      wrap.className = "insight-ctx-group"
      const trigger = document.createElement("button")
      trigger.type = "button"
      trigger.className = "insight-ctx-trigger"
      trigger.setAttribute("data-open", "false")
      const title = document.createElement("span")
      title.className = "insight-ctx-title"
      title.appendChild(makeSpan("insight-ctx-label", "已探索"))
      const read = parts.filter((p) => p.tool === "read").length
      const search = parts.filter((p) => p.tool === "glob" || p.tool === "grep").length
      const list = parts.filter((p) => p.tool === "list").length
      // 只显示非零计数,逗号分隔(对齐上游 AnimatedCountList:count=0 的项隐藏)
      const counts = [
        read > 0 ? read + " 次读取" : "",
        search > 0 ? search + " 次搜索" : "",
        list > 0 ? list + " 个列表" : "",
      ].filter(Boolean)
      title.appendChild(makeSpan("insight-ctx-summary", counts.join(", ")))
      trigger.appendChild(title)
      const chevron = document.createElement("span")
      chevron.className = "insight-ctx-chevron"
      chevron.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M3 4.5l3 3 3-3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/></svg>'
      trigger.appendChild(chevron)
      const items = document.createElement("div")
      items.className = "insight-ctx-items"
      items.setAttribute("data-open", "false")
      for (const part of parts) {
        const info = insightCtxItemInfo(part)
        items.appendChild(buildInsightToolRow(info))
      }
      trigger.addEventListener("click", () => {
        const open = trigger.getAttribute("data-open") === "true"
        trigger.setAttribute("data-open", String(!open))
        items.setAttribute("data-open", String(!open))
      })
      wrap.appendChild(trigger)
      wrap.appendChild(items)
      return wrap
    }
    // reasoning 折叠块(对齐上游 reasoning-part:无正文兄弟 part 的消息自动展开,正文为 Markdown)
    function buildInsightReasoning(text, durationMs, autoOpen) {
      const wrap = document.createElement("div")
      wrap.className = "insight-reasoning"
      const toggle = document.createElement("button")
      toggle.type = "button"
      toggle.className = "reasoning-toggle"
      toggle.setAttribute("data-open", String(autoOpen))
      toggle.setAttribute("aria-expanded", String(autoOpen))
      // 用时格式对齐上游 reasoning-part:"Ns"/"Nm Ns"(design 分支同款 formatDuration)
      const duration = formatDuration(durationMs)
      toggle.innerHTML =
        "<span>已深度思考</span>" +
        (duration ? "<span>（用时" + duration + "）</span>" : "") +
        '<span style="display:inline-flex;align-items:center;flex-shrink:0;">' + CODE_CHEVRON_SVG + "</span>"

      toggle.addEventListener("click", () => {
        const open = toggle.getAttribute("data-open") === "true"
        toggle.setAttribute("data-open", String(!open))

    // 知识库引用列表(对齐 KnowledgeReferences:折叠「引用 N 篇资料作为参考」)
    function buildInsightKbRefs(sources) {
      const wrap = document.createElement("div")
      wrap.className = "insight-kb-refs"
      const toggle = document.createElement("button")
      toggle.type = "button"
      toggle.className = "insight-kb-toggle"

      toggle.appendChild(caret)

        // 分享内容不可信:仅 http(s) 可点,其余按纯文本标题渲染(沿用旧 insight 分支的安全策略)
        const nameEl = typeof s.url === "string" && /^https?:\/\//i.test(s.url)
          ? (() => {
              const a = document.createElement("a")
              a.className = "insight-kb-link"
              a.href = s.url
              a.target = "_blank"
              a.rel = "noopener noreferrer"

            })()
          : (() => {
              const span = document.createElement("span")
              span.className = "insight-kb-title"
              span.title = s.title
              span.textContent = s.title
              return span
            })()

        const open = ol.style.display !== "none"
        ol.style.display = open ? "none" : ""
        caret.textContent = open ? "▸" : "▾"
      })
      wrap.appendChild(toggle)
      wrap.appendChild(ol)
      return wrap
    }
    // 产物入口卡(对齐 OutputEntryCard 静态版:图标/标题/「创建时间: …」)
    function insightEntryLabel(card) {
      if (card.title && card.title.length > 0 && card.title !== "分析结果") return card.title
      if (card.type === "json" && card.content && insightIsMindmapJSON(card.content)) return "思维导图"
      switch (card.type) {
        case "html": return "可视化页面"
        case "markdown": return "Markdown 文档"
        case "json": return "JSON 数据"
        case "code": return card.fileName || "代码文件"
        case "file": return card.fileName || "文件"
        case "image": return card.fileName || "图片"
      }
      return card.title || ""
    }
    function insightCardIconUrl(card) {
      if (card.type === "json" && card.content && insightIsMindmapJSON(card.content)) {
        return insightFileIconUrl("x.json", "application/json+mindmap")
      }
      if (card.fileName || card.mimeType) return insightFileIconUrl(card.fileName, card.mimeType)
      const synth = { html: "x.html", markdown: "x.md", json: "x.json" }[card.type]
      return insightFileIconUrl(synth)
    }
    function buildInsightEntryCard(card) {
      const el = document.createElement("div")
      el.className = "insight-entry-card"
      const icon = document.createElement("span")
      icon.className = "insight-entry-icon"
      const img = document.createElement("img")
      img.src = insightCardIconUrl(card)
      img.alt = ""
      icon.appendChild(img)
      const body = document.createElement("span")
      body.className = "insight-entry-body"
      const label = insightEntryLabel(card)
      const title = document.createElement("span")
      title.className = "insight-entry-title"
      title.textContent = label
      title.title = label
      const desc = document.createElement("span")
      desc.className = "insight-entry-desc"
      desc.textContent = "创建时间: " + insightFullTime(card.createdAt)
      body.appendChild(title)
      body.appendChild(desc)
      el.appendChild(icon)
      el.appendChild(body)
      return el
    }
    // 长任务卡(对齐 TaskCardView 静态版:状态图标/文案/提交时间/ID;分享页不出交互按钮)
    function insightTaskStatusLabel(s) {
      return { pending: "任务排队中", processing: "任务进行中", completed: "任务完成", failed: "任务失败", stopped: "任务已终止" }[s] ?? "任务失败"
    }
    function insightCnNum(n) {
      const map = ["零", "一", "两", "三", "四", "五", "六", "七", "八", "九", "十"]
      return map[n] ?? String(n)
    }
    function buildInsightTaskCard(entry) {

        img.src = FILE_ICON_BASE + "IconTaskFailed.svg"
        img.alt = ""

      } else {
        icon.style.color = "#BFBFBF"
        icon.innerHTML = '<svg viewBox="0 0 16 16" width="18" height="18" fill="none" style="display:inline-block"><path d="M10.6019 10.036C10.6019 10.311 10.3769 10.536 10.1019 10.536L5.89893 10.536C5.81116 10.536 5.72494 10.5129 5.64893 10.469C5.57292 10.4251 5.5098 10.362 5.46591 10.286C5.42203 10.21 5.39893 10.1238 5.39893 10.036L5.39893 5.96399C5.39893 5.87622 5.42203 5.79 5.46591 5.71399C5.5098 5.63798 5.57292 5.57486 5.64893 5.53098C5.72494 5.48709 5.81116 5.46399 5.89893 5.46399L10.1019 5.46399C10.3769 5.46399 10.6019 5.68899 10.6019 5.96399L10.6019 10.036Z" fill="currentColor"/><path d="M15.8679 8.00197C15.8708 6.61969 15.5087 5.26115 14.8184 4.06358C14.1281 2.86602 13.1339 1.87186 11.9363 1.18153C10.7388 0.491198 9.38023 0.129156 7.99795 0.131974C6.9647 0.130307 5.9413 0.332717 4.98647 0.727584C4.03165 1.12245 3.16421 1.702 2.43395 2.43297C1.70207 3.16365 1.1219 4.03185 0.726831 4.9876C0.331762 5.94335 0.12959 6.96779 0.131949 8.00197C0.126391 9.03665 0.326303 10.0621 0.72009 11.019C1.11388 11.9758 1.6937 12.8449 2.42595 13.576C3.15643 14.308 4.02508 14.8876 4.98144 15.281C5.93781 15.6745 6.96282 15.874 7.99695 15.868C12.3299 15.824 15.8679 12.333 15.8679 8.00197ZM1.05595 8.00197C1.05525 6.78295 1.37556 5.58523 1.98467 4.52928C2.59377 3.47334 3.4702 2.59641 4.52579 1.98669C5.58139 1.37698 6.77892 1.05597 7.99795 1.05597C11.8569 1.05597 14.9869 4.18297 14.9869 8.00197C14.9869 11.815 11.8569 14.946 7.99795 14.946C6.77758 14.9515 5.57751 14.6337 4.51977 14.025C3.46203 13.4163 2.58434 12.5383 1.97593 11.4804C1.36753 10.4225 1.05011 9.22235 1.05595 8.00197Z" fill="currentColor"/></svg>'
      }
      head.appendChild(icon)
      head.appendChild(makeSpan("insight-task-status", insightTaskStatusLabel(status)))
      card.appendChild(head)
      const body = document.createElement("div")
      body.className = "insight-task-body"
      if (status === "pending" || status === "processing") {
        body.textContent = entry.message ?? ""
      } else if (status === "completed") {
        const n = entry.resourceLinks.length
        body.textContent = n <= 0 ? "分析已完成" : "共生成" + insightCnNum(n) + "份文件"
      } else if (status === "failed") {
        body.textContent = "请稍后重试"
        if (entry.message) {
          const toggle = document.createElement("button")
          toggle.type = "button"
          toggle.className = "insight-task-msg-toggle"
          const firstLine = entry.message.split("\n")[0]
          toggle.appendChild(makeSpan("file-name", firstLine))
          const chev = document.createElement("span")
          chev.innerHTML = '<svg viewBox="0 0 16 16" width="13" height="13" fill="none" style="display:inline-block;transition:transform 150ms ease"><path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>'
          toggle.appendChild(chev)
          const pre = document.createElement("pre")
          pre.className = "insight-task-error-pre"
          pre.textContent = entry.message
          pre.style.display = "none"
          toggle.addEventListener("click", () => {
            const open = pre.style.display !== "none"
            pre.style.display = open ? "none" : ""
            chev.firstChild.style.transform = open ? "none" : "rotate(180deg)"
          })
          card.appendChild(body)
          card.appendChild(toggle)
          card.appendChild(pre)
          appendInsightTaskFooter(card, entry)
          return card
        }
      } else if (status === "stopped") {
        body.textContent = "任务已被终止"
      }
