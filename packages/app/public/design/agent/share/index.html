      return ["creating", "queued", "running", "succeeded", "create_failed", "failed", "abnormal"].indexOf(studio.status) !== -1
        ? studio.status
        : "running"
    }

    // 编辑区入口(对齐 turns.ts editorEntry)
    function studioEditorEntry(tools) {
      for (var i = 0; i < tools.length; i++) {
        if (tools[i].tool !== "studio_editor_entry") continue
        var state = tools[i].state || {}
        var metadata = (state.metadata || {}).studio || {}
        var input = state.input || {}
        var capability = metadata.capability ?? input.capability
        var entryID = typeof metadata.entryID === "string" ? metadata.entryID : typeof input.entryID === "string" ? input.entryID : ""
        if (STUDIO_EDITOR_CAPABILITIES.indexOf(capability) !== -1 && entryID) {
          return { capability: capability, entryID: entryID }
        }
      }
      return undefined
    }

    // 参考图(对齐 turns.ts buildStudioInputImages)
    function studioBuildInputImages(input, capability) {
      var referenceImages = (Array.isArray(input.referenceImages) ? input.referenceImages : [])
        .filter(function (value) { return typeof value === "string" && value.trim() && !/^data:video\//i.test(value.trim()) })
      var urls
      if (capability === "image.generate" || capability === "image.fusion") urls = referenceImages
      else if (capability === "video.generate") {
        var extra = input.extra && typeof input.extra === "object" ? input.extra : {}
        urls = [extra.firstFrame, extra.lastFrame].concat(referenceImages)
      } else urls = [input.sourceImage]
      var seen = {}
      return (urls || []).filter(function (value) {
        if (typeof value !== "string" || !value.trim()) return false
        var key = value.trim()
        if (seen[key]) return false
        seen[key] = true
        return true
      })
    }

    // 一轮生成结果(对齐 turns.ts buildResult:完成的含媒体工具 > 运行中 > 失败)
    function studioBuildResultTurn(input, imageBlobMap) {
      var tools = input.tools
      var completed, running, errored
      for (var i = tools.length - 1; i >= 0; i--) {
        var part = tools[i]
        var state = part.state || {}
        if (!completed && state.status === "completed" &&
            (parseStudioToolMedia(state.output, imageBlobMap).length > 0 ||
             parseStudioToolAttachments(part).length > 0 ||
             parseStudioToolImages(state.output).length > 0 ||
             parseStudioToolVideos(state.output).length > 0)) {
          completed = part
        }
        if (!running && state.status === "running") running = part
        if (!errored && state.status === "error") errored = part
      }
      var activeTool = completed || running || errored
      var toolInput = activeTool && activeTool.state && activeTool.state.input && typeof activeTool.state.input === "object" ? activeTool.state.input : {}
      var output = parseToolOutput(completed && completed.state && completed.state.output)
      var capability = studioNormalizeCapability(output.capability || toolInput.capability)
      // 媒体:结构化 media 优先,回退附件/图片/视频 URL(对齐 buildResult 的 media 提取)
      var media = completed ? parseStudioToolMedia(completed.state.output, imageBlobMap) : []
      if (completed && media.length === 0) {
        var seen = {}
        media = parseStudioToolAttachments(completed)
          .concat(parseStudioToolVideos(completed.state.output).map(function (url) { return { kind: "video", url: url } }))
          .concat(parseStudioToolImages(completed.state.output).map(function (url) { return { kind: "image", url: url } }))
          .filter(function (item) { if (seen[item.url]) return false; seen[item.url] = true; return true })
      }
      var aspectRatio = studioNormalizeAspectRatio(output.aspectRatio || toolInput.aspectRatio)
      // 视频时长(对齐 buildResult:output.duration ?? extra.duration,如 "5")
      var extra = toolInput.extra && typeof toolInput.extra === "object" ? toolInput.extra : {}
      var duration = typeof output.duration === "string" ? output.duration : typeof extra.duration === "string" ? extra.duration : undefined
      // 状态(对齐 buildResult:有媒体即成功;失败按 metadata.studio.status 细分)
      var failureStatus = errored
        ? (["create_failed", "abnormal"].indexOf(studioToolProgress(errored)) !== -1 ? studioToolProgress(errored) : "failed")
        : undefined
      var status = media.length > 0
        ? "succeeded"
        : failureStatus ?? (running ? "running" : "failed")
      var error = media.length > 0
        ? undefined
        : (errored && typeof errored.state.error === "string" && errored.state.error) ||
          (status === "create_failed" ? "任务创建失败，请检查网络或稍后再试" : "生成失败")
      return {
        kind: "result",
        userText: (typeof toolInput.displayPrompt === "string" && toolInput.displayPrompt) || extractStudioUserDemand(input.userText),
        hideUserBubble: input.hideUserBubble,
        assistantText: input.assistantText,
        mentionImages: toolInput.extra && typeof toolInput.extra === "object" && !Array.isArray(toolInput.extra) &&
          toolInput.extra.mentionImages && typeof toolInput.extra.mentionImages === "object" && !Array.isArray(toolInput.extra.mentionImages)
          ? Object.keys(toolInput.extra.mentionImages).reduce(function (acc, key) {
              if (typeof toolInput.extra.mentionImages[key] === "string") acc[key] = toolInput.extra.mentionImages[key]
              return acc
            }, {})
          : undefined,
        inputImages: studioBuildInputImages(toolInput, capability),
        result: {
          status: status,
          capability: capability,
          aspectRatio: aspectRatio,
          media: media,
          duration: duration,
          error: error,
          createdAt: input.createdAt,
        },
      }
    }

    // 分轮(对齐 turns.ts buildStudioTurns:排序 → 过滤隐藏 guide 轮 → 推荐/编辑/生成三分支)
    function buildStudioTurns(messages, imageBlobMap) {
      var sorted = (messages || []).slice().sort(function (left, right) {
        var lt = ((left.info || {}).time || {}).created
        var rt = ((right.info || {}).time || {}).created
        if (lt !== rt) return lt - rt
        return String((left.info || {}).id || "").localeCompare(String((right.info || {}).id || ""))
      })
      // assistant 带 guide 元数据且 visible=false 的轮次整轮不展示
      var kept = sorted.filter(function (message) {
        if ((message.info || {}).role !== "user") return true
        var assistant = sorted.find(function (item) {
          var info = item.info || {}
          return info.role === "assistant" && info.parentID === (message.info || {}).id
        })
        if (!assistant) return true
        return !(assistant.parts || []).some(function (part) {
          var meta = studioPromptMetadata(part)
          return meta && meta.kind === "guide" && meta.visible === false
        })
      })
      var turns = []
      for (var i = 0; i < kept.length; i++) {
        var user = kept[i]
        if ((user.info || {}).role !== "user") continue
        var assistant
        for (var j = i + 1; j < kept.length; j++) {
          var info = kept[j].info || {}
          if (info.role === "assistant" && info.parentID === (user.info || {}).id) { assistant = kept[j]; break }
        }
        var userTextParts = (user.parts || []).filter(function (part) { return part.type === "text" })
        var userText = userTextParts.map(function (part) { return part.text || "" }).join("\n").trim()
        var hideUserBubble = userTextParts.length === 0 || userTextParts.some(function (part) {
          var source = part.metadata && part.metadata.studioPromptExpansionSource
          return !!(source && typeof source === "object" && typeof source.assistantMessageID === "string" && source.assistantMessageID.trim())
        })
        var assistantParts = assistant ? assistant.parts || [] : []
        var assistantText = assistantParts
          .filter(function (part) { return part.type === "text" && !studioIsPreviewPart(part) })
          .map(function (part) { return part.text || "" })
          .join("\n").trim()
        var tools = assistantParts.filter(function (part) { return part.type === "tool" })
        var createdAt = ((user.info || {}).time || {}).created
        var recommendation = studioPromptMetadata(assistantParts.find(function (part) { return studioPromptMetadata(part) }))
        if (recommendation) {
          turns.push({
            kind: "recommendation",
            recommendation: recommendation,
            userText: userText,
            hideUserBubble: hideUserBubble,
            assistantText: assistantText,
            previewText: studioExpansionPreviewText(assistantParts),
            // 推荐轮参考图来自用户消息的图片附件(对齐 turns.ts recommendation 分支)
            inputImages: (user.parts || [])
              .filter(function (part) { return part.type === "file" && typeof part.mime === "string" && part.mime.indexOf("image/") === 0 })
              .map(function (part) { return part.url }),
            createdAt: createdAt,
          })
          continue
        }
        var entry = studioEditorEntry(tools)
        if (entry) {
          turns.push({
            kind: "editor",
            capability: entry.capability,
            userText: userText,
            hideUserBubble: hideUserBubble,
            assistantText: assistantText,
            createdAt: createdAt,
          })
          continue
        }
        turns.push(studioBuildResultTurn({
          userText: userText,
          hideUserBubble: hideUserBubble,
          assistantText: assistantText,
          tools: tools,
          createdAt: createdAt,
        }, imageBlobMap))
      }
      return turns
    }

    // ── 渲染 ──

    // 用户气泡文本:@引用渲染为 chip,其余按纯文本(对齐 StudioUserBubbleText)
    function buildStudioUserBubbleText(text, mentionImages) {
      var container = document.createElement("span")
      var regex = /@[^@\u200B]*\u200B/g
      var last = 0
      var match
      while ((match = regex.exec(text)) !== null) {
        if (match.index > last) {
          container.appendChild(document.createTextNode(text.slice(last, match.index).replace(/\u200B/g, "")))
        }
        var name = match[0].slice(1, -1)
        var chip = document.createElement("span")
        chip.className = "studio-user-bubble-mention"
        var src = mentionImages && typeof mentionImages[name] === "string" ? mentionImages[name] : ""
        if (/^https?:\/\//i.test(src) || /^data:image\//i.test(src)) {
          var icon = document.createElement("img")
          icon.src = src
          icon.alt = name
          chip.appendChild(icon)
        }
        var nameSpan = document.createElement("span")
        nameSpan.className = "studio-user-bubble-mention-name"
        nameSpan.textContent = name
        chip.appendChild(nameSpan)
        container.appendChild(chip)
        last = match.index + match[0].length
      }
      if (last < text.length) {
        container.appendChild(document.createTextNode(text.slice(last).replace(/\u200B/g, "")))
      }
      return container
    }

    // 参考图行(对齐 .studio-user-input-images:http/data 直显,本地路径走 manifest blob)
    function appendStudioInputImages(turn, el, imageBlobMap, token) {
      if (turn.hideUserBubble || !turn.inputImages || turn.inputImages.length === 0) return
      var box = document.createElement("div")
      box.className = "studio-user-input-images"
      for (var i = 0; i < turn.inputImages.length; i++) {
        var url = turn.inputImages[i]
        var img = document.createElement("img")
        img.className = "studio-user-input-image"
        img.alt = ""
        img.loading = "lazy"
        if (/^https?:\/\//i.test(url) || /^data:image\//i.test(url)) {
          img.src = url
        } else {
          var basename = String(url).split(/[/\\]/).pop()
          var blobEntry = imageBlobMap[basename]
          if (!blobEntry) continue
          ;(function (imgEl, blobUrl, mime) {
            loadBlobImage(blobUrl, token, mime).then(function (resolvedUrl) { imgEl.src = resolvedUrl })
          })(img, blobEntry.url, blobEntry.mime)
        }
        box.appendChild(img)
      }
      if (box.children.length > 0) el.appendChild(box)
    }

    // 单轮渲染(对齐 studio-conversation.tsx StudioConversation 的 JSX 分支)
    function buildStudioTurnElement(turn, imageBlobMap, token) {
      var el = document.createElement("div")
      el.className = "studio-conversation-turn"

      appendStudioInputImages(turn, el, imageBlobMap, token)

      // 用户气泡(guide 轮隐藏;文案对齐 turn.userText || "Octo Studio")
      if (!turn.hideUserBubble && !(turn.recommendation && turn.recommendation.kind === "guide")) {
        var bubble = document.createElement("div")
        bubble.className = "studio-user-bubble"
        bubble.appendChild(buildStudioUserBubbleText(turn.userText || "Octo Studio", turn.mentionImages))
        el.appendChild(bubble)
      }

      if (turn.kind === "editor") {
        // 编辑区入口(对齐 .studio-assistant-editor-link;分享页静态展示)
        var link = document.createElement("span")
        link.className = "studio-assistant-editor-link"
        link.appendChild(document.createTextNode("点击前往编辑区"))
        var arrow = document.createElement("img")
        arrow.src = "./studio/stutdio_arrow_right.png"
        arrow.alt = ""
        arrow.className = "studio-editor-link-arrow"
        link.appendChild(arrow)
        el.appendChild(link)
        return el
      }

      // 助手文案:扩写 running/cancelling/completed 时由预览文本替代(对齐 result 分支)
      var suppressAssistantText = turn.recommendation && turn.recommendation.kind === "result" &&
        ["running", "cancelling", "completed"].indexOf(turn.recommendation.status) !== -1
      if (suppressAssistantText) {
        if (turn.recommendation.status === "completed" && turn.previewText) {
          var preview = document.createElement("div")
          preview.className = "studio-assistant-copy"
          preview.textContent = turn.previewText
          el.appendChild(preview)
        }
      } else {
        var copy = sanitizeStudioAssistantText(turn.assistantText)
        if (copy) {
          var copyEl = document.createElement("div")
          copyEl.className = "studio-assistant-copy"
          copyEl.textContent = copy
          el.appendChild(copyEl)
        }
      }

      // guide 轮:静态快捷入口(对齐 .studio-recommendation-shortcuts)
      if (turn.recommendation && turn.recommendation.kind === "guide") {
        var shortcuts = document.createElement("div")
        shortcuts.className = "studio-recommendation-shortcuts"
        for (var s = 0; s < STUDIO_RECOMMENDATION_SHORTCUT_LABELS.length; s++) {
          var shortcut = document.createElement("span")
          shortcut.className = "studio-recommendation-shortcut"
          var label = document.createElement("span")
          label.textContent = STUDIO_RECOMMENDATION_SHORTCUT_LABELS[s]
          shortcut.appendChild(label)
          shortcut.insertAdjacentHTML("beforeend",
            '<svg viewBox="0 0 6 11" width="14" height="14" aria-hidden="true"><path d="M0.5 0.5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1"/></svg>')
          shortcuts.appendChild(shortcut)
        }
        el.appendChild(shortcuts)
      }

      // 结果卡片(推荐/编辑轮不展示)
      if (turn.result) el.appendChild(buildStudioResultCard(turn.result, token, imageBlobMap))
      return el
    }

    // 图片网格方向(对齐 studio-result-card.tsx:媒体尺寸优先,回退画幅比例;横构图 4 张换行)
    function studioGridClass(media, aspectRatio) {
      var first = media[0]
      var is1x1, isPortrait, isLandscape
      if (first && first.width && first.height) {
        is1x1 = first.width === first.height
        isPortrait = first.height > first.width
        isLandscape = first.width > first.height
      } else {
        var ratio = aspectRatio || "1:1"
        is1x1 = ratio === "1:1"
        isPortrait = STUDIO_PORTRAIT_RATIOS.indexOf(ratio) !== -1
        isLandscape = STUDIO_LANDSCAPE_RATIOS.indexOf(ratio) !== -1
      }
      var count = media.length
      if (isPortrait) return count === 1 ? "single-portrait" : "multi-portrait"
      if (isLandscape) return count === 1 ? "single-landscape" : (count === 4 ? "multi-landscape multi-landscape-4" : "multi-landscape")
      return count === 1 ? "single-1x1" : "multi-1x1"
    }

    // 结果卡片(对齐 studio-result-card.tsx:能力图标 + 标签 + 状态徽标 + 创建时间 + 网格/错误)
    function buildStudioResultCard(result, token, imageBlobMap) {
      var card = document.createElement("div")
      card.className = "studio-result-card" +
        (result.status === "succeeded" ? " complete"
          : ["failed", "create_failed"].indexOf(result.status) !== -1 ? " failed"
          : result.status === "abnormal" ? " abnormal" : "")
      var statusLabel =
        result.status === "succeeded" ? "生成完成" :
        result.status === "create_failed" ? "创建失败" :
        result.status === "abnormal" ? "状态异常" :
        result.status === "running" ? "生成中" :
        result.status === "queued" ? "排队中" :
        result.status === "creating" ? "创建中" : "生成失败"
      var header = document.createElement("div")
      header.className = "studio-result-progress-header"
      var left = document.createElement("div")
      left.className = "studio-result-progress-left"
      var title = document.createElement("div")
      title.className = "studio-result-progress-title"
      var icon = document.createElement("span")
      icon.className = studioCapabilityIconClass(result.capability)
      title.appendChild(icon)
      title.appendChild(document.createTextNode(studioCapabilityLabel(result.capability)))
      var status = document.createElement("span")
      status.className = "studio-result-progress-status"
      status.textContent = statusLabel
      left.appendChild(title)
      left.appendChild(status)
      header.appendChild(left)
      card.appendChild(header)
      if (result.createdAt) {
        var meta = document.createElement("div")
        meta.className = "studio-result-meta"
        meta.textContent = "创建时间：" + new Date(result.createdAt).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })
        card.appendChild(meta)
      }
      var preview = document.createElement("div")
      preview.className = "studio-result-progress-preview"
      if (result.status === "succeeded" && result.media.length > 0) {
        var grid = document.createElement("div")
        grid.className = "studio-result-grid " + studioGridClass(result.media, result.aspectRatio)
        for (var i = 0; i < result.media.length; i++) {
          grid.appendChild(buildStudioGridThumb(result.media[i], result, token, imageBlobMap))
        }
        preview.appendChild(grid)
      } else {
        // 失败/异常:错误文案(对齐 .studio-result-error-box)
        var errorBox = document.createElement("div")
        errorBox.className = "studio-result-error-box"
        var errorIcon = document.createElement("img")
        errorIcon.src = "./studio/studio-result-error.svg"
        errorIcon.alt = ""
        errorIcon.className = "studio-result-error-icon"
        errorBox.appendChild(errorIcon)
        errorBox.appendChild(makeSpan("studio-result-error", result.error || "生成失败"))
        preview.appendChild(errorBox)
      }
      card.appendChild(preview)
      return card
    }

    // 视频时长格式化(对齐 studio-media.ts formatStudioThumbnailDuration:MM:SS)
    function studioFormatDuration(value) {
      var duration = typeof value === "string" ? Number(value) : value
      if (duration === undefined || !Number.isFinite(duration) || duration < 0) return ""
      var seconds = Math.floor(duration)
      return String(Math.floor(seconds / 60)).padStart(2, "0") + ":" + String(seconds % 60).padStart(2, "0")
    }

    // 缩略图来源(对齐 studio-media.ts thumbnailMediaSrc:ready 且为 thumbnails/ 相对路径才用,
    // 经 manifest files blob 解析;导出后的 thumbnailUrl 形如 .octo/{sessionId}/thumbnails/xxx.webp)
    function studioThumbnailEntry(item, imageBlobMap) {
      if (!item.thumbnailUrl || item.thumbnailStatus !== "ready") return undefined
      if (/^(https?:|data:)/i.test(item.thumbnailUrl)) return { url: item.thumbnailUrl, mime: undefined, isBlob: false }
      var basename = item.thumbnailUrl.split(/[/\\]/).pop()
      return imageBlobMap && imageBlobMap[basename]
        ? { url: imageBlobMap[basename].url, mime: imageBlobMap[basename].mime, isBlob: true }
        : undefined
    }

    // 网格内单个媒体(对齐 StudioMediaThumbnail:缩略图优先、失败回退原图/占位;视频带 MM:SS 时长徽标)
    function buildStudioGridThumb(item, result, token, imageBlobMap) {
      var thumb = document.createElement("div")
      thumb.className = "studio-result-thumb"
      var original = item.originalUrl || item.url
      var originalHttp = /^https?:\/\//i.test(original) ? original : ""
      var thumbnail = studioThumbnailEntry(item, imageBlobMap)

      var applySource = function (source, fallback) {
        // source 形如 { url, mime?, isBlob } 或字符串;失败时回退 fallback(如原图),再失败显示占位
        var img = document.createElement("img")
        img.className = "studio-result-thumb-media"
        img.alt = ""
        img.loading = "lazy"
        img.decoding = "async"
        img.addEventListener("error", function () {
          if (fallback) {
            if (img.src !== fallback) { img.src = fallback; return }
            img.remove()
          }
          thumb.appendChild(studioMediaPlaceholder(item.kind))
        })
        if (typeof source === "string") {
          img.src = source
        } else {
          ;(function (imgEl, blobUrl, mime) {
            loadBlobImage(blobUrl, token, mime).then(function (resolvedUrl) { imgEl.src = resolvedUrl })
          })(img, source.url, source.mime)
        }
        return img
      }

      if (item.kind === "video") {
        // 对齐 .studio-result-thumb-video:缩略图优先,无缩略图回退 muted 预加载视频
        var wrapper = document.createElement("span")
        wrapper.className = "studio-result-thumb-video"
        if (thumbnail) {
          wrapper.appendChild(applySource(thumbnail, originalHttp))
        } else if (isRenderableVideoUrl(item.url)) {
          var video = document.createElement("video")
          video.className = "studio-result-thumb-media"
          video.src = item.url
          video.muted = true
          video.setAttribute("playsinline", "")
          video.setAttribute("preload", "metadata")
          video.addEventListener("error", function () {
            video.remove()
            wrapper.appendChild(studioMediaPlaceholder("video"))
          })
          wrapper.appendChild(video)
        } else {
          wrapper.appendChild(studioMediaPlaceholder("video"))
        }
        var badgeText = studioFormatDuration(result.duration)
        if (badgeText) {
          var badge = document.createElement("span")
          badge.className = "studio-file-manager-media-video-badge studio-result-video-duration-badge"
          badge.appendChild(makeSpan("studio-file-manager-media-video-badge-text", badgeText))
          wrapper.appendChild(badge)
        }
        thumb.appendChild(wrapper)
        // 分享页无画布:点击缩略图在新标签打开原始视频(远程地址可用时)
        if (originalHttp) {
          thumb.style.cursor = "pointer"
          thumb.title = "打开视频"
          thumb.addEventListener("click", function () {
            window.open(originalHttp, "_blank", "noopener")
          })
        }
        return thumb
      }

      // 图片:缩略图 ready 用缩略图,否则原图(对齐 thumbnailMediaSrc image 分支)
      if (thumbnail) {
        thumb.appendChild(applySource(thumbnail, originalHttp))
      } else if (item.isBlob) {
        thumb.appendChild(applySource({ url: item.url, mime: "image/png" }, originalHttp))
      } else if (isRenderableImageUrl(item.url)) {
        thumb.appendChild(applySource(item.url, ""))
      } else {
        thumb.appendChild(studioMediaPlaceholder("image"))
      }
      return thumb
    }

    // 媒体占位(对齐 .studio-media-thumbnail-placeholder 及 image/video 图标)
    function studioMediaPlaceholder(kind) {
      var placeholder = document.createElement("span")
      placeholder.className = "studio-media-thumbnail-placeholder studio-result-thumb-media"
      placeholder.setAttribute("aria-label", kind === "video" ? "视频缩略图" : "图片缩略图")
      placeholder.appendChild(makeSpan(kind === "video" ? "studio-media-thumbnail-video-icon" : "studio-media-thumbnail-image-icon", ""))
      return placeholder
    }

    // studio 会话主渲染(对齐 studio 页面 StudioConversation)
    function renderStudioConversation(manifest, session, filePath, token, list) {
      document.body.dataset.module = "studio"
      list.innerHTML = ""
      var conversation = document.createElement("div")
      conversation.className = "studio-conversation"
      var imageBlobMap = filePath ? buildImageBlobMap(manifest, filePath) : {}
      var turns = buildStudioTurns(session.messages || [], imageBlobMap)
      for (var i = 0; i < turns.length; i++) {
        conversation.appendChild(buildStudioTurnElement(turns[i], imageBlobMap, token))
      }
      if (conversation.children.length === 0) {
        showEmptyState()
        return
      }
      list.appendChild(conversation)
    }

  </script>
</body>
</html>
