      return card
    }
    function appendInsightTaskFooter(card, entry) {
      if (entry.status === "failed") return
      const foot = document.createElement("div")
      foot.className = "insight-task-foot"
      foot.appendChild(makeSpan("file-name", "提交时间: " + insightFullTime(entry.submittedAt)))
      const id = document.createElement("span")
      id.className = "insight-task-id"
      id.textContent = "ID: " + entry.taskId
      id.title = entry.taskId
      foot.appendChild(id)
      card.appendChild(foot)
    }
    // 任务结果产物卡(对齐 index.tsx buildOutputCardsFromTask:资源链接 → 入口卡;无链接时 resultText → Markdown 卡)
    function insightTaskResultCards(entry) {
      if (entry.status !== "completed") return []
      const baseTitle = insightToolDisplayName(entry.toolName) + " 结果"
      if (entry.resourceLinks.length > 0) {
        return entry.resourceLinks.map((link, idx) => ({
          title: link.name || baseTitle + " " + (idx + 1),
          type: insightResolveOutputType(link.name ?? "", link.mimeType),
          mimeType: link.mimeType,
          fileName: link.name,
          createdAt: entry.lastUpdatedAt,
        }))
      }
      if (entry.resultText && entry.resultText.length > 0) {
        return [{ title: baseTitle, type: "markdown", content: entry.resultText, createdAt: entry.lastUpdatedAt }]
      }
      return []
    }
    // turn 产物卡(对齐 insight-turn outputCards memo:任务卡在场时抑制;A 资源链接(已完结任务取跨轮稳定产物)→ C write(md/html)→ B fence/mindmap 嗅探)
    function insightOutputCards(turn, taskCardsForTurn, taskCardsAll) {
      if (taskCardsForTurn.length > 0) return []
      const parts = turn.assistants.flatMap((m) => m.parts || [])
      const firstInfo = (turn.assistants[0] || {}).info || {}
      const msgDate = typeof (firstInfo.time || {}).created === "number" ? firstInfo.time.created : Date.now()
      let completedTask
      for (const part of parts) {
        const info = insightReadTaskInfo(part)
        if (info && info.status === "completed") {
          completedTask = info
          break
        }
      }
      const canonical = completedTask ? taskCardsAll.get(completedTask.taskId) : undefined
      const links = canonical && canonical.resourceLinks.length > 0 ? canonical.resourceLinks : insightFindResourceLinks(parts)
      const writeCards = insightFindWriteCards(parts)
        .filter((w) => w.type === "markdown" || w.type === "html")
        .map((w) => {
          const name = insightFilenameOf(w.filePath)
          return { title: name, type: w.type, fileName: name, createdAt: msgDate }
        })
      if (links.length > 0 || writeCards.length > 0) {
        const linkCards = links.map((link, idx) => ({
          title: link.name || "分析结果 " + (idx + 1),
          type: insightResolveOutputType(link.name ?? "", link.mimeType),
          mimeType: link.mimeType,
          fileName: link.name,
          createdAt: msgDate,
        }))
        return [...linkCards, ...writeCards]
      }
      const textParts = parts.filter((p) => p.type === "text" && typeof p.text === "string")
      const cards = []
      const blocks = insightScanFencedHtml(textParts)
      blocks.forEach((block, idx) => {
        const heading = block.html.match(/<title[^>]*>([^<]+)<\/title>/i)?.[1]?.trim()
        cards.push({
          title: heading || (blocks.length > 1 ? "可视化页面 " + (idx + 1) : "可视化页面"),
          type: "html",
          content: block.html,
          createdAt: msgDate,
        })
      })
      const lastText = (textParts.length > 0 ? textParts[textParts.length - 1].text : "").trim()
      if (lastText.length >= 10 && insightIsMindmapJSON(lastText)) {
        cards.push({
          title: lastText.match(/^#{1,3}\s+(.+)/m)?.[1]?.trim() ?? "思维导图",
          type: "json",
          content: lastText,
          createdAt: msgDate,
        })
      }
      return cards
    }

    // ── insight turn 渲染 ──
    function renderInsightTurn(turn, taskCardsAll, taskCardsByAnchor, imageBlobMap, token) {
      const turnEl = document.createElement("div")
      const userParts = (turn.user && turn.user.parts) || []
      const isCompactionTurn = userParts.some((p) => p.type === "compaction")

      if (isCompactionTurn) {
        // 压缩 turn(对齐 InsightCompactionTurn:手动 /compact 输入回显气泡 + 状态条)
        turnEl.className = "insight-turn insight-turn--compaction"
        const text = (userParts.find((p) => p.type === "text" && typeof p.text === "string" && p.text.trim()) || {}).text?.trim() || "/compact"
        const inner = document.createElement("div")
        inner.style.display = "flex"
        inner.style.justifyContent = "flex-end"
        inner.style.margin = "0 12px"
        const bubble = document.createElement("div")
        bubble.className = "bubble-user"
        bubble.textContent = text
        inner.appendChild(bubble)
        turnEl.appendChild(inner)
        const compacted = turn.assistants.some((m) => (m.info || {}).summary === true && !!(m.info || {}).finish && !(m.info || {}).error)
        const aborted = turn.assistants.some((m) => ((m.info || {}).error || {}).name === "MessageAbortedError")
        const failed = turn.assistants.some((m) => {
          const err = (m.info || {}).error
          return !!err && err.name !== "MessageAbortedError"
        })
        if (compacted) {
          turnEl.appendChild(buildDivider("会话已压缩"))
        } else if (aborted) {
          const pill = document.createElement("div")
          pill.className = "insight-compaction-status"
          pill.style.marginTop = "12px"
          pill.textContent = "上下文压缩已停止"
          turnEl.appendChild(pill)
        } else if (failed) {
          const pill = document.createElement("div")
          pill.className = "insight-compaction-status insight-compaction-status-error"
          pill.style.marginTop = "12px"
          pill.textContent = "上下文压缩失败"
          turnEl.appendChild(pill)
        } else {
          const pill = document.createElement("div")
          pill.className = "insight-compaction-status"
          pill.style.marginTop = "12px"
          const dot = document.createElement("span")
          dot.className = "insight-compaction-dot"
          pill.appendChild(dot)
          pill.appendChild(document.createTextNode("正在压缩上下文…"))
          turnEl.appendChild(pill)
        }
        return turnEl
      }

      turnEl.className = "insight-turn"
      // 1. 附件(对齐 insight 层:FilePart 图片 → 48px 缩略图;[附件] 清单 → 文件卡片)
      const fileParts = userParts.filter((p) => p.type === "file" && p.filename)
      const seenUrls = new Set()
      const attBox = document.createElement("div")
      attBox.className = "insight-attachments"
      for (const part of fileParts) {
        if (part.mime && part.mime.startsWith("image/")) {
          const directUrl = part.url && /^(data:|https?:)/.test(part.url) ? part.url : null
          if (directUrl) {
            if (seenUrls.has(directUrl)) continue
            seenUrls.add(directUrl)
          }
          const blobEntry = !directUrl ? imageBlobMap[part.filename] : undefined
          if (directUrl || blobEntry) {
            const thumb = document.createElement("div")
            thumb.className = "insight-image-thumb"
            thumb.title = part.filename || ""
            const img = document.createElement("img")
            img.alt = part.filename || ""
            if (directUrl) img.src = directUrl
            else loadBlobImage(blobEntry.url, token, blobEntry.mime).then((u) => { img.src = u })
            thumb.appendChild(img)
            attBox.appendChild(thumb)
          } else {
            attBox.appendChild(buildInsightAttachmentCard(part.filename, kindFromMime(part.mime || mimeFromFilename(part.filename))))
          }
        } else if (part.url && /^data:/.test(part.url)) {
          // chat 时代的内联附件:上游渲染为附件 chip,此处与其样式对齐(文件卡片)
          attBox.appendChild(buildInsightAttachmentCard(part.filename, kindFromMime(part.mime || mimeFromFilename(part.filename))))
        }
      }
      const attachBlock = userParts.find(
        (p) => p.type === "text" && p.synthetic === true && typeof p.text === "string" && p.text.startsWith("[附件]"),
      )
      if (attachBlock) {
        for (const f of parseUploadedFilesBlock(attachBlock.text)) {
          attBox.appendChild(buildInsightAttachmentCard(f.filename, kindFromMime(mimeFromFilename(f.filename))))
        }
      }
      if (attBox.children.length > 0) turnEl.appendChild(attBox)

      // 2. 用户气泡 + 气泡下方 meta(agent · 模型 · 时间,hover 显示)
      if (turn.user) {
        const row = document.createElement("div")
        row.className = "insight-user-row"
        const userTextContent = insightUserText(userParts)
        if (userTextContent) {
          const bubble = document.createElement("div")
          bubble.className = "bubble-user"
          bubble.setAttribute("data-expanded", "false")
          const bubbleContent = document.createElement("div")
          bubbleContent.className = "bubble-user-content"
          bubbleContent.textContent = userTextContent
          bubble.appendChild(bubbleContent)
          const mask = document.createElement("div")
          mask.className = "bubble-user-mask"
          bubble.appendChild(mask)
          bubble.appendChild(buildBubbleExpandButton())
          row.appendChild(bubble)
        }
        const info = turn.user.info || {}
        const metaItems = [insightAgentLabel(info.agent), (info.model || {}).modelID].filter(Boolean)
        const meta = document.createElement("div")
        meta.className = "insight-user-meta"
        if (metaItems.length > 0 || typeof (info.time || {}).created === "number") {
          if (metaItems.length > 0) meta.appendChild(makeSpan("", metaItems.join(" · ")))
          if (typeof (info.time || {}).created === "number") {
            if (metaItems.length > 0) meta.appendChild(makeSpan("", "·"))
            meta.appendChild(makeSpan("", insightShortTime(info.time.created)))
          }
        }
        row.appendChild(meta)
        turnEl.appendChild(row)
      }

      // 3. assistant 内容(对齐 AssistantParts:全部可见消息的 part 按序扁平渲染,连续 read/glob/grep/list 合并为 ContextToolGroup)
      const visibleMsgs = turn.assistants.filter((m) => !(m.info || {}).summary || (m.info || {}).error)
      const renderableParts = visibleMsgs.flatMap((m) =>
        (m.parts || [])
          .filter((p) => {
            if (p.type === "tool") {
              if (p.tool === "todowrite") return false
              if (p.tool === "question") return !["pending", "running"].includes((p.state || {}).status)
              return true
            }
            if (p.type === "text") return !!(p.text && p.text.trim())
            if (p.type === "reasoning") return !!(p.text && p.text.trim())
            return false
          })
          .map((p) => ({ part: p, msg: m })),
      )
      if (renderableParts.length > 0) {
        const msgs = document.createElement("div")
        msgs.className = "insight-msgs"
        // 最后一个非空 text part(跨消息,对齐 showAssistantCopyPartID)挂 meta
        let lastTextEntry = null
        for (const entry of renderableParts) {
          if (entry.part.type === "text") lastTextEntry = entry
        }
        // turnDurationMs(对齐上游:用户消息 created → 最后一条 assistant completed)
        const userCreated = ((turn.user || {}).info || {}).time?.created
        const maxCompleted = turn.assistants.reduce((max, m) => {
          const c = (m.info || {}).time?.completed
          return typeof c === "number" && c > max ? c : max
        }, -Infinity)
        const turnDurationMs = typeof userCreated === "number" && maxCompleted !== -Infinity && maxCompleted >= userCreated ? maxCompleted - userCreated : -1
        const interrupted = turn.assistants.some((m) => ((m.info || {}).error || {}).name === "MessageAbortedError")

        let i = 0
        while (i < renderableParts.length) {
          const { part, msg } = renderableParts[i]
          if (part.type === "tool" && ["read", "glob", "grep", "list"].includes(part.tool)) {
            // 连续 context 工具合并(对齐 groupParts)
            let j = i
            while (j < renderableParts.length && renderableParts[j].part.type === "tool" && ["read", "glob", "grep", "list"].includes(renderableParts[j].part.tool)) j++
            msgs.appendChild(buildInsightCtxGroup(renderableParts.slice(i, j).map((e) => e.part)))
            i = j
            continue
          }
          if (part.type === "reasoning") {
            // 无正文兄弟 part 的消息自动展开(对齐上游 reasoning-part;用时按该消息自身 completed-created)
            const info = msg.info || {}
            const hasTextSibling = (msg.parts || []).some((p) => p.type === "text" && p.text && p.text.trim())
            const created = (info.time || {}).created
            const completed = (info.time || {}).completed
            const durationMs = typeof created === "number" && typeof completed === "number" ? completed - created : -1
            msgs.appendChild(buildInsightReasoning(part.text, durationMs, !hasTextSibling))
            i++
            continue
          }
          if (part.type === "text") {
            const textEl = document.createElement("div")
            textEl.className = "insight-text"
            const markdown = document.createElement("div")
            markdown.className = "text-assistant"
            markdown.setAttribute("data-component", "markdown")
            markdown.innerHTML = renderMarkdown(part.text)
            textEl.appendChild(markdown)
            if (entryRefEquals(renderableParts[i], lastTextEntry)) {
              const metaRow = document.createElement("div")
              metaRow.className = "insight-text-meta-row"
              const metaItems = [
                insightAgentLabel((msg.info || {}).agent),
                (msg.info || {}).modelID,
                insightDurationText(turnDurationMs),
                interrupted ? "已中断" : "",
              ].filter(Boolean)
              if (metaItems.length > 0) {
                metaRow.appendChild(makeSpan("insight-text-meta", metaItems.join(" · ")))
              }
              textEl.appendChild(metaRow)
            }
            msgs.appendChild(textEl)
            i++
            continue
          }
          if (part.type === "tool") {
            // question 完成态:问题行 + 问答明细;其余工具:BasicTool 触发行
            if (part.tool === "question") {
              const wrap = document.createElement("div")
              wrap.appendChild(buildInsightToolRow(insightQuestionRowInfo(part)))
              const answers = insightQuestionAnswers(part)
              if (answers.length > 0) {
                const qa = document.createElement("div")
                qa.className = "insight-question-answers"
                const questions = ((part.state || {}).input || {}).questions ?? []
                for (let q = 0; q < questions.length; q++) {
                  const item = document.createElement("div")
                  item.className = "insight-question-item"
                  item.appendChild(makeSpan("insight-question-text", String(questions[q].question ?? "")))
                  item.appendChild(makeSpan("insight-answer-text", (answers[q] || []).join(", ") || "未回答"))
                  qa.appendChild(item)
                }
                wrap.appendChild(qa)
              }
              msgs.appendChild(wrap)
            } else {
              msgs.appendChild(buildInsightToolRow(insightToolRowInfo(part)))
            }
            i++
            continue
          }
          i++
        }
        // 中断 divider(对齐上游 session-turn divider)
        if (interrupted) {
          const divider = buildDivider("已中断")
          divider.style.marginTop = "0"
          msgs.appendChild(divider)
        }
        // 错误卡(对齐上游 error Card + insight 黑字覆盖)
        const failedMsg = turn.assistants.find((m) => {
          const err = (m.info || {}).error
          return err && err.name !== "MessageAbortedError"
        })
        if (failedMsg) {
          const err = failedMsg.info.error
          const data = err.data || {}
          const message = typeof data.message === "string" ? data.message : typeof err.message === "string" ? err.message : ""
          const errorCard = document.createElement("div")
          errorCard.className = "insight-error-card"
          errorCard.textContent = message
          msgs.appendChild(errorCard)
        }
        turnEl.appendChild(msgs)
      }

      // 4. 知识库引用 + 产物入口卡 + 长任务卡(对齐 InsightTurn 尾部三个区)
      const turnParts = turn.assistants.flatMap((m) => m.parts || [])
      const kbSources = insightReadKnowledgeSources(turnParts)
      if (kbSources.length > 0) turnEl.appendChild(buildInsightKbRefs(kbSources))
      const taskCardsForTurn = turn.user ? (taskCardsByAnchor.get(turn.user.info.id) || []) : []
      for (const card of insightOutputCards(turn, taskCardsForTurn, taskCardsAll)) {
        turnEl.appendChild(buildInsightEntryCard(card))
      }
      for (const entry of taskCardsForTurn) {
        turnEl.appendChild(buildInsightTaskCard(entry))
        // 分享页无结果查看器:完结任务的结果产物按入口卡静态列出(对齐「查看结果」的内容)
        for (const card of insightTaskResultCards(entry)) {
          turnEl.appendChild(buildInsightEntryCard(card))
        }
      }
      return turnEl
    }
    function entryRefEquals(a, b) {
      return a === b || (!!a && !!b && a.part === b.part && a.msg === b.msg)
    }
    function insightQuestionRowInfo(part) {
      const questions = ((part.state || {}).input || {}).questions ?? []
      const answers = insightQuestionAnswers(part)
      const count = Array.isArray(questions) ? questions.length : 0
      const subtitle = count === 0 ? undefined : answers.length > 0 ? count + " 已回答" : count + " 个问题"
      return { title: "问题", subtitle, args: [] }
    }
    function insightQuestionAnswers(part) {
      const answers = ((part.state || {}).metadata || {}).answers
      return Array.isArray(answers) ? answers.map((a) => (Array.isArray(a) ? a.map(String) : [])) : []
    }
    function buildInsightAttachmentCard(filename, kind) {
      const card = document.createElement("div")
      card.className = "insight-attachment-card"
      card.title = filename
      const icon = document.createElement("img")
      icon.src = getFileIconUrl(kind, filename)
      icon.alt = ""
      card.appendChild(icon)
      card.appendChild(makeSpan("insight-attachment-name", filename))
      return card
    }

    function renderInsightConversation(manifest, session, filePath, token, list) {
      document.body.dataset.module = "insight"
      list.classList.add("insight-scope")
      const messages = (session.messages || []).slice().sort((a, b) => {
        const at = ((a.info || {}).time || {}).created ?? 0
        const bt = ((b.info || {}).time || {}).created ?? 0
        if (at !== bt) return at - bt
        return a.info.id < b.info.id ? -1 : a.info.id > b.info.id ? 1 : 0
      })
      const taskCardsAll = insightAggregateTaskCards(messages)
      const taskCardsByAnchor = new Map()
      for (const card of taskCardsAll.values()) {
        const arr = taskCardsByAnchor.get(card.anchorUserMessageID) ?? []
        arr.push(card)
        taskCardsByAnchor.set(card.anchorUserMessageID, arr)
      }
      const imageBlobMap = filePath ? buildImageBlobMap(manifest, filePath) : {}
      // 按 user 分组(对齐 insight userMessages 可见性规则:自动压缩(无 text part)不渲染)
      const turns = []
      let current = null
      for (const msg of messages) {
        const role = msg.info && msg.info.role
        if (role === "user") {
          const parts = msg.parts || []
          if (parts.some((p) => p.type === "compaction") && !parts.some((p) => p.type === "text")) continue
          if (current) turns.push(current)
          current = { user: msg, assistants: [] }
        } else if (role === "assistant") {
          if (!current) current = { user: null, assistants: [] }
          current.assistants.push(msg)
        }
      }
      if (current) turns.push(current)
      for (const turn of turns) {
        list.appendChild(renderInsightTurn(turn, taskCardsAll, taskCardsByAnchor, imageBlobMap, token))
      }
      if (list.children.length === 0) {
        showEmptyState()
        return
      }
      markExpandableCodeBlocks(list)
      markExpandableUserBubbles(list)
    }

    // 思考过程折叠块(对齐 design insight-turn.tsx ReasoningCollapsed:已深度思考(用时X)+ 展开内容)
    function formatDuration(ms) {
      const secs = Math.round(ms / 1000)
      if (secs <= 0) return ""
      if (secs < 60) return secs + "s"
      const m = Math.floor(secs / 60)
      const s = secs % 60
      return s > 0 ? m + "m " + s + "s" : m + "m"
    }
    function renderReasoningBlock(texts, durationMs) {
      const wrap = document.createElement("div")
      wrap.className = "turn-reasoning"
      const toggle = document.createElement("button")
      toggle.type = "button"
      toggle.className = "reasoning-toggle"
      toggle.setAttribute("data-open", "false")
      toggle.setAttribute("aria-expanded", "false")
      const duration = formatDuration(durationMs)
      toggle.innerHTML =
        "<span>已深度思考</span>" +
        (duration ? "<span>（用时" + duration + "）</span>" : "") +
        "<span style=\"display:inline-flex;align-items:center;flex-shrink:0;\">" + CODE_CHEVRON_SVG + "</span>"
      const body = document.createElement("div")
      body.className = "reasoning-body"
      body.style.display = "none"
      for (let idx = 0; idx < texts.length; idx++) {
        if (idx > 0) {
          const divider = document.createElement("div")
          divider.className = "reasoning-divider"
          body.appendChild(divider)
        }
        const p = document.createElement("p")
        p.textContent = texts[idx]
        body.appendChild(p)
      }
      toggle.addEventListener("click", () => {
        const open = toggle.getAttribute("data-open") === "true"
        toggle.setAttribute("data-open", String(!open))
        toggle.setAttribute("aria-expanded", String(!open))
        body.style.display = open ? "none" : ""
      })
      wrap.appendChild(toggle)
      wrap.appendChild(body)
      return wrap
    }

    // 代码块超长标记 + 复制/展开(事件委托,一次绑定)
    function markExpandableCodeBlocks(scope) {
      for (const box of scope.querySelectorAll('[data-component="markdown-code"]')) {
        const pre = box.querySelector("pre")
        if (pre && pre.scrollHeight > 320 + 4) box.setAttribute("data-expandable", "true")
      }
    }
    function bindMarkdownCodeActions(root) {
      if (root.dataset.codeActionsBound === "true") return
      root.dataset.codeActionsBound = "true"
      root.addEventListener("click", (e) => {
        const btn = e.target instanceof Element ? e.target.closest(".markdown-code-btn") : null
        if (!btn) return
        const box = btn.closest('[data-component="markdown-code"]')
        if (!box) return
        if (btn.dataset.action === "copy") {
          const code = box.querySelector("pre")
          const text = code ? code.textContent : ""
          const markCopied = () => {
            btn.dataset.copied = "true"
            setTimeout(() => { btn.dataset.copied = "false" }, 2000)
          }
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(markCopied).catch(() => copyViaTextarea(text, markCopied))
          } else {
            copyViaTextarea(text, markCopied)
          }
        } else if (btn.dataset.action === "expand") {
          const expanded = box.getAttribute("data-expanded") === "true"
          if (expanded) box.removeAttribute("data-expanded")
          else box.setAttribute("data-expanded", "true")
        }
      })
    }
    function copyViaTextarea(text, done) {
      const textarea = document.createElement("textarea")
      textarea.value = text
      textarea.setAttribute("readonly", "")
      textarea.style.position = "fixed"
      textarea.style.opacity = "0"
      document.body.appendChild(textarea)
      textarea.select()
      const ok = document.execCommand("copy")
      textarea.remove()
      if (ok) done()
    }

    // artifact 图标(对齐 design cardTypeIconSrc:所有类型统一返回 AI 文档图标)
    // 走 share/icons/ 与其他图标同源,避免根路径 /AI_doc_plaintext.svg 在独立部署的 share 域名/路径下 404
    function artifactIconSrc(_type) {
      return FILE_ICON_BASE + "AI_doc_plaintext.svg"
    }

    // 完整文档(<!DOCTYPE html> 或 <html> 开头)缺 </html> 视为截断(对齐 design artifact-parser.ts isTruncatedHtml)
    // 分享页不出 ResultViewer,只对齐卡片的警示边框样式
    function isTruncatedHtml(content) {
      const isFullDoc = /<!DOCTYPE\s+html/i.test(content) || /<html[\s>]/i.test(content)
      return isFullDoc && !content.toLowerCase().includes("</html>")
    }

    // 时间格式化(对齐 design insight-turn.tsx formatTime)
    function formatTime(d) {
      return d.toLocaleString("zh-CN", {
        month: "numeric",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit",
      })
    }

    // ─────────────────────────────────────────────────────────
    // studio 会话渲染(对齐 studio 页面 turns.ts buildStudioTurns /
    // studio-conversation.tsx / studio-result-card.tsx / studio-01~03.css)
    // studio 与 design 会话区差异:用户气泡右对齐不可折叠、助手纯文本无 Markdown、
    // 引导/编辑入口静态展示、结果卡片带能力图标与状态徽标(完成绿/失败灰)、
    // 图片网格按画幅比例定向;无工具调用/推理/子任务卡
    // ─────────────────────────────────────────────────────────

    var STUDIO_CAPABILITY_ORDER = [
      "image.generate", "video.generate", "image.upscale", "image.cutout",
      "image.inpaint", "image.outpaint", "image.fusion",
    ]
    var STUDIO_CAPABILITY_LABELS = {
      "image.generate": "图片生成",
      "video.generate": "视频生成",
      "image.upscale": "变清晰",
      "image.cutout": "抠图",
      "image.inpaint": "智能重绘",
      "image.outpaint": "扩图",
      "image.fusion": "场景融合",
    }
    var STUDIO_PORTRAIT_RATIOS = ["2:3", "3:4", "9:16"]
    var STUDIO_LANDSCAPE_RATIOS = ["16:9", "3:2", "4:3", "21:9"]
    var STUDIO_EDITOR_CAPABILITIES = ["image.upscale", "image.cutout", "image.inpaint", "image.outpaint"]
    // 引导快捷入口文案(对齐 studio-conversation.tsx RECOMMENDATION_SHORTCUTS 的 label)
    var STUDIO_RECOMMENDATION_SHORTCUT_LABELS = ["未来科技，英雄战斗，电影质感", "中式建筑，水彩", "人物，油画质感的少女"]

    function studioCapabilityLabel(capability) {
      return STUDIO_CAPABILITY_LABELS[capability] || "图片生成"
    }
    // 能力图标 class(对齐 studio-result-card.tsx capabilityIconClass:首项用基础类)
    function studioCapabilityIconClass(capability) {
      var index = STUDIO_CAPABILITY_ORDER.indexOf(capability)
      return index <= 0 ? "studio-result-progress-icon" : "studio-result-progress-icon studio-result-progress-icon-" + (index + 1)
    }
    function studioNormalizeCapability(value) {
      return STUDIO_CAPABILITY_ORDER.indexOf(value) !== -1 ? value : "image.generate"
    }
    function studioNormalizeAspectRatio(value) {
      return ["1:1", "2:3", "3:4", "9:16", "3:2", "4:3", "16:9", "21:9"].indexOf(value) !== -1 ? value : "3:4"
    }

    // ── 提示词推荐/扩写元数据(对齐 studio-prompt-state.ts promptMetadata / previewMetadata) ──
    function studioPromptMetadata(part) {
      if (!part || part.type !== "text" || !part.metadata) return undefined
      var raw = part.metadata.studioPromptRecommendation ?? part.metadata.studioPromptExpansion
      if (!raw || typeof raw !== "object" || raw.version !== 1) return undefined
      if (raw.kind === "guide" && ["armed", "consumed", "dismissed"].indexOf(raw.status) !== -1) {
        return { kind: "guide", visible: raw.visible !== false }
      }
      if (raw.kind === "result" && typeof raw.guidePartID === "string" &&
          ["running", "cancelling", "completed", "failed", "cancelled"].indexOf(raw.status) !== -1) {
        return {
          kind: "result",
          status: raw.status,
          // 扩写标签(审阅卡 chips 来源,对齐 promptMetadata result.tags)
          tags: Array.isArray(raw.tags) ? raw.tags.filter(function (t) { return typeof t === "string" && t.length > 0 }) : undefined,
        }
      }
      return undefined
    }
    function studioIsPreviewPart(part) {
      return !!part && (part.type === "text" || part.type === "reasoning") &&
        !!(part.metadata && part.metadata.studioPromptExpansionPreview)
    }
    // 扩写预览分片文本(对齐 expansionPreviewParts:按 resultPartID 归属过滤,取最大 attempt,按 id 排序拼接)
    function studioExpansionPreviewText(assistantParts, resultPart) {
      if (!resultPart) return ""
      var resultPartID = resultPart.id
      var previews = assistantParts.filter(function (part) {
        if (!studioIsPreviewPart(part)) return false
        return (part.metadata.studioPromptExpansionPreview || {}).resultPartID === resultPartID
      })
      if (previews.length === 0) return ""
      var maxAttempt = Math.max(0, ...previews.map(function (part) { return (part.metadata.studioPromptExpansionPreview || {}).attempt || 0 }))
      return previews
        .filter(function (part) { return (part.metadata.studioPromptExpansionPreview || {}).attempt === maxAttempt })
        .sort(function (left, right) { return String(left.id || "").localeCompare(String(right.id || "")) })
        .map(function (part) { return part.text || "" })
        .join("")
        .trim()
    }

    // 从用户消息文本提取真实需求(对齐 turns.ts extractUserDemand)
    function extractStudioUserDemand(text) {
      var marker = "用户需求："
      var index = text.lastIndexOf(marker)
      var content = index === -1 ? text : text.slice(index + marker.length)
      var stopMarkers = [
        "\n能力：", "\n风格模型：", "\n画幅比例：", "\n生成数量：",
        "\n当前选中的生图工具：", "\n工具参数JSON：", "\n调用生图工具", "\n输出时先简短说明",
      ]
      var stopIndex = stopMarkers
        .map(function (m) { return content.indexOf(m) })
        .filter(function (i) { return i >= 0 })
        .sort(function (a, b) { return a - b })[0]
      return content
        .slice(0, stopIndex !== undefined ? stopIndex : content.length)
        .split("\n")
        .filter(function (line) { return !line.startsWith("工具参数JSON：") && !line.startsWith("调用生图工具") })
        .join("\n")
        .trim()
    }

    function sanitizeStudioAssistantText(text) {
      if (!text) return ""
      return text
        .split("\n")
        .filter(function (line) { return !line.includes("当前选中的生图工具") && !line.includes("内部模型") })
        .join("\n")
        .trim()
    }

    function isRenderableImageUrl(url) {
      if (!url) return false
      if (url.includes("visual.volcengineapi.com?Action=CVProcess&Version=2022-08-31")) return false
      if (isRenderableVideoUrl(url)) return false
      return /^https?:\/\/\S+|^data:image\/[a-z0-9.+-]+;base64,\S+$/i.test(url)
    }

        img.alt = ""
        img.loading = "lazy"
        if (/^https?:\/\//i.test(url) || /^data:image\//i.test(url)) {
          img.src = url
        } else {
          var basename = String(url).split(/[/\\]/).pop()
          var blobEntry = imageBlobMap[basename]
          if (!blobEntry) continue
          ;(function (imgEl, blobUrl, mime) {
            loadBlobImage(blobUrl, token, mime).then(function (resolvedUrl) { imgEl.src = resolvedUrl })
          })(img, blobEntry.url, blobEntry.mime)
        }
        box.appendChild(img)
      }
      if (box.children.length > 0) el.appendChild(box)
    }

    // 单轮渲染(对齐 studio-conversation.tsx StudioConversation 的 JSX 分支)
    function buildStudioTurnElement(turn, imageBlobMap, token) {
      var el = document.createElement("div")
      el.className = "studio-conversation-turn"

      appendStudioInputImages(turn, el, imageBlobMap, token)

      // 用户气泡(guide 轮隐藏;文案对齐 turn.userText || "Octo Studio")
      if (!turn.hideUserBubble && !(turn.recommendation && turn.recommendation.kind === "guide")) {
        var bubble = document.createElement("div")
        bubble.className = "studio-user-bubble"
        bubble.appendChild(buildStudioUserBubbleText(turn.userText || "Octo Studio", turn.mentionImages))
        el.appendChild(bubble)
      }

      if (turn.kind === "editor") {
        // 编辑区入口(对齐 .studio-assistant-editor-link;分享页静态展示)
        var link = document.createElement("span")
        link.className = "studio-assistant-editor-link"
        link.appendChild(document.createTextNode("点击前往编辑区"))
        var arrow = document.createElement("img")
        arrow.src = "./studio/stutdio_arrow_right.png"
        arrow.alt = ""
        arrow.className = "studio-editor-link-arrow"
        link.appendChild(arrow)
        el.appendChild(link)
        return el
      }

      // 助手文案:扩写 running/cancelling/completed 时由扩写状态/预览/审阅卡替代(对齐 studio-conversation result 分支)
      var suppressAssistantText = turn.recommendation && turn.recommendation.kind === "result" &&
        ["running", "cancelling", "completed"].indexOf(turn.recommendation.status) !== -1
      if (suppressAssistantText) {
        if (turn.recommendation.status === "completed") {
          el.appendChild(buildStudioExpansionReview(turn))
        } else if (turn.recommendation.status === "running" && turn.previewText) {
          el.appendChild(buildStudioExpansionPreview(turn.previewText))
        } else {
          var expansionStatus = document.createElement("div")
          expansionStatus.className = "studio-prompt-expansion"
          expansionStatus.setAttribute("role", "status")
          expansionStatus.textContent = turn.recommendation.status === "cancelling" ? "正在取消扩写…" : "正在丰富提示词…"
          el.appendChild(expansionStatus)
        }
      } else {
        var copy = sanitizeStudioAssistantText(turn.assistantText)
        if (copy) {
          var copyEl = document.createElement("div")
          copyEl.className = "studio-assistant-copy"
          copyEl.textContent = copy
          el.appendChild(copyEl)
        }
      }

      // guide 轮:静态快捷入口(对齐 .studio-recommendation-shortcuts)
      if (turn.recommendation && turn.recommendation.kind === "guide") {
        var shortcuts = document.createElement("div")
        shortcuts.className = "studio-recommendation-shortcuts"
        for (var s = 0; s < STUDIO_RECOMMENDATION_SHORTCUT_LABELS.length; s++) {
          var shortcut = document.createElement("span")
          shortcut.className = "studio-recommendation-shortcut"
          var label = document.createElement("span")
          label.textContent = STUDIO_RECOMMENDATION_SHORTCUT_LABELS[s]
          shortcut.appendChild(label)
          shortcut.insertAdjacentHTML("beforeend",
            '<svg viewBox="0 0 6 11" width="14" height="14" aria-hidden="true"><path d="M0.5 0.5l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1"/></svg>')
          shortcuts.appendChild(shortcut)
        }
        el.appendChild(shortcuts)
      }

      // 结果卡片(推荐/编辑轮不展示)
      if (turn.result) el.appendChild(buildStudioResultCard(turn.result, token, imageBlobMap))
      return el
    }

    // 图片网格方向(对齐 studio-result-card.tsx:媒体尺寸优先,回退画幅比例;横构图 4 张换行)
    function studioGridClass(media, aspectRatio) {
      var first = media[0]
      var is1x1, isPortrait, isLandscape
      if (first && first.width && first.height) {
        is1x1 = first.width === first.height
        isPortrait = first.height > first.width
        isLandscape = first.width > first.height
      } else {
        var ratio = aspectRatio || "1:1"
        is1x1 = ratio === "1:1"
        isPortrait = STUDIO_PORTRAIT_RATIOS.indexOf(ratio) !== -1
        isLandscape = STUDIO_LANDSCAPE_RATIOS.indexOf(ratio) !== -1
      }
      var count = media.length
      // 注意:app 的 StudioResultCard 实际从不应用 multi-landscape-4(studio-03.css 中为死样式),不追加
      if (isPortrait) return count === 1 ? "single-portrait" : "multi-portrait"
      if (isLandscape) return count === 1 ? "single-landscape" : "multi-landscape"
      return count === 1 ? "single-1x1" : "multi-1x1"
    }

    // 结果卡片(对齐 studio-result-card.tsx:能力图标 + 标签 + 状态徽标(含 creating/queued/running 细分
    // + 排队数 + 进度条) + 创建时间 + 网格/错误;分享页不出取消/重编/刷新等交互按钮)
    function buildStudioResultCard(result, token, imageBlobMap) {
      var generating = ["creating", "queued", "running"].indexOf(result.status) !== -1
      var card = document.createElement("div")
      card.className = "studio-result-card" +
        (generating ? " generating" : "") +
        (result.status === "queued" ? " queued" : "") +
        (result.status === "succeeded" ? " complete"
          : ["failed", "create_failed"].indexOf(result.status) !== -1 ? " failed"
          : result.status === "abnormal" ? " abnormal" : "")
      var statusLabel =
        result.status === "succeeded" ? "生成完成" :
        result.status === "create_failed" ? "创建失败" :
        result.status === "abnormal" ? "状态异常" :
        result.status === "running" ? "生成中" :
        result.status === "queued" ? "排队中" :
        result.status === "creating" ? "创建中" : "生成失败"
      var header = document.createElement("div")
      header.className = "studio-result-progress-header"
      var left = document.createElement("div")
      left.className = "studio-result-progress-left"
      var title = document.createElement("div")
      title.className = "studio-result-progress-title"
      var icon = document.createElement("span")
      icon.className = studioCapabilityIconClass(result.capability)
      title.appendChild(icon)
      title.appendChild(document.createTextNode(studioCapabilityLabel(result.capability)))
      var status = document.createElement("span")
      status.className = "studio-result-progress-status"
      status.textContent = statusLabel
      left.appendChild(title)
      left.appendChild(status)
      // 排队人数(对齐 StudioResultCard:queued 时显示「当前排队N人」)
      if (result.status === "queued") {
        left.appendChild(makeSpan("studio-result-queue-count", "当前排队" + (result.order || 1) + "人"))
      }
      // 进度条 + 百分比(对齐 StudioResultCard:running 时显示 progress track/fill/percent)
      if (result.status === "running") {
        var percent = Math.round(Math.min(100, Math.max(0, result.progress ?? 0)))
        var track = document.createElement("div")
        track.className = "studio-result-progress-track"
        track.setAttribute("role", "progressbar")
        track.setAttribute("aria-label", studioCapabilityLabel(result.capability) + statusLabel)
        track.setAttribute("aria-valuemin", "0")
        track.setAttribute("aria-valuemax", "100")
        track.setAttribute("aria-valuenow", String(percent))
        var fill = document.createElement("div")
        fill.className = "studio-result-progress-fill"
        fill.style.width = percent + "%"
        track.appendChild(fill)
        left.appendChild(track)
        left.appendChild(makeSpan("studio-result-progress-percent", percent + "%"))
      }
      header.appendChild(left)
      card.appendChild(header)
      if (result.createdAt) {
        var meta = document.createElement("div")
        meta.className = "studio-result-meta"
        meta.textContent = "创建时间：" + new Date(result.createdAt).toLocaleTimeString("zh-CN", { hour: "2-digit", minute: "2-digit" })
        card.appendChild(meta)
      }
      var preview = document.createElement("div")
      preview.className = "studio-result-progress-preview"
      if (result.status === "succeeded" && result.media.length > 0) {
        var grid = document.createElement("div")
        grid.className = "studio-result-grid " + studioGridClass(result.media, result.aspectRatio)
        for (var i = 0; i < result.media.length; i++) {
          grid.appendChild(buildStudioGridThumb(result.media[i], result, token, imageBlobMap))
        }
        preview.appendChild(grid)
      } else if (["failed", "create_failed", "abnormal"].indexOf(result.status) !== -1) {
        // 失败/异常:错误文案(对齐 .studio-result-error-box;abnormal 为固定提示文案)
        var errorBox = document.createElement("div")
        errorBox.className = "studio-result-error-box"
        var errorIcon = document.createElement("img")
        errorIcon.src = "./studio/studio-result-error.svg"
        errorIcon.alt = ""
        errorIcon.className = "studio-result-error-icon"
        errorBox.appendChild(errorIcon)
        errorBox.appendChild(makeSpan("studio-result-error",
          result.status === "abnormal"
            ? "生成耗时较长，状态异常，请刷新状态"
            : result.error || "生成失败"))
        preview.appendChild(errorBox)
      }
      card.appendChild(preview)
      return card
    }

    // 视频时长格式化(对齐 studio-media.ts formatStudioThumbnailDuration:MM:SS)
    function studioFormatDuration(value) {
      var duration = typeof value === "string" ? Number(value) : value
      if (duration === undefined || !Number.isFinite(duration) || duration < 0) return ""
      var seconds = Math.floor(duration)
      return String(Math.floor(seconds / 60)).padStart(2, "0") + ":" + String(seconds % 60).padStart(2, "0")
    }

    // 缩略图来源(对齐 studio-media.ts thumbnailMediaSrc:ready 且为 thumbnails/ 相对路径才用,
    // 经 manifest files blob 解析;导出后的 thumbnailUrl 形如 .octo/{sessionId}/thumbnails/xxx.webp)
    function studioThumbnailEntry(item, imageBlobMap) {
      if (!item.thumbnailUrl || item.thumbnailStatus !== "ready") return undefined
      if (/^(https?:|data:)/i.test(item.thumbnailUrl)) return { url: item.thumbnailUrl, mime: undefined, isBlob: false }
      var basename = item.thumbnailUrl.split(/[/\\]/).pop()
      return imageBlobMap && imageBlobMap[basename]
        ? { url: imageBlobMap[basename].url, mime: imageBlobMap[basename].mime, isBlob: true }
        : undefined
    }

    // 网格内单个媒体(对齐 StudioMediaThumbnail:缩略图优先、失败回退原图/占位;视频带 MM:SS 时长徽标)
    function buildStudioGridThumb(item, result, token, imageBlobMap) {
      var thumb = document.createElement("div")
      thumb.className = "studio-result-thumb"
      var original = item.originalUrl || item.url
      var originalHttp = /^https?:\/\//i.test(original) ? original : ""
      var thumbnail = studioThumbnailEntry(item, imageBlobMap)

      var applySource = function (source, fallback) {
        // source 形如 { url, mime?, isBlob } 或字符串;失败时回退 fallback(如原图),再失败显示占位
        var img = document.createElement("img")
        img.className = "studio-result-thumb-media"
        img.alt = ""
        img.loading = "lazy"
        img.decoding = "async"
        img.addEventListener("error", function () {
          if (fallback) {
            if (img.src !== fallback) { img.src = fallback; return }
            img.remove()
          }
          thumb.appendChild(studioMediaPlaceholder(item.kind))
        })
        if (typeof source === "string") {
          img.src = source
        } else {
          ;(function (imgEl, blobUrl, mime) {
            loadBlobImage(blobUrl, token, mime).then(function (resolvedUrl) { imgEl.src = resolvedUrl })
          })(img, source.url, source.mime)
        }
        return img
      }

      if (item.kind === "video") {
        // 对齐 .studio-result-thumb-video:缩略图优先,无缩略图回退 muted 预加载视频
        var wrapper = document.createElement("span")
        wrapper.className = "studio-result-thumb-video"
        if (thumbnail) {
          wrapper.appendChild(applySource(thumbnail, originalHttp))
        } else if (isRenderableVideoUrl(item.url)) {
          var video = document.createElement("video")
          video.className = "studio-result-thumb-media"
          video.src = item.url
          video.muted = true
          video.setAttribute("playsinline", "")
          video.setAttribute("preload", "metadata")
          video.addEventListener("error", function () {
            video.remove()
            wrapper.appendChild(studioMediaPlaceholder("video"))
          })
          wrapper.appendChild(video)
        } else {
          wrapper.appendChild(studioMediaPlaceholder("video"))
        }
        var badgeText = studioFormatDuration(item.duration !== undefined ? item.duration : result.duration)
        if (badgeText) {
          var badge = document.createElement("span")
          badge.className = "studio-file-manager-media-video-badge studio-result-video-duration-badge"
          badge.appendChild(makeSpan("studio-file-manager-media-video-badge-text", badgeText))
          wrapper.appendChild(badge)
        }
        thumb.appendChild(wrapper)
        // 分享页无画布:点击缩略图在新标签打开原始视频(远程地址可用时)
        if (originalHttp) {
          thumb.style.cursor = "pointer"
          thumb.title = "打开视频"
          thumb.addEventListener("click", function () {
            window.open(originalHttp, "_blank", "noopener")
          })
        }
        return thumb
      }

      // 图片:缩略图 ready 用缩略图,否则原图(对齐 thumbnailMediaSrc image 分支)
      if (thumbnail) {
        thumb.appendChild(applySource(thumbnail, originalHttp))
      } else if (item.isBlob) {
        thumb.appendChild(applySource({ url: item.url, mime: "image/png" }, originalHttp))
      } else if (isRenderableImageUrl(item.url)) {
        thumb.appendChild(applySource(item.url, ""))
      } else {
        thumb.appendChild(studioMediaPlaceholder("image"))
      }
      return thumb
    }

    // 媒体占位(对齐 .studio-media-thumbnail-placeholder 及 image/video 图标)
    function studioMediaPlaceholder(kind) {
      var placeholder = document.createElement("span")
      placeholder.className = "studio-media-thumbnail-placeholder studio-result-thumb-media"
      placeholder.setAttribute("aria-label", kind === "video" ? "视频缩略图" : "图片缩略图")
      placeholder.appendChild(makeSpan(kind === "video" ? "studio-media-thumbnail-video-icon" : "studio-media-thumbnail-image-icon", ""))
      return placeholder
    }

    // studio 会话主渲染(对齐 studio 页面 StudioConversation)
    function renderStudioConversation(manifest, session, filePath, token, list) {
      document.body.dataset.module = "studio"
      list.innerHTML = ""
      var conversation = document.createElement("div")
      conversation.className = "studio-conversation"
      var imageBlobMap = filePath ? buildImageBlobMap(manifest, filePath) : {}
      var turns = buildStudioTurns(session.messages || [], imageBlobMap)
      for (var i = 0; i < turns.length; i++) {
        conversation.appendChild(buildStudioTurnElement(turns[i], imageBlobMap, token))
      }
      if (conversation.children.length === 0) {
        showEmptyState()
        return
      }
      list.appendChild(conversation)
    }

  </script>
</body>
</html>
